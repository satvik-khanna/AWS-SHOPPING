<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping Agent</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <button type="button" id="menu-open" class="btn btn-ghost btn-icon" aria-label="Menu" aria-expanded="false" title="Menu">
        <svg class="octicon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path d="M1 2.75A.75.75 0 0 1 1.75 2h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 2.75Zm0 5A.75.75 0 0 1 1.75 7h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 7.75ZM1.75 12h12.5a.75.75 0 0 1 0 1.5H1.75a.75.75 0 0 1 0-1.5Z"></path>
        </svg>
      </button>
      <h1>Shopping Agent</h1>
    </div>
    <div class="top-actions">
      <button type="button" id="search-focus" class="btn btn-ghost btn-icon" aria-label="Search" title="Search (/)">
        <svg class="octicon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"></path>
        </svg>
      </button>
      <button type="button" id="share-link" class="btn btn-ghost btn-icon" aria-label="Copy link" title="Copy deep link">
        <svg class="octicon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path d="m7.775 3.275 1.25-1.25a3.5 3.5 0 1 1 4.95 4.95l-2.5 2.5a3.5 3.5 0 0 1-4.95 0 .751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018 1.998 1.998 0 0 0 2.83 0l2.5-2.5a2.002 2.002 0 0 0-2.83-2.83l-1.25 1.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042Zm-4.69 9.64a1.998 1.998 0 0 0 2.83 0l1.25-1.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042l-1.25 1.25a3.5 3.5 0 1 1-4.95-4.95l2.5-2.5a3.5 3.5 0 0 1 4.95 0 .751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018 1.998 1.998 0 0 0-2.83 0l-2.5 2.5a1.998 1.998 0 0 0 0 2.83Z"></path>
        </svg>
      </button>
      <div class="mode" id="mode" hidden></div>
      <button type="button" id="theme-toggle" class="btn btn-ghost btn-icon" aria-label="Theme" title="Toggle theme"></button>
    </div>
  </div>
</header>

<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" aria-hidden="true" aria-label="Navigation menu">
  <div class="drawer-head">
    <span>Menu</span>
    <button type="button" id="menu-close" class="btn btn-ghost btn-icon" aria-label="Close">
      <svg class="octicon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"></path>
      </svg>
    </button>
  </div>

  <div class="drawer-section">
    <h3>Jump from link</h3>
    <form id="link-jump-form" class="jump-form" autocomplete="off">
      <input id="link-jump-input" type="text" placeholder="URL or store slug…" aria-label="Store URL or slug">
      <button type="submit" class="btn btn-primary btn-icon" aria-label="Jump" title="Open">
        <svg class="octicon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M8.22 2.97a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042l2.97-2.97H3.75a.75.75 0 0 1 0-1.5h7.44L8.22 4.03a.75.75 0 0 1 0-1.06Z"></path>
        </svg>
      </button>
    </form>
    <div class="store-links">
      <button type="button" class="drawer-item" data-store-slug="tokyo-camera">/s/tokyo-camera</button>
      <button type="button" class="drawer-item" data-store-slug="seiko-vintage">/s/seiko-vintage</button>
      <button type="button" class="drawer-item" data-store-slug="retro-handheld">/s/retro-handheld</button>
    </div>
  </div>

  <div class="drawer-section">
    <h3>Recent</h3>
    <ul id="history-list" class="drawer-list"></ul>
  </div>

  <div class="drawer-section">
    <h3>Memory</h3>
    <div id="prefs" class="prefs"></div>
  </div>

  <div class="drawer-section">
    <h3>Trace <span id="steps-count" class="count-pill">0</span></h3>
    <ol id="trail" class="trail"></ol>
  </div>
</aside>

<main class="chat-shell">
  <div id="thread" class="thread" aria-live="polite">
    <div id="empty" class="empty">
      <div class="examples" id="examples" aria-label="Quick searches">
        <button type="button" class="example-chip" data-q="Fujifilm X100V" data-budget="900">Fujifilm X100V · $900</button>
        <button type="button" class="example-chip" data-q="Seiko SARB033" data-budget="600">Seiko SARB033 · $600</button>
        <button type="button" class="example-chip" data-q="Game Boy Micro" data-budget="250">Game Boy Micro · $250</button>
      </div>
    </div>

    <div id="user-turn" class="msg msg-user" hidden>
      <div class="bubble" id="user-bubble"></div>
    </div>

    <div id="skeleton" class="msg msg-agent skeleton" aria-busy="true" aria-label="Loading" hidden>
      <div class="sk-row"></div>
      <div class="sk-row"></div>
      <div class="sk-row"></div>
      <div class="sk-block"></div>
    </div>

    <div id="results" class="msg msg-agent" hidden>
      <div class="results-bar">
        <span class="agent-lead" id="picks-sub"></span>
        <input id="quick-filter" class="quick-filter" type="search" placeholder="Filter…" aria-label="Filter results">
      </div>

      <div id="picks" class="picks"></div>
      <div id="skipped" class="skipped" hidden></div>
      <section class="cost-panel" id="cost-panel" aria-label="Landed cost" hidden></section>
      <div id="gate" class="gate" aria-live="polite"></div>
    </div>
  </div>

  <div class="composer-wrap">
    <p class="error" id="error" role="alert" hidden></p>
    <form id="form" class="composer" autocomplete="off">
      <div class="composer-row">
        <label class="sr-only" for="query">Search</label>
        <input id="query" name="query" type="text" value="Fujifilm X100V" maxlength="300" placeholder="Search item… (e.g. Fujifilm X100V $900)" required>
        <label class="ctrl" title="Max budget USD">
          <span>$</span>
          <input id="budget" name="budget" type="number" value="900" min="1" step="1" required>
        </label>
        <label class="ctrl" title="Ship to">
          <input id="ship_to" name="ship_to" type="text" value="US-CA" maxlength="40" required>
        </label>
        <label class="ctrl" title="Min condition">
          <select id="condition_min" name="condition_min">
            <option value="">Any</option>
            <option value="fair">Fair+</option>
            <option value="good">Good+</option>
            <option value="like_new">Like new</option>
            <option value="new">New</option>
          </select>
        </label>
        <button id="go" type="submit" class="btn btn-primary btn-icon" aria-label="Search" title="Send">
          <svg class="octicon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path d="M8.22 2.97a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042l2.97-2.97H3.75a.75.75 0 0 1 0-1.5h7.44L8.22 4.03a.75.75 0 0 1 0-1.06Z"></path>
          </svg>
        </button>
      </div>
    </form>
  </div>
</main>

<div id="toast" class="toast" role="status" hidden></div>

<script src="/static/modules/icons.js"></script>
<script src="/static/modules/menu.js"></script>
<script src="/static/modules/search.js"></script>
<script src="/static/modules/links.js"></script>
<script src="/static/modules/commerce.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
