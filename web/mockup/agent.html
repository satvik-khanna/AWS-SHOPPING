<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Niche</title>
<!--
  Basic components mockup, styled after diabrowser.com.
  Dia uses licensed fonts (Exposure serif, ABC Oracle sans, ABC Favorit Mono);
  the free stand-ins here are Instrument Serif, Geist and Geist Mono.
  Palette is Dia's: #FBFAF6 paper, black ink at 100/50/10%, and the
  #c679c4 → #fa3d1d → #ffb005 → #e1e1fe → #0358f7 accent gradient.
  Standalone, fake data, open directly in a browser.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFAF6; --surface:#FFFFFF; --sunk:#F3F2EE;
  --ink:#111111; --ink-50:rgba(0,0,0,.5); --ink-35:rgba(0,0,0,.35); --line:rgba(0,0,0,.1); --line-2:rgba(0,0,0,.06);
  --btn:#111111; --btn-ink:#FFFFFF; --sky:#D3EAFF;
  --blue:#0358F7; --red:#FA3D1D; --yellow:#FFB005; --pink:#C679C4; --lilac:#E1E1FE;
  --rainbow:linear-gradient(90deg,#c679c4,#fa3d1d,#ffb005,#e1e1fe,#0358f7,#c679c4);
  --serif:"Instrument Serif","Exposure VAR",Georgia,serif;
  --sans:"Geist","ABC Oracle",-apple-system,Helvetica,sans-serif;
  --mono:"Geist Mono","ABC Favorit Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1B1B1B; --surface:#232323; --sunk:#2B2B2B;
  --ink:#F8F8F8; --ink-50:rgba(248,248,248,.55); --ink-35:rgba(248,248,248,.38); --line:rgba(248,248,248,.12); --line-2:rgba(248,248,248,.07);
  --btn:#F8F8F8; --btn-ink:#111111; --sky:#0F2744;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 120px}

/* page backdrop: light-blue gradient waves drawn by gradient-waves.js, fixed behind the whole page so they stay
   while you scroll. The CSS gradient underneath is also what shows when WebGL2 is unavailable. */
.waves{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,var(--sky),var(--paper) 140%)}

/* header */
.nav{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
.logo{font-family:var(--serif);font-size:26px;line-height:1;display:flex;align-items:center;gap:10px}
.logo i{width:18px;height:18px;border-radius:50%;background:conic-gradient(from 200deg,#c679c4,#fa3d1d,#ffb005,#e1e1fe,#0358f7,#c679c4)}
.nav-links{display:flex;gap:22px;font-size:14px;color:var(--ink-50)}

/* small mono section labels */
.label{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-50);display:flex;gap:10px;align-items:center;margin:0 0 14px}
.label b{font-weight:500;color:var(--ink)}

/* buttons */
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:500;font-size:15px;background:transparent;transition:opacity .15s,transform .15s}
.btn:active{transform:scale(.98)}
.btn-dark{background:var(--btn);color:var(--btn-ink)}
.btn-dark:hover{opacity:.85}
.btn-quiet{color:var(--ink-50)}
.btn-quiet:hover{color:var(--ink)}
.btn-line{box-shadow:inset 0 0 0 1px var(--line)}
.btn-line:hover{box-shadow:inset 0 0 0 1px var(--ink-35)}
.btn[disabled]{opacity:.35;cursor:not-allowed}

/* 1. hero + prompt */
.hero{text-align:center;padding:72px 0 36px;transition:padding .6s cubic-bezier(.2,.8,.2,1)}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(44px,7vw,76px);line-height:1;letter-spacing:-.02em;margin:0}
.hero h1 em{font-style:italic}
.hero p{margin:16px auto 0;max-width:460px;color:var(--ink-50);font-size:17px}

.prompt-ring{max-width:760px;margin:0 auto;border-radius:28px;padding:1.5px;background:var(--line);transition:background .3s}
#ring{max-height:340px;transform-origin:50% 100%;transition:background .3s,max-height .6s cubic-bezier(.2,.8,.2,1),opacity .3s,transform .55s cubic-bezier(.4,0,.2,1),padding .6s}
body.asked #ring{max-height:0;padding:0;opacity:0;transform:translateY(120px) scale(.85);overflow:hidden;pointer-events:none}
body.asked .hero{padding-bottom:0}
body.asked .work{margin-top:48px}
.prompt-ring.working{background:var(--rainbow);background-size:200% 100%;animation:flow 3s linear infinite}
@keyframes flow{to{background-position:-200% 0}}
.prompt{background:var(--surface);border-radius:26.5px;padding:18px 18px 14px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 12px 40px rgba(0,0,0,.04)}
.prompt textarea{display:block;width:100%;min-height:84px;resize:none;border:0;outline:none;background:transparent;color:var(--ink);font:400 19px/1.45 var(--sans);padding:4px 6px}
.prompt textarea::placeholder{color:var(--ink-35)}
.prompt-row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.notify{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-50);margin-right:auto;padding-left:6px;cursor:pointer}
.switch{appearance:none;width:30px;height:18px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.switch:checked{background:var(--blue)}
.switch:checked::after{transform:translateX(12px)}
.kbd{font-family:var(--mono);font-size:12px;opacity:.6;margin-left:6px}
.examples{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px auto 0;max-width:760px}
.ex{border:0;background:transparent;box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--ink-50)}
.ex:hover{color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink-35)}

/* docked prompt: once the big prompt box scrolls away, a compact one rides along the bottom */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 16px 18px;pointer-events:none;transform:translateY(130%);opacity:0;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .3s}
.dock.show{transform:none;opacity:1}
.dock .prompt-ring{max-width:620px;border-radius:999px;pointer-events:auto;box-shadow:0 14px 44px rgba(0,0,0,.12)}
.dock-form{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:6px 6px 6px 22px}
.dock-form input{flex:1;min-width:0;height:38px;border:0;outline:none;background:transparent;color:var(--ink);font:400 16px/1.4 var(--sans);text-overflow:ellipsis}
.dock-form input::placeholder{color:var(--ink-35)}
.dock-go{flex:none;width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:17px;line-height:1}
.dock.show ~ .toast{bottom:92px}

/* work area */
.work{display:grid;grid-template-columns:280px minmax(0,1fr);gap:48px;margin-top:88px}
@media (max-width:820px){.work{grid-template-columns:1fr;gap:40px}}
.work[hidden]{display:none}

/* 2. plan */
.plan ol{list-style:none;margin:0;padding:0}
.plan li{display:grid;grid-template-columns:28px 1fr 18px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line-2);color:var(--ink-35);transition:color .3s}
.plan li:last-child{border-bottom:1px solid var(--line-2)}
.plan .num{font-family:var(--mono);font-size:12px}
.plan .st{justify-self:end;align-self:center;width:8px;height:8px;border-radius:50%}
.plan li.doing{color:var(--ink)}
.plan li.doing .st{background:var(--rainbow);background-size:300% 100%;animation:flow 1.5s linear infinite;width:10px;height:10px}
.plan li.done{color:var(--ink)}
.plan li.done .st{width:auto;height:auto;background:none;font-size:13px}
.plan li.done .st::after{content:"✓"}
.plan-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-family:var(--mono);font-size:12px;color:var(--ink-50)}

/* 3. live browser */
.live-h{display:flex;justify-content:space-between}
.state{display:inline-flex;align-items:center;gap:6px}
.state::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);animation:blink 1.4s infinite}
.state.off::before{background:var(--ink-35);animation:none}
@keyframes blink{50%{opacity:.25}}
.browser{border-radius:20px;overflow:hidden;background:var(--surface);box-shadow:0 0 0 1px var(--line),0 24px 60px -20px rgba(0,0,0,.12);position:relative}
.chrome{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--sunk)}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.url{flex:1;text-align:center;font-family:var(--mono);font-size:12px;color:var(--ink-50);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.screen{height:340px;position:relative;overflow:hidden;font-size:13px;background:#fff;color:#111}
.caption{margin:16px 0 0;font-family:var(--serif);font-size:24px;line-height:1.2;min-height:1.2em}
.caption em{color:var(--ink-50)}
.cursor{position:absolute;width:18px;height:18px;left:50%;top:60%;transition:left .8s cubic-bezier(.4,0,.2,1),top .8s cubic-bezier(.4,0,.2,1);pointer-events:none;z-index:5}
.cursor svg{width:18px;height:18px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.cursor.click::after{content:"";position:absolute;left:-8px;top:-8px;width:20px;height:20px;border-radius:50%;border:2px solid var(--blue);animation:ping .5s ease-out}
@keyframes ping{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
.hl{box-shadow:0 0 0 2px var(--blue)!important;border-radius:8px}

/* fake third-party pages inside the browser (kept neutral on purpose) */
.site{padding:16px;font-family:-apple-system,Helvetica,sans-serif}
.site-top{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.site-logo{font-weight:800;color:#e11d48}
.site-search{flex:1;border:1px solid #e5e7eb;border-radius:6px;padding:5px 8px;color:#555;min-height:28px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:1px solid #eee;border-radius:8px;padding:8px}
.tile .img,.detail .img{border-radius:6px;background:#f3f4f6;display:grid;place-items:center}
.tile .img{height:90px;margin-bottom:6px;font-size:28px}
.tile .p{font-weight:700}
.tile .n{color:#666;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail{display:grid;grid-template-columns:160px 1fr;gap:14px}
.detail .img{height:160px;font-size:56px}
.fakebtn{display:inline-block;margin-top:10px;background:#e11d48;color:#fff;border-radius:6px;padding:7px 14px;font-weight:700}
.jp{color:#888;font-size:12px}
.tr{background:#fef3c7;border-radius:4px;padding:0 3px}
.cartrow{display:flex;justify-content:space-between;border:1px solid #eee;border-radius:8px;padding:10px;margin-bottom:8px}
.paused{margin-top:10px;padding:8px 10px;border-radius:8px;background:#fff7ed;color:#c2410c;font-weight:600}

/* 4. results */
.results{margin-top:96px}
.results[hidden]{display:none}
.results h2{font-family:var(--serif);font-weight:400;font-size:clamp(34px,5vw,48px);line-height:1.05;letter-spacing:-.015em;margin:0 0 14px}
.handoff{margin:0 0 28px;font-size:15px;color:var(--ink-50)}
.handoff b{color:var(--ink);font-weight:500}
.handoff a{color:var(--ink);text-underline-offset:3px}
.opts{display:grid;gap:0;border-top:1px solid var(--line)}
.opt{display:grid;grid-template-columns:64px 1fr auto 22px;align-items:center;gap:18px;padding:18px 14px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:0;transition:background .2s}
.opt:hover{background:var(--line-2)}
.opt input{appearance:none;width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink-35);margin:0;cursor:pointer}
.opt input:checked{box-shadow:inset 0 0 0 5px var(--ink)}
.opt .img{width:64px;height:64px;border-radius:14px;background:var(--sunk);display:grid;place-items:center;font-size:28px}
.opt .t{font-size:17px;font-weight:500}
.opt .s{font-size:14px;color:var(--ink-50)}
.opt .price{text-align:right;font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.opt .price small{display:block;font-family:var(--mono);font-size:12px;color:var(--ink-50);font-weight:400}
.tag{display:inline-block;white-space:nowrap;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-left:8px;padding:2px 8px;border-radius:999px;background:var(--lilac);color:#2a2a7a;vertical-align:2px}
.tag.live{background:#d9f5e3;color:#0b5a2a}
.tag.sample{background:var(--sunk);color:var(--ink-50)}
.opt .t a{color:inherit;text-underline-offset:3px}
.approve-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:28px}
.approve-row p{margin:0 auto 0 0;min-width:240px;flex:1;color:var(--ink-50)}
.approve-row p b{color:var(--ink);font-weight:500}
/* swipe to pay: drag the thumb to the end (or press Enter on it) to approve */
.swipe{position:relative;flex:0 0 300px;height:50px;border-radius:999px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none}
.swipe-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:var(--rainbow);background-size:300px 100%;opacity:.45;pointer-events:none;transition:width .25s cubic-bezier(.2,.8,.2,1)}
.swipe-label{position:relative;padding-left:40px;font-size:15px;font-weight:500;pointer-events:none;transition:opacity .15s;font-variant-numeric:tabular-nums}
.swipe-thumb{position:absolute;left:4px;top:4px;width:42px;height:42px;border-radius:50%;border:0;padding:0;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font-size:18px;line-height:1;cursor:grab;touch-action:none;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.swipe-thumb:active{cursor:grabbing}
.swipe.dragging .swipe-fill,.swipe.dragging .swipe-thumb{transition:none}
.swipe.confirmed .swipe-fill{opacity:.7}
.swipe.confirmed .swipe-label{padding-left:0;padding-right:40px}
.swipe.off{opacity:.35}
.swipe.off .swipe-thumb{cursor:not-allowed}
@media (max-width:640px){.swipe{flex-basis:100%}}
.done-msg{font-family:var(--serif);font-size:26px;line-height:1.2}
.approve-row .done-note{flex-basis:100%;font-family:var(--mono);font-size:13px}
.cartrow.sm{padding:5px 10px;margin-bottom:4px;font-size:12px;gap:10px}

/* 6. cited cost + audit trail */
.audit{margin-top:56px}
.audit .label{margin-top:56px}
.quiet{color:var(--ink-50);font-size:14px}
.cite{border-top:1px solid var(--line)}
.cite-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px) 92px;gap:6px 24px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line-2);font-size:14px}
.cite-row .amt{grid-column:3;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.cite-row.total{border-bottom-color:var(--line);font-weight:500;padding-top:16px;padding-bottom:16px}
.cite-row.total .amt{font-size:17px}
/* source chip: provider pill, rule key, as-of date */
.src{display:flex;align-items:center;gap:8px;min-width:0;font-family:var(--mono);font-size:12px;color:var(--ink-50);text-decoration:none}
.src .prov{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:2px 9px 2px 7px;border-radius:999px;background:var(--sunk);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.src .prov::before{content:"";width:6px;height:6px;border-radius:50%;background:conic-gradient(from 200deg,#c679c4,#fa3d1d,#ffb005,#e1e1fe,#0358f7,#c679c4)}
.src .key{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src .est{flex:none;font-size:11px;color:var(--ink-35)}
.src .asof{flex:none;margin-left:auto;color:var(--ink-35)}
a.src:hover .key{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
/* audit trail: a quiet timeline, one dot per event */
.trail{list-style:none;margin:0;padding:6px 0 0}
.trail li{position:relative;display:grid;grid-template-columns:7px 62px minmax(0,1fr);gap:0 14px;align-items:baseline;padding:7px 14px;font-size:14px;overflow-wrap:anywhere}
.trail li::before{content:"";position:absolute;left:17px;top:0;bottom:0;width:1px;background:var(--line)}
.trail li:first-child::before{top:17px}
.trail li:last-child::before{bottom:auto;height:17px}
.trail li:only-child::before{display:none}
.trail .dot{position:relative;align-self:start;margin-top:7px;width:7px;height:7px;border-radius:50%;background:var(--ink-35);box-shadow:0 0 0 4px var(--paper)}
.trail .kind{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-35)}
.trail li.pick .dot{background:var(--blue)}
.trail li.cart .dot{background:var(--yellow)}
.trail li.skip{color:var(--ink-50)}
.trail li.skip .dot{background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--ink-35),0 0 0 4px var(--paper)}
.trail li.you{font-weight:500}
.trail li.you .dot{background:var(--ink)}
.trail li.you .kind{color:var(--ink)}
.steps{margin-top:18px;padding:14px 0;border-radius:16px;background:var(--sunk);font-family:var(--mono);font-size:12px;color:var(--ink-50)}
.steps:empty{display:none}
.steps p{margin:0 0 8px;padding:0 14px}
.steps p:last-child{margin-bottom:0}
.steps .steps-h{color:var(--ink)}
.steps .warn{color:var(--red)}
.step{display:grid;grid-template-columns:70px 150px 56px minmax(0,1fr);gap:12px;padding:3px 14px;overflow-wrap:anywhere}
@media (max-width:640px){
  .cite-row{grid-template-columns:minmax(0,1fr) auto}.cite-row .amt{grid-column:2;grid-row:1}.cite-row .src{grid-column:1/-1;grid-row:2}
  .trail li{grid-template-columns:7px minmax(0,1fr)}.trail .kind{grid-column:2}.trail .txt{grid-column:2}
  .step{grid-template-columns:70px minmax(0,1fr)}.step span:nth-child(n+3){grid-column:2}
}

/* 8. history panel: past searches (this browser) and the agent's memory as a graph */
.nav-btn{border:0;background:none;padding:0;font:inherit;color:inherit}
.nav-btn:hover{color:var(--ink)}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:40;width:min(480px,100vw);background:var(--paper);box-shadow:-24px 0 60px rgba(0,0,0,.12);
  transform:translateX(102%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.show{transform:none}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:22px 22px 10px}
.drawer-h h2{margin:0;font-family:var(--serif);font-weight:400;font-size:32px;line-height:1}
.drawer-x{border:0;background:none;font-size:24px;line-height:1;color:var(--ink-50);padding:4px 8px}
.drawer-x:hover{color:var(--ink)}
.tabs{display:flex;gap:6px;padding:4px 22px 14px}
.tab{border:0;border-radius:999px;padding:6px 14px;font-size:14px;background:transparent;color:var(--ink-50);box-shadow:inset 0 0 0 1px var(--line)}
.tab[aria-selected="true"]{background:var(--btn);color:var(--btn-ink);box-shadow:none}
.drawer-body{flex:1;overflow:auto;padding:0 22px 28px}
.hist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.hist li{border-bottom:1px solid var(--line-2);padding:14px 0}
.hist-q{display:block;width:100%;text-align:left;border:0;background:none;padding:0;font-size:15px;font-weight:500;color:var(--ink)}
.hist-q:hover{text-decoration:underline;text-underline-offset:3px}
.hist-meta{display:flex;gap:8px;align-items:center;margin-top:3px;font-family:var(--mono);font-size:11px;color:var(--ink-35);text-transform:uppercase;letter-spacing:.04em}
.hist-meta .st-bought{color:#0b7a3b}.hist-meta .st-skipped{color:var(--red)}
.hist-items{list-style:none;margin:8px 0 0;padding:0}
.hist-items li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:baseline;border:0;padding:3px 0;font-size:13px;color:var(--ink-50)}
.hist-items li span:nth-child(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-items li b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.hist-items li.chosen{color:var(--ink)}
.hist-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px;color:var(--ink-50)}
.hist-foot button{border:0;background:none;padding:0;color:var(--ink-50);text-decoration:underline;text-underline-offset:3px}
.hist-foot button:hover{color:var(--red)}
.empty{padding:28px 0;color:var(--ink-50);font-size:14px}
.graph-wrap{position:relative;border-radius:18px;background:var(--surface);box-shadow:0 0 0 1px var(--line);overflow:hidden}
.graph{display:block;width:100%;height:auto;aspect-ratio:1/1;touch-action:none}
.graph line{stroke:var(--ink-35);stroke-width:1;opacity:.55;transition:opacity .2s}
.graph line.bought{stroke:#16a34a;stroke-width:1.8;opacity:.9}
.graph line.rejected{stroke:var(--red);stroke-dasharray:4 3;stroke-width:1.5;opacity:.9}
.graph .node{cursor:pointer;transition:opacity .2s}
.graph .node circle{stroke:var(--surface);stroke-width:2}
.graph .node text{font:500 10px var(--sans);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.graph .node.item text,.graph .node.category text{fill:var(--ink-50);font-weight:400}
.graph.focus .node,.graph.focus line{opacity:.12}
.graph.focus .node.near,.graph.focus line.near{opacity:1}
.graph-tip{position:absolute;left:12px;right:12px;bottom:12px;padding:8px 12px;border-radius:12px;background:var(--btn);color:var(--btn-ink);font-size:13px;line-height:1.35;opacity:0;transition:opacity .15s;pointer-events:none}
.graph-tip.show{opacity:1}
.graph-tip small{display:block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.04em;opacity:.6}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 0 0;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-50)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.facts{margin-top:22px}
.facts h3{margin:0 0 8px;font-family:var(--mono);font-size:12px;font-weight:400;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-50)}
.facts ul{list-style:none;margin:0 0 18px;padding:0;border-top:1px solid var(--line)}
.facts li{padding:8px 0;border-bottom:1px solid var(--line-2);font-size:14px;overflow-wrap:anywhere}
.facts .src-note{font-size:12px;color:var(--ink-35)}

/* 5. notification */
.toast{position:fixed;z-index:30;left:50%;bottom:24px;transform:translate(-50%,24px);opacity:0;pointer-events:none;transition:.3s cubic-bezier(.2,.8,.2,1);
  width:min(440px,calc(100vw - 32px));background:var(--btn);color:var(--btn-ink);border-radius:22px;padding:14px 14px 14px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast .ic{width:10px;height:10px;border-radius:50%;background:var(--rainbow);background-size:300% 100%;flex:none}
.toast b{display:block;font-weight:500}
.toast span{font-size:14px;opacity:.65}
.toast button{margin-left:auto;border:0;background:transparent;color:inherit;opacity:.6;font-size:20px;line-height:1;padding:4px 8px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="waves" id="waves" aria-hidden="true"></div>
<div class="wrap">

  <header class="nav">
    <div class="logo">Agent Niche</div>
    <nav class="nav-links"><button class="nav-btn" id="openHistory" type="button" aria-haspopup="dialog">History</button><span>Preferences</span></nav>
  </header>

  <!-- 1. Prompt box -->
  <section class="hero">
    <h1>Find <em>niche</em> items</h1>
  </section>
  <div class="prompt-ring" id="ring">
    <form class="prompt" id="form">
      <label class="sr" for="ask">What are you looking for?</label>
      <textarea id="ask" placeholder="Find a used Fujifilm X100V in Japan under $1,800 landed, shipped to California"></textarea>
      <div class="prompt-row">
        <label class="notify"><input type="checkbox" class="switch" id="notifyMe" checked> Notify me when done</label>
        <button class="btn btn-dark" id="go" type="submit">Start<span class="kbd">↵</span></button>
      </div>
    </form>
  </div>

  <div class="work" id="work" hidden>
    <!-- 2. Plan -->
    <section class="plan" aria-labelledby="h-plan">
      <p class="label" id="h-plan">Plan</p>
      <ol id="plan"></ol>
      <div class="plan-foot"><span id="elapsed">0s</span><button class="btn btn-quiet" id="stop" type="button" style="padding:6px 0">Stop</button></div>
    </section>

    <!-- 3. Live browser -->
    <section class="live" aria-labelledby="h-live">
      <p class="label live-h" id="h-live"><span>Agent's browser</span><span class="state" id="rec">Live</span></p>
      <div class="browser">
        <div class="chrome"><span class="dots"><i></i><i></i><i></i></span><span class="url" id="url">about:blank</span><span style="width:42px"></span></div>
        <div class="screen" id="screen"></div>
        <div class="cursor" id="cursor"><svg viewBox="0 0 24 24"><path d="M3 2l7 19 2.5-7.5L20 11z" fill="#111" stroke="#fff" stroke-width="1.5"/></svg></div>
      </div>
      <p class="caption" id="caption" aria-live="polite"></p>
    </section>
  </div>

  <!-- 4. Results -->
  <section class="results" id="results" hidden aria-labelledby="h-res">
    <h2 id="h-res">Three good matches.</h2>
    <p class="handoff" id="handoff"></p>
    <div class="opts" id="opts"></div>
    <div class="approve-row" id="approveRow"></div>

    <!-- 6. Cited cost + audit trail, straight from the backend -->
    <div class="audit">
      <div id="cost"></div>
      <p class="label">Audit trail</p>
      <ol class="trail" id="trail"></ol>
      <div class="steps" id="steps"></div>
    </div>
  </section>
</div>

<!-- 5. Notification (in-page; a system notification is also sent if you switched tabs) -->
<!-- 8. History: past searches and the agent's memory graph -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" inert>
  <div class="drawer-h"><h2 id="drawerTitle">History</h2><button class="drawer-x" id="closeHistory" type="button" aria-label="Close">×</button></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabSearches" aria-selected="true" type="button">Searches</button>
    <button class="tab" role="tab" id="tabMemory" aria-selected="false" type="button">Memory</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<!-- 7. Docked prompt: shown while the main prompt box is scrolled out of view -->
<div class="dock" id="dock" inert>
  <div class="prompt-ring" id="dockRing">
    <form class="dock-form" id="dockForm">
      <label class="sr" for="dockAsk">What are you looking for?</label>
      <input id="dockAsk" type="text" autocomplete="off" enterkeyhint="search" placeholder="Search for something else">
      <button class="btn btn-dark dock-go" type="submit" aria-label="Start">↑</button>
    </form>
  </div>
</div>

<div class="toast" id="toast" role="status"><span class="ic"></span><div><b id="tt"></b><span id="ts"></span></div><button aria-label="Dismiss" onclick="this.parentElement.classList.remove('show')">×</button></div>

<script src="gradient-waves.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);

  // Backend: `python3 -m shopper.api --port 8000` (see docs/API.md).
  // Override with ?api=http://host:port, ?user=name. ?fast=1 shortens the replay.
  const qs = new URLSearchParams(location.search);
  const API = (qs.get("api") || "http://127.0.0.1:8000").replace(/\/+$/, "");
  const USER = qs.get("user") || "demo";
  const SPEED = qs.has("fast") ? 0.1 : 1;
  const DEFAULT_BUDGET = 900, SHIP_TO = "US-CA";

  let syncDock = () => {};
  let RUN = null, PICKS = [], decided = "", decisions = [], runSeq = 0;

  const PLAN = [
    "Search Mercari and Yahoo Auctions",
    "Read and translate the listings",
    "Work out the landed cost of each",
    "Pick the best three",
    "Add the top pick to the Buyee cart",
    "Wait for your approval",
  ];
  const EMOJI = { camera: "📷", camera_accessory: "🎒", sneakers: "👟", vinyl: "💿", figure: "🧸", apparel: "👕", electronics: "📻", indie_merch: "🎨" };
  const SOURCES = { mercari: "Mercari", yahoo_auctions: "Yahoo Auctions" };

  const usd = n => "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const yen = n => "¥" + Number(n).toLocaleString("en-US");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const httpUrl = u => /^https?:\/\//i.test(u || "") ? u : "";
  const bare = u => String(u || "").replace(/^https?:\/\//, "");
  const noSession = s => String(s || "").replace(/^\[session [^\]]*\]\s*/, "");
  const parseBudget = text => { const m = text.match(/\$\s?([\d,]+(?:\.\d+)?)/); const n = m ? parseFloat(m[1].replace(/,/g, "")) : NaN; return n > 0 ? n : DEFAULT_BUDGET; };

  // Budget and destination go to the API as their own fields, so drop those clauses from the search text
  // (otherwise the backend treats words like "landed" as something the listing must mention).
  const searchText = text => text.replace(/[,;]?\s*\b(?:under|below|up to|max(?:imum)?|less than)\s*\$\s?[\d,.]+(?:\s+(?:landed|delivered|total|all[- ]in))?/gi, "")
    .replace(/[,;]?\s*\b(?:shipped|delivered|shipping)\s+to\s+[^,;.]+/gi, "").replace(/\s+/g, " ").trim() || text;

  async function api(path, body) {
    const r = await fetch(API + path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : undefined);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error((j.error && j.error.message) || `HTTP ${r.status}`);
    return j;
  }

  // API pick -> what the page shows. Every value comes from /api/run.
  function toPick(p, i) {
    const l = p.listing, f = l.fields || {};
    const src = SOURCES[l.source] || f.marketplace || "Other store";
    return { id: l.id, emoji: EMOJI[l.category] || "📦", t: l.title_en || l.title_ja, jp: l.title_ja, src,
      s: `${src} · ${String(l.condition).replace(/_/g, " ")} · seller ${l.seller}`, why: p.reason,
      yen: l.price_jpy, usd: p.cost.total_usd, best: i === 0, url: l.url, seller: l.seller,
      cond: String(l.condition).replace(/_/g, " "), condJa: f.condition_ja || "", lines: p.cost.lines,
      // Listings found by the live web search carry found_via; everything else is bundled sample data.
      real: !!f.found_via, check: f.price_check || "" };
  }
  const cartPick = () => PICKS.find(p => RUN.cart && p.id === RUN.cart.listing_id) || PICKS[0];

  // Pages replayed in the agent's browser, filled from the real run.
  const PAGES = {
    search: (q) => `<div class="site"><div class="site-top"><span class="site-logo">${esc(PICKS[0].src.toLowerCase())}</span><div class="site-search" id="t-search">${esc(q)}</div></div>
      <div class="grid3">${PICKS.map((p, i) => `<div class="tile" id="t-tile${i}"><div class="img">${p.emoji}</div><div class="p">${yen(p.yen)}</div><div class="n">${esc(p.jp)}</div></div>`).join("")}</div></div>`,
    listing: (tr) => { const p = PICKS[0]; return `<div class="site"><div class="site-top"><span class="site-logo">${esc(p.src.toLowerCase())}</span><div class="site-search">${esc(bare(p.url))}</div></div>
      <div class="detail"><div class="img">${p.emoji}</div><div>
        <div style="font-weight:700;font-size:15px">${tr ? `<span class="tr">${esc(p.t)}</span>` : esc(p.jp)}</div>
        ${tr ? `<div class="jp">${esc(p.jp)}</div>` : ""}
        <div style="font-size:18px;font-weight:800;margin:6px 0">${yen(p.yen)}</div>
        <div>${tr ? `<span class="tr">Condition: ${esc(p.cond)}</span>` : esc(p.condJa ? "商品の状態：" + p.condJa : "")}</div>
        <span class="fakebtn" id="t-buy">購入手続きへ</span></div></div></div>`; },
    cost: () => { const p = PICKS[0]; return `<div class="site"><div style="font-weight:700;margin-bottom:8px">Landed cost</div>
      ${p.lines.map(l => `<div class="cartrow sm"><span>${esc(l.label)}</span><b>${usd(l.amount_usd)}</b></div>`).join("")}
      <div class="cartrow sm" style="border-color:#111"><span>Total</span><b>${usd(p.usd)}</b></div></div>`; },
    cart: () => { const p = cartPick(); return `<div class="site"><div class="site-top"><span class="site-logo" style="color:#ea580c">buyee</span><div class="site-search">Cart</div></div>
      <div class="cartrow" id="t-cart"><span>${p.emoji} ${esc(p.jp)}</span><b>${yen(p.yen)}</b></div>
      <div class="cartrow"><span>Subtotal (1 item)</span><b>${yen(p.yen)}</b></div>
      <div class="paused">⏸ Stopped before payment. Waiting for your approval.</div></div>`; },
    note: (title, body) => `<div class="site"><div style="font-weight:700;margin-bottom:8px">${esc(title)}</div><div style="color:#555">${body}</div></div>`,
  };

  let timers = [], startAt = 0, clock, stopped = false;
  const later = (ms, fn) => timers.push(setTimeout(() => !stopped && fn(), ms * SPEED));

  function setPlan(doing) {
    $("#plan").innerHTML = PLAN.map((t, i) => {
      const c = i < doing ? "done" : i === doing ? "doing" : "";
      return `<li class="${c}"><span class="num">${i + 1}</span><span>${t}</span><span class="st" aria-label="${c || "queued"}"></span></li>`;
    }).join("");
  }
  function show(url, html, caption) {
    $("#url").textContent = url; $("#screen").innerHTML = html; $("#caption").innerHTML = caption;
  }
  function pointAt(id, click) {
    const el = document.getElementById(id), cur = $("#cursor");
    if (!el) return;
    const a = el.getBoundingClientRect(), b = cur.parentElement.getBoundingClientRect();
    cur.style.left = (a.left - b.left + a.width / 2) + "px";
    cur.style.top = (a.top - b.top + a.height / 2) + "px";
    document.querySelectorAll(".hl").forEach(e => e.classList.remove("hl"));
    el.classList.add("hl");
    if (click) setTimeout(() => { cur.classList.remove("click"); void cur.offsetWidth; cur.classList.add("click"); }, 800 * SPEED);
  }
  const working = on => { $("#ring").classList.toggle("working", on); $("#dockRing").classList.toggle("working", on); };
  function halt(state) { clearInterval(clock); working(false); $("#rec").className = "state off"; $("#rec").textContent = state; $("#stop").disabled = true; }

  async function start() {
    timers.forEach(clearTimeout); timers = []; stopped = false;
    const seq = ++runSeq, text = $("#ask").value.trim(), budget = parseBudget(text);
    RUN = null; PICKS = []; decided = ""; decisions = [];
    if (document.activeElement === $("#ask")) $("#ask").blur();
    document.body.classList.add("asked"); syncDock();
    $("#work").hidden = false; $("#results").hidden = true; $("#toast").classList.remove("show");
    $("#rec").className = "state"; $("#rec").textContent = "Working"; $("#stop").disabled = false;
    working(true);
    startAt = Date.now(); clearInterval(clock);
    clock = setInterval(() => $("#elapsed").textContent = Math.round((Date.now() - startAt) / 1000) + "s", 500);
    setTimeout(() => $("#work").scrollIntoView({ behavior: "smooth", block: "start" }), 150);

    setPlan(0);
    show(bare(API) + "/api/run", PAGES.note("Asking the agent", `Budget ${usd(budget)} landed, shipped to ${SHIP_TO}.`), "Searching<em>…</em> a live web search can take up to a minute.");
    let run;
    try { run = await api("/api/run", { query: searchText(text), budget, ship_to: SHIP_TO, user: USER }); }
    catch (e) { if (seq === runSeq) fail(e); return; }
    if (stopped || seq !== runSeq) return;
    RUN = run; PICKS = run.picks.map(toPick);
    if (!PICKS.length) return finish();

    // Replay of the steps the backend just took, using its real output.
    const top = PICKS[0], n = PICKS.length;
    const kw = ((run.trail.find(t => t.startsWith("source:")) || "").match(/\[(.*)\]/) || [])[1];
    const keyword = kw ? kw.replace(/'/g, "") : text;
    const rules = (top.lines[0] && top.lines[0].citation.source.split("#")[0]) || "rules";
    $("#rec").textContent = "Replay";
    show(bare(top.url).split("/")[0] + "/search", PAGES.search(""), "Searching Mercari and Yahoo Auctions<em>…</em>");
    later(600, () => { $("#t-search").textContent = keyword; pointAt("t-search"); });
    later(2200, () => { setPlan(1); pointAt("t-tile0", true); $("#caption").innerHTML = "Opening the top listing<em>…</em>"; });
    later(3400, () => { show(bare(top.url), PAGES.listing(false), "Reading the listing <em>in Japanese…</em>"); pointAt("t-buy"); });
    later(5000, () => { show(bare(top.url), PAGES.listing(true), "Translated the title and condition."); });
    later(6600, () => { setPlan(2); show("landed cost · " + rules, PAGES.cost(), "Working out the <em>real</em> cost of each…"); });
    later(8400, () => { setPlan(3); $("#caption").innerHTML = `Ranking ${n} match${n === 1 ? "" : "es"} by condition and price<em>…</em>`; });
    later(9400, () => { setPlan(4); show(bare(run.cart.cart_url || "buyee.jp/cart"), PAGES.cart(), `Adding ${esc(cartPick().t)} to your cart<em>…</em>`); pointAt("t-cart", true); });
    later(11000, finish);
  }

  function fail(e) {
    halt("Offline");
    show(bare(API), PAGES.note("Can't reach the agent", `${esc(e.message)}<br><br>Start it from the repo root:<br><code>python3 -m shopper.api --port 8000</code>`),
      "The agent backend <em>isn't answering.</em>");
  }

  function finish() {
    const n = PICKS.length;
    // No picks has two different causes: nothing was found at all, or everything found was over budget / blocked.
    const none = RUN.trail.some(t => t === "found 0 listings");
    halt(n ? "Paused" : "Done");
    setPlan(n ? 5 : 3);
    $("#h-res").textContent = n ? `${["", "One", "Two", "Three"][n] || n} good match${n === 1 ? "" : "es"}.` : none ? "No listings found." : "Nothing fits that budget.";
    $("#caption").innerHTML = n ? "Cart is ready." : (none ? "The search came back empty." : "No listing fits.") + " <em>Nothing was added to a cart.</em>";
    if (!n) show(bare(API) + "/api/run", PAGES.note(none ? "No listings found" : "No match within budget", none ? "No listing matched that search. The audit trail below shows where the agent looked." : "The audit trail below shows what was found and why each listing was skipped."), $("#caption").innerHTML);
    renderResults(n ? cartPick().id : null);
    record(text0());
    $("#results").hidden = false;
    loadSession();
    if (n) notify("Your shortlist is ready", `${n} match${n === 1 ? "" : "es"}. ${cartPick().t} is waiting in your cart.`);
    else notify(none ? "No listings found" : "Nothing within budget", none ? "See the audit trail for where the agent looked." : "See the audit trail for what was skipped.");
  }

  function renderResults(sel) {
    $("#opts").innerHTML = PICKS.map(p => `
      <label class="opt">
        <span class="img">${p.emoji}</span>
        <span><span class="t">${p.real && httpUrl(p.url) ? `<a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.t)} ↗</a>` : esc(p.t)}</span>${p.best ? '<span class="tag">Best match</span>' : ""}<span class="tag ${p.real ? "live" : "sample"}">${p.real ? "Live listing" : "Sample data"}</span><br><span class="s">${esc(p.s)}</span><br><span class="s">${esc(p.why)}</span>${p.check ? `<br><span class="s">${esc(p.check)}</span>` : ""}</span>
        <span class="price">${usd(p.usd)}<small>${yen(p.yen)}</small></span>
        <input type="radio" name="pick" value="${esc(p.id)}" ${p.id === sel ? "checked" : ""} aria-label="Choose ${esc(p.t)}"></label>`).join("");
    const p = PICKS.find(x => x.id === sel);
    renderCost(p);
    renderTrail();
    renderHandoff();
    if (!p) { $("#approveRow").innerHTML = ""; return; }
    if (decided) { $("#approveRow").innerHTML = decided; return; }
    const c = cartPick();
    // The backend carts its top pick only; the approval token covers that one listing.
    $("#approveRow").innerHTML = p.id === c.id
      ? `<p>Buy <b>${esc(p.t)}</b> through Buyee for <b>${usd(p.usd)}</b> landed. Nothing is paid until you slide.</p>
         <button class="btn btn-quiet" id="skip" type="button">Skip</button>${swipeHTML(`Slide to pay ${usd(p.usd)}`, false)}`
      : `<p><b>${esc(p.t)}</b> is not in the cart. The agent carted its top pick, <b>${esc(c.t)}</b>; skip that one and search again to move on.</p>
         ${swipeHTML(`Slide to pay ${usd(p.usd)}`, true)}`;
    wireSwipe();
  }

  // Swipe to pay. Dragging the thumb past 82% of the track (or Enter/Space on it) approves the cart.
  // The payment itself is whatever the backend's checkout driver does; with the default driver that is simulated.
  const swipeHTML = (label, off) => `<div class="swipe${off ? " off" : ""}" id="swipe" role="group" aria-label="${esc(label)}">
      <span class="swipe-fill"></span><span class="swipe-label">${esc(label)}</span>
      <button class="swipe-thumb" type="button" ${off ? "disabled" : ""} aria-label="${esc(label)}. Drag right, or press Enter.">→</button></div>`;
  function wireSwipe() {
    const track = $("#swipe");
    if (!track || track.classList.contains("off")) return;
    const thumb = track.querySelector(".swipe-thumb"), fill = track.querySelector(".swipe-fill"), text = track.querySelector(".swipe-label"), label = text.textContent;
    let x = 0, max = 0, from = 0, drag = false, done = false;
    const measure = () => { max = Math.max(40, track.clientWidth - thumb.offsetWidth - 8); };
    const set = px => {
      x = Math.max(0, Math.min(max, px));
      thumb.style.transform = `translateX(${x}px)`;
      fill.style.width = x ? (x + thumb.offsetWidth + 8) + "px" : "0";
      text.style.opacity = Math.max(0, 1 - x / (max * 0.7));
    };
    const complete = () => {
      if (done) return;
      done = true; set(max); track.classList.add("confirmed"); thumb.disabled = true;
      text.textContent = "Paying…"; text.style.opacity = 1;
      approve(false);
    };
    track.reset = () => { done = false; thumb.disabled = false; track.classList.remove("confirmed"); text.textContent = label; set(0); };
    thumb.onpointerdown = e => {
      if (done) return;
      drag = true; measure(); from = e.clientX - x; track.classList.add("dragging");
      try { thumb.setPointerCapture(e.pointerId); } catch (_) {}
    };
    thumb.onpointermove = e => { if (drag && !done) set(e.clientX - from); };
    thumb.onpointerup = thumb.onpointercancel = () => {
      if (!drag) return;
      drag = false; track.classList.remove("dragging");
      if (x >= max * 0.82) complete(); else set(0);
    };
    thumb.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); measure(); complete(); } };
  }

  // The agent cannot browse Buyee itself (Buyee blocks automated clients), so it hands the person
  // its translated Japanese search to open in their own browser.
  function renderHandoff() {
    const src = RUN.trail.find(t => t.startsWith("source:")) || "";
    const m = src.match(/search for '([^']+)'/) || src.match(/\['([^']+)'/);
    const k = m ? m[1] : searchText($("#ask").value.trim()), q = encodeURIComponent(k);
    const a = (href, label) => `<a href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`;
    $("#handoff").innerHTML = `Check live listings yourself: the agent's Japanese search <b>${esc(k)}</b> on `
      + a(`https://buyee.jp/mercari/search?keyword=${q}&status=on_sale`, "Mercari via Buyee") + " or "
      + a(`https://buyee.jp/item/search/query/${q}`, "Yahoo Auctions via Buyee") + ".";
  }

  // Every cost line with the rule it came from. A citation source looks like
  // "senso:japan-landed-cost-rules#fx_jpy_per_usd" (or "fixtures/rules.json#key (estimate)" offline).
  function asOf(d) {
    const m = String(d || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return String(d || "");
    const opt = { month: "short", day: "numeric" };
    if (+m[1] !== new Date().getFullYear()) opt.year = "numeric";
    return new Date(+m[1], m[2] - 1, +m[3]).toLocaleDateString("en-US", opt);
  }
  function srcChip(c) {
    const m = String(c.source).match(/^(.*?)#(.+?)(\s*\(estimate\))?$/);
    const doc = m ? m[1] : "", key = m ? m[2] : String(c.source);
    const prov = /^[a-z]+:/i.test(doc) ? doc.split(":")[0] : doc ? "Local" : "";
    const u = httpUrl(c.url), tip = esc(`${c.source} · as of ${c.as_of}`);
    const body = (prov ? `<span class="prov">${esc(prov)}</span>` : "") + `<span class="key">${esc(key)}</span>`
      + (m && m[3] ? `<span class="est">est.</span>` : "") + `<span class="asof">${esc(asOf(c.as_of))}</span>`;
    return u ? `<a class="src" href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="${tip}">${body}</a>` : `<span class="src" title="${tip}">${body}</span>`;
  }
  function renderCost(p) {
    if (!p) { $("#cost").innerHTML = `<p class="quiet">No pick, so no cost to show.</p>`; return; }
    $("#cost").innerHTML = `<div class="cite">${p.lines.map(l => `<div class="cite-row"><span>${esc(l.label)}</span>${srcChip(l.citation)}<span class="amt">${usd(l.amount_usd)}</span></div>`).join("")}
      <div class="cite-row total"><span>Total landed, ${esc(p.t)}</span><span class="amt">${usd(p.usd)}</span></div></div>`;
  }

  // The agent's own log, then what the human decided on this page. Each line gets a short kind tag
  // taken from its prefix ("skip m123: over budget" -> SKIP, "m123: over budget").
  const KINDS = [[/^recalled preferences for [^:]+:\s*/, "memory"], [/^source:\s*/, "source"], [/^found (?=\d)/, "search", true],
    [/^skip\s+/, "skip"], [/^ranker:\s*/, "ranker"], [/^pick\s+/, "pick"], [/^cart\s+/, "cart"], [/^no candidate/, "result", true]];
  function trailRow(t, human) {
    if (human) return { kind: "you", text: t.replace(/^human\s+/, "") };
    for (const [re, kind, keep] of KINDS) if (re.test(t)) return { kind, text: keep ? t : t.replace(re, "") };
    return { kind: "note", text: t };
  }
  function renderTrail() {
    const rows = (RUN ? RUN.trail : []).map(t => trailRow(t, false)).concat(decisions.map(t => trailRow(t, true)));
    $("#trail").innerHTML = rows.map(r => `<li class="${r.kind}"><span class="dot"></span><span class="kind">${r.kind}</span><span class="txt">${esc(r.text)}</span></li>`).join("");
  }

  async function loadSession() {
    const sid = RUN && RUN.cart && RUN.cart.session_id;
    if (!sid) { $("#steps").innerHTML = ""; return; }
    try {
      const s = await api("/api/sessions/" + encodeURIComponent(sid));
      const time = at => new Date(at * 1000).toLocaleTimeString("en-US", { hour12: false });
      $("#steps").innerHTML = `<p class="steps-h">Checkout session ${esc(s.id)} · driver ${esc(s.driver)} · state ${esc(s.state)}</p>`
        + (s.warnings || []).map(w => `<p class="warn">⚠ ${esc(typeof w === "string" ? w : JSON.stringify(w))}</p>`).join("")
        + (s.steps || []).map(x => `<div class="step"><span>${time(x.at)}</span><span>${esc(x.state)}</span><span>${esc(x.actor)}</span><span>${esc(x.action)}${x.detail ? " · " + esc(x.detail) : ""}</span></div>`).join("");
    } catch (e) { $("#steps").innerHTML = `<p class="quiet">Step log unavailable: ${esc(e.message)}</p>`; }
  }

  function notify(title, body) {
    if (!$("#notifyMe").checked) return;
    $("#tt").textContent = title; $("#ts").textContent = body; $("#toast").classList.add("show");
    clearTimeout(notify.h); notify.h = setTimeout(() => $("#toast").classList.remove("show"), 6000);
    if (document.hidden && "Notification" in window && Notification.permission === "granted") new Notification(title, { body });
    if (document.hidden) { const t = document.title; document.title = "✓ " + title; addEventListener("focus", () => document.title = t, { once: true }); }
  }

  function decide(html, line) {
    decided = html; if (line) decisions.push(line);
    if (line) markDecision(/approved .*→ placed/.test(line) ? "bought" : /^human skipped/.test(line) ? "skipped" : "");
    $("#approveRow").innerHTML = decided; renderTrail(); loadSession();
  }
  const outcome = c => `${c.status}: ${noSession(c.detail)}`;

  async function approve(again) {
    const p = cartPick(), btn = again ? $("#again") : null, swipe = again ? null : $("#swipe");
    if (btn) btn.disabled = true;
    let c;
    try { c = await api("/api/approve", { approval_token: RUN.cart.approval_token }); }
    catch (e) { if (btn) btn.disabled = false; if (swipe && swipe.reset) swipe.reset(); return notify("Approval failed", e.message); }
    if (again) return decide(decided.replace(/<button[^>]*id="again"[^>]*>.*?<\/button>/, "") + `<p class="done-note">Same token again → <b>${esc(outcome(c))}</b></p>`, `human reused the approval token → ${outcome(c)}`);
    if (c.status === "placed") {
      setPlan(6);
      notify("Approved", `${p.t}, ${usd(p.usd)}`);
      decide(`<p class="done-msg">Approved. <em style="color:var(--ink-50)">${esc(p.t)}, ${usd(p.usd)}. ${esc(noSession(c.detail))}.</em></p>
        <button class="btn btn-quiet" id="again" type="button">Try the same token again</button>`, `human approved ${p.id} → ${outcome(c)}`);
    } else {
      decide(`<p class="done-msg">Not placed. <em style="color:var(--ink-50)">${esc(outcome(c))}.</em></p>`, `human approved ${p.id} → ${outcome(c)}`);
    }
  }

  async function skip() {
    const p = cartPick(); $("#skip").disabled = true;
    try { await api("/api/reject", { user: USER, seller: p.seller, approval_token: RUN.cart.approval_token, reason: "skipped in the UI" }); }
    catch (e) { $("#skip").disabled = false; return notify("Skip failed", e.message); }
    decide(`<p class="done-msg">Skipped. <em style="color:var(--ink-50)">Nothing was paid. Seller ${esc(p.seller)} is remembered and left out of your next search.</em></p>`,
      `human skipped ${p.id} → approval token revoked, seller ${p.seller} remembered as rejected`);
  }

  // Hero backdrop. Colours follow the theme: translucent sky blue on paper, deeper blue in the dark.
  if (window.GradientWaves) {
    const dark = matchMedia("(prefers-color-scheme: dark)");
    const palette = () => dark.matches && document.documentElement.dataset.theme !== "light"
      ? { lightMode: false, horizonColor: "#0F2F5C", waveColor: "#38BDF8", brightness: 0.7, opacity: 0.6 }
      : { lightMode: true, horizonColor: "#7CC4FF", waveColor: "#38BDF8", brightness: 1, opacity: 0.9 };
    const waves = GradientWaves($("#waves"), { crestColor: "#FFFFFF", speed: 0.5, amplitude: 1.8, relief: 1, lightAngle: 150,
      mouseInteraction: true, swellOnClick: true, swell: 25, tilt: 40, grain: 0.12, dpr: 1.5, ...palette() });
    if (waves) dark.addEventListener("change", () => waves.set(palette()));
  }

  // ---------- History: searches are kept in this browser; memory comes from the backend (/api/memory).
  const HKEY = "agent-niche.history.v1";
  const text0 = () => $("#ask").value.trim();
  const loadHist = () => { try { return JSON.parse(localStorage.getItem(HKEY) || "[]"); } catch (_) { return []; } };
  const saveHist = h => { try { localStorage.setItem(HKEY, JSON.stringify(h.slice(0, 30))); } catch (_) {} };
  let histId = "";
  function record(q) {
    if (!RUN) return;
    const c = PICKS.length ? cartPick() : null;
    histId = Date.now().toString(36);
    const entry = { id: histId, at: Date.now(), q, budget: parseBudget(q), user: USER, cart: c ? c.id : "", decision: "",
      picks: PICKS.map(p => ({ id: p.id, t: p.t, usd: p.usd, src: p.src, seller: p.seller, cat: (RUN.picks.find(x => x.listing.id === p.id) || { listing: {} }).listing.category || "", url: p.real ? p.url : "", emoji: p.emoji })) };
    saveHist([entry, ...loadHist().filter(e => e.q !== q || e.user !== USER)]);
  }
  function markDecision(d) {
    if (!histId || !d) return;
    saveHist(loadHist().map(e => e.id === histId ? { ...e, decision: d } : e));
  }
  const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? "just now" : m < 60 ? m + "m ago" : m < 1440 ? Math.round(m / 60) + "h ago" : Math.round(m / 1440) + "d ago"; };

  let tab = "searches";
  function openHistory() {
    $("#drawer").classList.add("show"); $("#scrim").classList.add("show"); $("#drawer").inert = false;
    renderDrawer(); setTimeout(() => $("#closeHistory").focus(), 50);
  }
  function closeHistory() {
    $("#drawer").classList.remove("show"); $("#scrim").classList.remove("show"); $("#drawer").inert = true; $("#openHistory").focus();
  }
  function setTab(t) {
    tab = t; $("#tabSearches").setAttribute("aria-selected", t === "searches"); $("#tabMemory").setAttribute("aria-selected", t === "memory"); renderDrawer();
  }
  function renderDrawer() { tab === "searches" ? renderSearches() : renderMemory(); }

  function renderSearches() {
    const h = loadHist().filter(e => e.user === USER);
    if (!h.length) { $("#drawerBody").innerHTML = `<p class="empty">No searches yet. Everything you search for shows up here, with what the agent found.</p>`; return; }
    $("#drawerBody").innerHTML = `<ul class="hist">${h.map(e => `<li>
        <button class="hist-q" type="button" data-q="${esc(e.q)}" title="Search again">${esc(e.q)}</button>
        <div class="hist-meta"><span>${ago(e.at)}</span><span>·</span><span>${e.picks.length} match${e.picks.length === 1 ? "" : "es"}</span>${e.decision ? `<span>·</span><span class="st-${e.decision}">${e.decision}</span>` : ""}</div>
        ${e.picks.length ? `<ul class="hist-items">${e.picks.map(p => `<li class="${p.id === e.cart ? "chosen" : ""}"><span>${p.emoji || "📦"}</span><span>${p.url && httpUrl(p.url) ? `<a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.t)}</a>` : esc(p.t)}</span><b>${usd(p.usd)}</b></li>`).join("")}</ul>` : ""}
      </li>`).join("")}</ul>
      <div class="hist-foot"><span>Saved in this browser only.</span><button type="button" id="clearHist">Clear history</button></div>`;
  }

  async function renderMemory() {
    $("#drawerBody").innerHTML = `<p class="empty">Recalling<em>…</em></p>`;
    let mem = null, err = "";
    try { mem = await api("/api/memory?user=" + encodeURIComponent(USER)); } catch (e) { err = e.message; }
    if (tab !== "memory") return;
    const g = buildGraph(mem, loadHist().filter(e => e.user === USER).slice(0, 8));
    const bought = (mem && mem.notes || []).filter(n => /^bought /.test(n));
    const facts = [
      ["Bought", bought.map(n => n.replace(/^bought \S+?:\s+/, ""))],
      ["Rejected sellers", (mem && mem.rejected_sellers) || []],
      ["Preferences", mem ? [...Object.entries(mem.sizes || {}).map(([k, v]) => `${k} size ${v}`), ...(mem.condition_min ? [`condition at least ${mem.condition_min.replace(/_/g, " ")}`] : [])] : []],
    ].filter(([, v]) => v.length);
    $("#drawerBody").innerHTML = `${g.nodes.length > 1 ? `<div class="graph-wrap">${drawGraph(g)}<div class="graph-tip" id="gtip"></div></div>
        <div class="legend"><span><i style="background:var(--ink)"></i>You</span><span><i style="background:var(--blue)"></i>Search</span><span><i style="background:var(--pink)"></i>Item</span><span><i style="background:var(--yellow)"></i>Seller</span><span><i style="background:var(--lilac);box-shadow:inset 0 0 0 1px var(--ink-35)"></i>Kind</span><span><i style="background:#16a34a"></i>Bought</span><span><i style="background:var(--red)"></i>Rejected</span></div>`
        : `<p class="empty">Nothing remembered yet. Search, then buy or skip something and it shows up here as a graph.</p>`}
      <div class="facts">${facts.map(([h, v]) => `<h3>${h}</h3><ul>${v.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`).join("")}
      <p class="src-note">${mem ? `Memory for <b>${esc(USER)}</b> from the agent. Searches come from this browser.` : `Agent offline (${esc(err)}). Showing this browser's searches only.`}</p></div>`;
    wireGraph(g);
  }

  // Entities and relations, Cognee style: you -searched-> query -found-> item -sold by-> seller, item -is a-> kind,
  // you -bought-> item, you -rejected-> seller.
  function buildGraph(mem, hist) {
    const nodes = new Map(), links = [];
    const node = (id, label, type) => { if (!nodes.has(id)) nodes.set(id, { id, label, type }); return id; };
    const link = (a, b, kind) => { if (!links.some(l => l.a === a && l.b === b && l.kind === kind)) links.push({ a, b, kind }); };
    const you = node("you", "You", "you");
    const titles = {};
    hist.forEach(e => e.picks.forEach(p => { titles[p.id] = p.t; }));
    hist.forEach(e => {
      const q = node("q:" + e.id, e.q.replace(/\s*(?:under|below)\s*\$[\d,.]+.*$/i, "").replace(/^find (?:a |an |me )?(?:used )?/i, ""), "search");
      link(you, q, "searched");
      e.picks.forEach(p => {
        const it = node("i:" + p.id, p.t, "item");
        link(q, it, "found");
        if (p.seller) link(it, node("s:" + p.seller, p.seller, "seller"), "sold by");
        if (p.cat) link(it, node("c:" + p.cat, p.cat.replace(/_/g, " "), "category"), "is a");
        if (e.decision === "bought" && p.id === e.cart) link(you, it, "bought");
      });
    });
    if (mem) {
      (mem.notes || []).forEach(n => {
        const m = n.match(/^bought (\S+?):\s+(.*?)(?: from (.+))?$/);
        if (!m) return;
        const it = node("i:" + m[1], titles[m[1]] || m[2], "item");
        link(you, it, "bought");
        if (m[3]) link(it, node("s:" + m[3], m[3], "seller"), "sold by");
      });
      (mem.past_purchases || []).forEach(id => { if (nodes.has("i:" + id)) link(you, "i:" + id, "bought"); });
      (mem.rejected_sellers || []).forEach(sl => link(you, node("s:" + sl, sl, "seller"), "rejected"));
      Object.entries(mem.sizes || {}).forEach(([k, v]) => link(you, node("p:" + k, `${k} ${v}`, "category"), "wears"));
    }
    return layout([...nodes.values()], links);
  }

  // A small force layout, run to rest once (no animation), then scaled into a 400x400 box.
  function layout(nodes, links) {
    const idx = new Map(nodes.map((n, i) => [n.id, i]));
    nodes.forEach((n, i) => { const a = i * 2.39996, r = 20 + 9 * Math.sqrt(i); n.x = Math.cos(a) * r; n.y = Math.sin(a) * r; n.vx = n.vy = 0; });
    const L = links.map(l => ({ ...l, s: idx.get(l.a), t: idx.get(l.b) }));
    for (let k = 0; k < 320; k++) {
      const cool = 1 - k / 320;
      for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j]; let dx = a.x - b.x, dy = a.y - b.y; const d2 = Math.max(dx * dx + dy * dy, 25), f = 900 / d2, d = Math.sqrt(d2);
        dx /= d; dy /= d; a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
      }
      L.forEach(l => {
        const a = nodes[l.s], b = nodes[l.t], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, rest = l.kind === "found" ? 46 : 56, f = (d - rest) * 0.04;
        a.vx += dx / d * f; a.vy += dy / d * f; b.vx -= dx / d * f; b.vy -= dy / d * f;
      });
      nodes.forEach(n => { n.vx -= n.x * 0.004; n.vy -= n.y * 0.004; n.x += n.vx * 0.5 * cool; n.y += n.vy * 0.5 * cool; n.vx *= 0.6; n.vy *= 0.6; });
    }
    const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const sc = Math.min(290 / Math.max(maxX - minX, 1), 320 / Math.max(maxY - minY, 1), 2.2);
    nodes.forEach(n => { n.x = 200 + (n.x - (minX + maxX) / 2) * sc; n.y = 200 + (n.y - (minY + maxY) / 2) * sc; });
    return { nodes, links: L };
  }

  const NODE = { you: ["var(--ink)", 11], search: ["var(--blue)", 8], item: ["var(--pink)", 6], seller: ["var(--yellow)", 6], category: ["var(--lilac)", 5] };
  const short = (t, n) => t.length > n ? t.slice(0, n - 1) + "…" : t;
  function drawGraph(g) {
    const labelled = t => t === "you" || t === "search" || t === "seller" || g.nodes.length < 18;
    return `<svg class="graph" id="graph" viewBox="0 0 400 400" role="img" aria-label="Memory graph: ${g.nodes.length} things the agent remembers and ${g.links.length} links between them">
      ${g.links.map((l, i) => `<line data-i="${i}" class="${l.kind === "bought" ? "bought" : l.kind === "rejected" ? "rejected" : ""}" x1="${g.nodes[l.s].x.toFixed(1)}" y1="${g.nodes[l.s].y.toFixed(1)}" x2="${g.nodes[l.t].x.toFixed(1)}" y2="${g.nodes[l.t].y.toFixed(1)}"/>`).join("")}
      ${g.nodes.map((n, i) => { const [fill, r] = NODE[n.type]; return `<g class="node ${n.type}" data-n="${i}" tabindex="0" transform="translate(${n.x.toFixed(1)} ${n.y.toFixed(1)})">
        <circle r="${r}" fill="${fill}"/>${labelled(n.type) ? `<text ${n.x > 230 ? `x="${-r - 4}" text-anchor="end"` : `x="${r + 4}"`} y="3.5">${esc(short(n.label, n.type === "item" ? 22 : 26))}</text>` : ""}<title>${esc(n.label)}</title></g>`; }).join("")}
    </svg>`;
  }
  function wireGraph(g) {
    const svg = $("#graph"), tip = $("#gtip");
    if (!svg) return;
    const show = i => {
      const n = g.nodes[i], rel = g.links.map((l, k) => [l, k]).filter(([l]) => l.s === i || l.t === i);
      const near = new Set([i, ...rel.map(([l]) => l.s === i ? l.t : l.s)]);
      svg.classList.add("focus");
      svg.querySelectorAll(".node").forEach(el => el.classList.toggle("near", near.has(+el.dataset.n)));
      svg.querySelectorAll("line").forEach(el => el.classList.toggle("near", rel.some(([, k]) => k === +el.dataset.i)));
      const says = rel.slice(0, 4).map(([l]) => l.s === i ? `${l.kind} ${short(g.nodes[l.t].label, 30)}` : `${short(g.nodes[l.s].label, 30)} ${l.kind} this`).join(" · ");
      tip.innerHTML = `<small>${n.type === "category" ? "kind" : n.type}</small>${esc(n.label)}${says ? `<br><span style="opacity:.65">${esc(says)}</span>` : ""}`;
      tip.classList.add("show");
    };
    const hide = () => { svg.classList.remove("focus"); tip.classList.remove("show"); };
    svg.querySelectorAll(".node").forEach(el => {
      el.addEventListener("mouseenter", () => show(+el.dataset.n)); el.addEventListener("focus", () => show(+el.dataset.n));
      el.addEventListener("mouseleave", hide); el.addEventListener("blur", hide);
      el.addEventListener("click", () => show(+el.dataset.n));
    });
  }

  $("#openHistory").onclick = openHistory;
  $("#closeHistory").onclick = closeHistory;
  $("#scrim").onclick = closeHistory;
  $("#tabSearches").onclick = () => setTab("searches");
  $("#tabMemory").onclick = () => setTab("memory");
  addEventListener("keydown", e => { if (e.key === "Escape" && $("#drawer").classList.contains("show")) closeHistory(); });
  $("#drawerBody").onclick = e => {
    const q = e.target.closest(".hist-q");
    if (q) { closeHistory(); $("#ask").value = q.dataset.q; $("#dockAsk").value = q.dataset.q; $("#form").requestSubmit(); }
    if (e.target.id === "clearHist") { saveHist(loadHist().filter(x => x.user !== USER)); renderSearches(); }
  };

  // events
  $("#form").onsubmit = e => { e.preventDefault(); if (!$("#ask").value.trim()) $("#ask").value = $("#ask").placeholder; start(); };
  $("#ask").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#form").requestSubmit(); } };
  document.querySelectorAll(".ex").forEach(b => b.onclick = () => { $("#ask").value = b.textContent; $("#ask").focus(); });
  $("#notifyMe").onchange = e => { if (e.target.checked && "Notification" in window && Notification.permission === "default") Notification.requestPermission(); };
  // Docked prompt: mirrors the main box and takes over while that one is off screen.
  const dock = $("#dock"), ask = $("#ask"), dockAsk = $("#dockAsk");
  ask.addEventListener("input", () => { dockAsk.value = ask.value; });
  dockAsk.addEventListener("input", () => { ask.value = dockAsk.value; });
  $("#form").addEventListener("submit", () => { dockAsk.value = ask.value; });
  $("#dockForm").onsubmit = e => { e.preventDefault(); ask.value = dockAsk.value; $("#form").requestSubmit(); dockAsk.blur(); };
  // Before the first search the dock only appears once the big box is scrolled away; after it, the big box
  // has collapsed into the dock and the dock stays.
  let ringSeen = true;
  syncDock = () => {
    const asked = document.body.classList.contains("asked"), on = asked || !ringSeen;
    dock.classList.toggle("show", on); dock.inert = !on; $("#ring").inert = asked;
    if (!on && document.activeElement === dockAsk) ask.focus({ preventScroll: true });
  };
  if ("IntersectionObserver" in window) new IntersectionObserver(([en]) => { ringSeen = en.isIntersecting; syncDock(); }).observe($("#ring"));
  $("#stop").onclick = () => { stopped = true; timers.forEach(clearTimeout); halt("Stopped"); $("#caption").innerHTML = "Stopped. <em>Nothing was paid.</em>"; };
  $("#opts").onchange = e => renderResults(e.target.value);
  $("#approveRow").onclick = e => {
    if (e.target.id === "again") approve(true);
    if (e.target.id === "skip") skip();
  };
})();
</script>
</body>
