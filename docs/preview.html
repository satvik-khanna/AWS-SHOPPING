<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping Agent</title>
<style>
/* Japan Shopping Agent — 6-page 100dvh fixed viewport (ONLY list regions scroll).
   Shibubu Design Tokens + GitHub Primer Octicons v19.42.0 (MIT). Zero external assets. */

:root {
  /* Dia UI-style palette (from ui-mockup) — warm paper #FBFAF6, crisp ink, rainbow working accent */
  --bg-app: #fbfaf6;
  --surface-1: #ffffff;
  --surface-2: #f3f2ee;
  --surface-3: #e8e6e0;
  --surface-press: #dcd9d0;
  --border: rgba(17, 17, 17, 0.1);
  --border-strong: rgba(17, 17, 17, 0.22);
  --text-primary: #111111;
  --text-secondary: rgba(17, 17, 17, 0.56);
  --text-tertiary: rgba(17, 17, 17, 0.4);
  --rainbow: linear-gradient(90deg, #c679c4, #fa3d1d, #ffb005, #e1e1fe, #0358f7, #c679c4);

  --ink-fill: #111111;
  --ink-fill-hover: #2c2c2c;
  --on-ink: #ffffff;

  --danger: #d12e16; --danger-soft: #fdecea;
  --warning: #8a5700; --warning-soft: #fdf3dc;
  --success: #17633a; --success-soft: #e6f4ec;
  --focus-ring: #0358f7;
  --scrim: rgba(17, 17, 17, 0.36);

  --seg-0: #111111; --seg-1: #515d6b; --seg-2: #8a5700;
  --seg-3: #17633a; --seg-4: #8c959f; --seg-5: #b9c1cb;

  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 20px;
  --hairline: 1px;
  --font-serif: Georgia, "Instrument Serif", "Times New Roman", serif;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  --ease-out: cubic-bezier(0.33, 1, 0.68, 1);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-app: #1b1b1b; --surface-1: #232323; --surface-2: #2b2b2b; --surface-3: #343434; --surface-press: #3e3e3e;
    --border: rgba(248, 248, 248, 0.12); --border-strong: rgba(248, 248, 248, 0.24);
    --text-primary: #f8f8f8; --text-secondary: rgba(248, 248, 248, 0.58); --text-tertiary: rgba(248, 248, 248, 0.4);
    --ink-fill: #f8f8f8; --ink-fill-hover: #e2e2e2; --on-ink: #111111;
    --danger: #ff9d94; --danger-soft: #3a1f21;
    --warning: #e7bd70; --warning-soft: #352915;
    --success: #7ddaa5; --success-soft: #173024;
    --focus-ring: #91b5ff; --scrim: rgba(0, 0, 0, 0.58);
    --seg-0: #e2e8f0; --seg-1: #94a3b8; --seg-2: #e7bd70; --seg-3: #7ddaa5; --seg-4: #64748b; --seg-5: #475569;
  }
}
:root[data-theme="dark"] {
  --bg-app: #1b1b1b; --surface-1: #232323; --surface-2: #2b2b2b; --surface-3: #343434; --surface-press: #3e3e3e;
  --border: rgba(248, 248, 248, 0.12); --border-strong: rgba(248, 248, 248, 0.24);
  --text-primary: #f8f8f8; --text-secondary: rgba(248, 248, 248, 0.58); --text-tertiary: rgba(248, 248, 248, 0.4);
  --ink-fill: #f8f8f8; --ink-fill-hover: #e2e2e2; --on-ink: #111111;
  --danger: #ff9d94; --danger-soft: #3a1f21;
  --warning: #e7bd70; --warning-soft: #352915;
  --success: #7ddaa5; --success-soft: #173024;
  --focus-ring: #91b5ff; --scrim: rgba(0, 0, 0, 0.58);
  --seg-0: #e2e8f0; --seg-1: #94a3b8; --seg-2: #e7bd70; --seg-3: #7ddaa5; --seg-4: #64748b; --seg-5: #475569;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100dvh; overflow: hidden; margin: 0; background: var(--bg-app); color-scheme: light dark; }
body {
  color: var(--text-primary); font-family: var(--font-sans);
  font-size: 13px; line-height: 18px; -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
}
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.octicon { display: inline-block; vertical-align: text-bottom; fill: currentColor; flex: none; }
.mono-text { font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); }

/* Header (44px fixed) */
.top { flex: none; background: var(--bg-app); border-bottom: var(--hairline) solid var(--border); z-index: 20; }
.top-inner { max-width: 720px; margin: 0 auto; height: 44px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand { display: flex; align-items: center; gap: 4px; }
.top h1 { margin: 0; font-family: var(--font-serif); font-size: 18px; font-weight: 400; letter-spacing: -0.01em; }
.dia-orb { width: 14px; height: 14px; border-radius: 50%; flex: none; background: conic-gradient(from 200deg, #c679c4, #fa3d1d, #ffb005, #e1e1fe, #0358f7, #c679c4); }
.user-pill { font-family: var(--font-mono); font-size: 11px; border-radius: 999px; background: var(--surface-2); }
.sort-select { margin-left: auto; height: 24px; padding: 0 6px; border-radius: 999px; border: var(--hairline) solid var(--border); background: var(--surface-2); color: var(--text-primary); font-size: 12px; cursor: pointer; }
.quick-filter { width: 116px; height: 24px; padding: 0 8px; border-radius: 999px; border: var(--hairline) solid var(--border); background: var(--surface-2); color: var(--text-primary); font-size: 12px; }

/* Swipe-to-Pay slider */
.gate-swipe { flex-direction: column; align-items: stretch; gap: 8px; }
.gate-swipe-top { display: flex; align-items: center; gap: 8px; }
.swipe-track {
  position: relative; height: 38px; border-radius: 999px;
  background: var(--surface-2); border: var(--hairline) solid var(--border-strong);
  overflow: hidden; display: flex; align-items: center; justify-content: center; user-select: none; touch-action: none;
}
.swipe-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 38px; border-radius: 999px; background: var(--ink-fill); opacity: 0.14; pointer-events: none; transition: width 160ms var(--ease-out); }
.swipe-track.dragging .swipe-fill, .swipe-track.dragging .swipe-thumb { transition: none; }
.swipe-label { font-size: 12px; font-weight: 600; color: var(--text-primary); pointer-events: none; transition: opacity 140ms var(--ease-out); }
.swipe-thumb {
  position: absolute; left: 4px; top: 3px; width: 30px; height: 30px; border-radius: 50%; border: 0;
  background: var(--ink-fill); color: var(--on-ink); display: grid; place-items: center; cursor: grab;
  transition: transform 200ms var(--ease-out);
}
.swipe-thumb:active { cursor: grabbing; }
.swipe-track.confirmed { border-color: var(--success); background: var(--success-soft); }
.swipe-track.confirmed .swipe-thumb { background: var(--success); color: #fff; }

/* Vault page */
.vault-users { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 8px; border-bottom: var(--hairline) solid var(--border); }
.vault-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }

/* Rainbow working ring around composer (Dia-style) */
.composer-ring { border-radius: 22px; padding: 1.5px; background: var(--border-strong); transition: background 240ms var(--ease-out); }
.composer-ring.working { background: var(--rainbow); background-size: 200% 100%; animation: flowRing 2.6s linear infinite; }
@keyframes flowRing { to { background-position: -200% 0; } }
.top-actions { display: flex; align-items: center; gap: 4px; }
.mode { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 999px; background: var(--surface-2); color: var(--text-secondary); font-size: 12px; font-weight: 500; }
.mode.live { background: var(--danger-soft); color: var(--danger); }

/* Hamburger slide-over drawer */
.scrim { position: fixed; inset: 0; z-index: 30; background: var(--scrim); animation: fadeIn 150ms var(--ease-out); }
.drawer {
  position: fixed; top: 0; left: 0; bottom: 0; width: 268px; max-width: 85vw; z-index: 40;
  background: var(--bg-app); border-right: var(--hairline) solid var(--border);
  transform: translateX(-100%); transition: transform 180ms var(--ease-out);
  display: flex; flex-direction: column; overflow-y: auto; padding: 0 12px 20px;
}
.drawer.open { transform: translateX(0); }
.drawer-head { height: 44px; display: flex; align-items: center; justify-content: space-between; font-weight: 600; border-bottom: var(--hairline) solid var(--border); }
.drawer-section { padding: 10px 0; border-bottom: var(--hairline) solid var(--border); }
.drawer-section:last-child { border-bottom: 0; }
.drawer-section h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--text-tertiary); }
.count-pill { margin-left: auto; font-family: var(--font-mono); font-size: 12px; padding: 0 5px; border-radius: 999px; background: var(--surface-2); color: var(--text-secondary); }
.jump-form { display: flex; gap: 6px; margin-bottom: 6px; }
.jump-form input { flex: 1; min-width: 0; height: 28px; padding: 0 8px; border-radius: var(--radius-sm); border: var(--hairline) solid var(--border-strong); background: var(--surface-2); color: var(--text-primary); font-size: 12px; }
.store-links, .drawer-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.drawer-item { width: 100%; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--text-secondary); font-family: var(--font-sans); font-size: 13px; cursor: pointer; text-align: left; }
.drawer-item:hover { background: var(--surface-3); color: var(--text-primary); }
.drawer-item.active { background: var(--surface-2); color: var(--text-primary); font-weight: 600; }
.drawer-item-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drawer-item-meta { font-family: var(--font-mono); color: var(--text-tertiary); font-size: 12px; }
.drawer-empty { font-size: 12px; color: var(--text-tertiary); padding: 4px 0; }

/* Fixed 100dvh viewport & single scrollable list region */
.viewport {
  width: 100%; max-width: 720px; margin: 0 auto; padding: 10px 12px 0;
  flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column;
}
.page {
  flex: 1; min-height: 0; overflow: hidden;
  display: flex; flex-direction: column; gap: 8px;
  animation: enter 180ms var(--ease-out);
}
.results-pane {
  flex: 1; min-height: 0; overflow: hidden;
  display: flex; flex-direction: column; gap: 6px;
}
.scroll-region {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  scrollbar-width: thin;
}
.chat-stream { display: flex; flex-direction: column; gap: 12px; padding-bottom: 10px; }
.ai-comp { display: flex; flex-direction: column; gap: 6px; animation: enter 220ms var(--ease-out); }
.agent-caption { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.dia-orb-sm { width: 10px; height: 10px; }

/* User bubble & results bar */
.msg-user { flex: none; display: flex; justify-content: flex-end; animation: bubbleIn 200ms var(--ease-out); }
.bubble { padding: 5px 10px; border-radius: var(--radius-lg); border-bottom-right-radius: 4px; background: var(--surface-3); font-size: 12px; font-weight: 500; }
.results-bar { flex: none; display: flex; align-items: center; gap: 8px; }
.agent-lead { font-size: 12px; font-weight: 600; color: var(--text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
.quick-filter { margin-left: auto; width: 130px; height: 24px; padding: 0 8px; border-radius: var(--radius-sm); border: var(--hairline) solid var(--border); background: var(--surface-2); color: var(--text-primary); font-size: 12px; }

/* Flat hairline product rows */
.picks { display: flex; flex-direction: column; border-top: var(--hairline) solid var(--border); }
.pick-row, .flat-row {
  display: grid; grid-template-columns: 24px 1fr auto auto; align-items: center; gap: 8px;
  padding: 8px 6px; border-bottom: var(--hairline) solid var(--border);
}
.flat-row { grid-template-columns: 18px 1fr auto auto; }
.pick-row { cursor: pointer; animation: rowIn 200ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 35ms); transition: background 100ms var(--ease-out); }
.pick-row:hover { background: var(--surface-2); }
.pick-row.selected { background: var(--surface-2); box-shadow: inset 2px 0 0 var(--text-primary); }
.rank { font-family: var(--font-mono); font-size: 12px; color: var(--text-tertiary); }
.row-main { min-width: 0; }
.row-title { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-title > span:first-child { overflow: hidden; text-overflow: ellipsis; }
.row-meta { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 12px; color: var(--text-tertiary); }
.row-price { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row-actions { display: inline-flex; align-items: center; gap: 2px; }
.tag-cart { display: inline-flex; align-items: center; color: var(--warning); }
.tag-cart.placed { color: var(--success); }

/* Item Detail & Landed Cost */
.item-detail-head { padding: 4px 0 10px; border-bottom: var(--hairline) solid var(--border); }
.item-detail-title { font-size: 15px; font-weight: 600; line-height: 21px; }
.item-detail-ja { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.item-detail-actions { display: flex; gap: 8px; padding-top: 10px; }
.cost-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 10px 0 6px; border-bottom: var(--hairline) solid var(--border); }
.cost-title { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.cost-sub { font-size: 12px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; margin-left: auto; }
.cost-sub .under { color: var(--success); font-weight: 600; }
.cost-sub .over { color: var(--danger); font-weight: 600; }
.cost-total-num { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.lines { list-style: none; margin: 0; padding: 0; }
.line { display: grid; grid-template-columns: 6px 1fr auto auto; align-items: center; gap: 8px; padding: 6px 0; border-bottom: var(--hairline) solid var(--border); animation: rowIn 180ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 24ms); }
.line:last-child { border-bottom: 0; }
.line .dot { width: 6px; height: 6px; border-radius: 2px; }
.line .label { font-size: 12px; text-transform: capitalize; }
.line .label small { margin-left: 4px; font-family: var(--font-mono); color: var(--text-tertiary); text-transform: none; }
.line .amt { font-family: var(--font-mono); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.asof { font-family: var(--font-mono); font-size: 12px; color: var(--text-tertiary); }
.s0 { background: var(--seg-0); } .s1 { background: var(--seg-1); } .s2 { background: var(--seg-2); }
.s3 { background: var(--seg-3); } .s4 { background: var(--seg-4); } .s5 { background: var(--seg-5); }

/* Store & Connect pages */
.store-head { flex: none; padding-bottom: 8px; border-bottom: var(--hairline) solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.store-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.proto-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.proto-pill { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: var(--radius-sm); border: var(--hairline) solid var(--border); background: var(--surface-2); color: var(--text-primary); font-family: var(--font-mono); font-size: 12px; cursor: pointer; }
.proto-pill:hover { background: var(--surface-3); }
.connect-form { display: flex; flex-direction: column; gap: 10px; max-width: 440px; padding-top: 4px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-secondary); }
.field input { height: 32px; padding: 0 10px; border-radius: var(--radius-sm); border: var(--hairline) solid var(--border-strong); background: var(--surface-2); color: var(--text-primary); font-size: 13px; }
.section-kicker { font-size: 12px; font-weight: 600; color: var(--text-tertiary); padding: 8px 0 4px; }

/* Slim pinned approval strip */
.gate { flex: none; border-top: var(--hairline) solid var(--border); padding: 8px 0 4px; }
.gate-body { display: flex; align-items: center; gap: 8px; }
.gate-icon { width: 26px; height: 26px; border-radius: var(--radius-sm); display: grid; place-items: center; flex: none; background: var(--surface-2); }
.gate-item { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gate-kicker { font-size: 13px; font-weight: 600; }
.gate-sub { font-size: 12px; color: var(--text-secondary); }
.gate-item .ev { font-size: 12px; color: var(--danger); }
.gate-actions { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.gate.awaiting .gate-icon { background: var(--warning-soft); color: var(--warning); }
.gate.awaiting .gate-kicker { color: var(--warning); }
.gate.placed .gate-icon { background: var(--success-soft); color: var(--success); animation: popIn 260ms var(--ease-out); }
.gate.placed .gate-kicker { color: var(--success); }
.gate.stopped .gate-icon { background: var(--danger-soft); color: var(--danger); }

.skipped { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-tertiary); }
.none-found { padding: 24px 0; text-align: center; color: var(--text-tertiary); }

/* Chips, prefs, trail */
.chip { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 999px; background: var(--surface-2); color: var(--text-secondary); font-size: 12px; }
.chip.c-ink { background: var(--surface-3); color: var(--text-primary); }
.chip.c-red { background: var(--danger-soft); color: var(--danger); }
.chip.c-green { background: var(--success-soft); color: var(--success); }
.chip.c-amber { background: var(--warning-soft); color: var(--warning); }
.chip.struck { text-decoration: line-through; }
.prefs { flex: none; display: flex; flex-wrap: wrap; gap: 6px 12px; padding-bottom: 8px; border-bottom: var(--hairline) solid var(--border); }
.pref { display: inline-flex; align-items: center; gap: 4px; margin: 0; }
.pref dt { font-size: 12px; color: var(--text-tertiary); }
.pref dd { margin: 0; display: inline-flex; flex-wrap: wrap; gap: 4px; }
.trail { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.trail li { display: grid; grid-template-columns: 58px 1fr; gap: 6px; padding: 4px 0; border-bottom: var(--hairline) solid var(--border); font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
.trail .k { font-family: var(--font-sans); text-align: center; padding: 1px 4px; border-radius: 4px; background: var(--surface-2); color: var(--text-secondary); }
.trail .k-skip, .trail .k-refused, .trail .k-reject { background: var(--danger-soft); color: var(--danger); }
.trail .k-cart { background: var(--warning-soft); color: var(--warning); }
.trail .k-approved, .trail .k-memory { background: var(--success-soft); color: var(--success); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: var(--radius-sm); border: 0; background: var(--surface-2); color: var(--text-primary); font-family: var(--font-sans); font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background 100ms var(--ease-out), transform 100ms var(--ease-out); }
.btn:hover:not(:disabled) { background: var(--surface-3); transform: scale(1.02); }
.btn:active:not(:disabled) { background: var(--surface-press); transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--ink-fill); color: var(--on-ink); font-weight: 600; }
.btn-primary:hover:not(:disabled) { background: var(--ink-fill-hover); }
.btn-ghost { background: transparent; color: var(--text-secondary); }
.btn-ghost:hover:not(:disabled) { background: var(--surface-3); color: var(--text-primary); }
.btn-icon { width: 28px; height: 28px; padding: 0; }
.btn-small { height: 24px; padding: 0 8px; }
.btn-danger { color: var(--danger); }
.btn-danger:hover:not(:disabled) { background: var(--danger-soft); color: var(--danger); }

/* Empty & Skeleton */
.empty { flex: 1; display: grid; place-items: center; }
.examples { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.example-chip { height: 28px; padding: 0 10px; border-radius: 999px; border: var(--hairline) solid var(--border); background: transparent; color: var(--text-secondary); font-family: var(--font-sans); font-size: 12px; cursor: pointer; transition: background 100ms var(--ease-out); }
.example-chip:hover { background: var(--surface-2); color: var(--text-primary); }
.skeleton { flex: 1; display: flex; flex-direction: column; gap: 8px; padding-top: 6px; }
.sk-row { height: 48px; border-radius: var(--radius-sm); background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.1s ease-in-out infinite; }

/* Live plan strip + Agent's browser (kept from ui-mockup, adapted to our base) */
.agent-plan { flex: none; border-bottom: var(--hairline) solid var(--border); padding-bottom: 6px; display: flex; flex-direction: column; gap: 6px; animation: enter 180ms var(--ease-out); }
.plan-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.live-dot { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-secondary); }
.live-dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--danger); }

.ab-thumb-lg { height: 74px; width: 74px; flex: none; }

.ab-sk-sm { width: 60%; }
.ab-detail { display: flex; gap: 10px; align-items: center; }
.ab-detail-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.ab-tr { font-weight: 600; background: var(--warning-soft); color: var(--warning); padding: 1px 5px; border-radius: 4px; align-self: flex-start; }
.ab-jp { font-size: 11px; color: var(--text-tertiary); }
.ab-fakebtn { display: inline-block; align-self: flex-start; padding: 2px 8px; border-radius: 4px; background: #e11d48; color: #fff; font-size: 11px; font-weight: 600; }
.ab-cartrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px; border: var(--hairline) solid var(--border); border-radius: 6px; }
.ab-cart-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ab-controls { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.ab-paused { margin-top: 6px; padding: 5px 8px; border-radius: 6px; background: var(--warning-soft); color: var(--warning); font-weight: 600; font-size: 12px; }
.ab-paused.placed { background: var(--success-soft); color: var(--success); }

.notify-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); cursor: pointer; }
.switch { appearance: none; width: 28px; height: 16px; border-radius: 999px; background: var(--border-strong); position: relative; cursor: pointer; margin: 0; transition: background 180ms var(--ease-out); }
.switch::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface-1); transition: transform 180ms var(--ease-out); }
.switch:checked { background: var(--ink-fill); }
.switch:checked::after { transform: translateX(12px); }

@keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
@keyframes ping { from { transform: scale(0.3); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }

/* Bottom pinned composer */
.composer { border: 0; border-radius: 20.5px; padding: 4px 6px 4px 12px; background: var(--surface-1); }
.composer-wrap { flex: none; padding: 6px 0 10px; background: var(--bg-app); }

.composer-row { display: flex; align-items: center; gap: 6px; }
.composer-row > input { flex: 1; min-width: 0; height: 30px; border: 0; background: transparent; color: var(--text-primary); font-family: var(--font-sans); font-size: 13px; }
.composer-row > input:focus { outline: none; }
.ctrl { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; color: var(--text-tertiary); }
.ctrl input, .ctrl select { height: 24px; padding: 0 5px; border-radius: 4px; border: 0; background: var(--surface-2); color: var(--text-primary); font-family: var(--font-sans); font-size: 12px; }
.ctrl input[type="number"] { width: 52px; font-variant-numeric: tabular-nums; }

.toast { position: fixed; bottom: 58px; left: 50%; transform: translateX(-50%); padding: 6px 12px; border-radius: 999px; background: var(--ink-fill); color: var(--on-ink); font-size: 12px; font-weight: 500; z-index: 50; animation: bubbleIn 160ms var(--ease-out); }

@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

@keyframes rowIn { from { opacity: 0; transform: translateX(-5px); } to { opacity: 1; transform: translateX(0); } }

  function resolveRealUrl(listing) {
    var ui = root.JSA.ui;
    var buyee = listing && listing.fields && listing.fields.buyee_url;
    return ui.safeUrl(buyee) || ui.safeUrl(listing && listing.url) || "https://buyee.jp/";
  }

  function initAgent(onStop) {
    var ui = root.JSA.ui;
    var ring = ui.$("composer-ring");
    var strip = ui.$("agent-plan");
    var stepsEl = ui.$("plan-steps");
    var dot = ui.$("plan-dot");
    var elapsedEl = ui.$("plan-elapsed");
    var stopBtn = ui.$("plan-stop");
    var toggleBtn = ui.$("browser-toggle");
    var browserWrap = ui.$("agent-browser");
    var urlEl = ui.$("ab-url");
    var screenEl = ui.$("ab-screen");
    var cursorEl = ui.$("ab-cursor");
    var captionEl = ui.$("ab-caption");
    var notifyToggle = ui.$("notify-toggle");
    var clock = null, startAt = 0, aborted = false, browserOpen = false;

    function setBrowserVisible(on) {
      browserOpen = on;
      if (browserWrap) browserWrap.hidden = !on;
      if (toggleBtn) toggleBtn.classList.toggle("active", on);
    }

    function renderSteps(activeIdx) {
      if (!stepsEl) return;
      ui.clear(stepsEl);
      STEPS.forEach(function (label, i) {
        var cls = i < activeIdx ? "done" : (i === activeIdx ? "now" : "");
        stepsEl.appendChild(ui.h("li", { class: cls },
          ui.h("span", { class: "step-dot" }, i < activeIdx ? "\u2713" : String(i + 1)),
          ui.h("span", null, label)));
      });
    }

    function showStage(url, nodes, caption) {
      if (urlEl) urlEl.textContent = url;
      if (screenEl) { ui.clear(screenEl); ui.append(screenEl, nodes); }
      if (captionEl) captionEl.textContent = caption;
      if (cursorEl) cursorEl.hidden = true;
    }

    function clearTimers() {
      clearInterval(clock);
      clock = null;
    }

    function startSearch() { if (ring) ring.classList.add("working"); }
    function finishSearch() { if (ring) ring.classList.remove("working"); }

    function beginRealBuy(pick, profile) {
      aborted = false;
      clearTimers();
      var l = pick.listing, realUrl = resolveRealUrl(l);
      var cardStr = profile && profile.card ? (profile.card.brand + " •••• " + profile.card.last4) : "Saved card";

      if (ring) ring.classList.add("working");
      if (strip) strip.hidden = false;
      setBrowserVisible(true);
      if (dot) { dot.className = "live-dot live"; dot.textContent = "Chrome · Opening"; }
      if (stopBtn) stopBtn.disabled = false;
      startAt = Date.now();
      if (elapsedEl) elapsedEl.textContent = "0s";
      clock = setInterval(function () {
        if (elapsedEl) elapsedEl.textContent = Math.round((Date.now() - startAt) / 1000) + "s";
      }, 250);

      renderSteps(1);
      showStage(realUrl, [
        ui.h("div", { class: "ab-site" },
          ui.h("div", { class: "ab-cartrow" },
            ui.h("span", { class: "ab-cart-title" }, "Opening real website in Chrome: " + l.title_en),
            ui.h("a", { href: realUrl, target: "_blank", rel: "noopener noreferrer", class: "btn btn-small btn-primary" },
              ui.icon("link-external", 12), "Open site")),
          ui.h("div", { class: "ab-jp" }, "Vault: " + (profile && profile.userId || "default") + " · " + cardStr))
      ], "Launching real Chrome window via don-tacos dt-ax…");

      return realUrl;
    }

    function completeRealBuy(pick, profile, res, realUrl) {
      if (aborted) return;
      clearTimers();
      renderSteps(STEPS.length);
      if (ring) ring.classList.remove("working");
      if (stopBtn) stopBtn.disabled = true;

      var cua = (res && res.cua) || {};
      var openedInChrome = Boolean(cua.opened_in_chrome);
      var targetUrl = cua.opened_url || realUrl;
      var controls = Array.isArray(cua.controls) ? cua.controls : [];
      var l = pick.listing, total = ui.totalOf(pick.cost);

      // In standalone file:// preview (no backend server), open the real website directly in a new browser tab
      if (!openedInChrome && location.protocol === "file:") {
        try { window.open(targetUrl, "_blank", "noopener,noreferrer"); } catch (e) {}
      }

      if (dot) {
        dot.className = "live-dot paused";
        dot.textContent = openedInChrome ? "Chrome · Live" : "Tab opened";
      }

      var statusText = openedInChrome
        ? ("Chrome window " + (cua.window || "") + " opened via don-tacos dt-ax" + (controls.length ? (" · " + controls.length + " controls read") : ""))
        : (cua.error ? ("Fallback tab opened (" + cua.error + ")") : "Opened real website in new browser tab.");

      var controlChips = controls.length
        ? ui.h("div", { class: "ab-controls" }, controls.slice(0, 5).map(function (c) {
            return ui.h("span", { class: "chip" }, c.label);
          }))
        : null;

      showStage(targetUrl, [
        ui.h("div", { class: "ab-site" },
          ui.h("div", { class: "ab-cartrow" },
            ui.h("span", { class: "ab-cart-title" }, l.title_en + " · " + ui.usd(total)),
            ui.h("a", { href: targetUrl, target: "_blank", rel: "noopener noreferrer", class: "btn btn-small" },
              ui.icon("link-external", 12), "Open tab")),
          controlChips,
          ui.h("div", { class: "ab-paused" }, statusText + " · Swipe below to pay."))
      ], openedInChrome ? "Real Chrome tab ready · swipe to pay" : "Real site opened · swipe to pay");

      notify("Ready — swipe to pay " + ui.usd(total));
    }

    function markPaid(pick) {
      var l = pick ? pick.listing : { title_en: "Order" };
      var realUrl = resolveRealUrl(l);
      showStage(realUrl, [
        ui.h("div", { class: "ab-site" },
          ui.h("div", { class: "ab-paused placed" }, "Paid & ordered: " + l.title_en))
      ], "Order placed.");
      if (dot) { dot.className = "live-dot paused"; dot.textContent = "Paid"; }
    }

    function stop() {
      aborted = true;
      clearTimers();
      if (ring) ring.classList.remove("working");
      if (dot) { dot.className = "live-dot stopped"; dot.textContent = "Stopped"; }
      if (stopBtn) stopBtn.disabled = true;
      if (captionEl) captionEl.textContent = "Stopped. Nothing paid.";
      ui.toast("Stopped · nothing paid");
      if (onStop) onStop();
    }

    function notify(msg) {
      ui.toast(msg);
      if (notifyToggle && notifyToggle.checked && document.hidden && "Notification" in window && Notification.permission === "granted") {
        try { new Notification("Shopping Agent", { body: msg }); } catch (e) {}
      }
    }

    if (stopBtn) stopBtn.addEventListener("click", stop);
    if (toggleBtn) toggleBtn.addEventListener("click", function () { setBrowserVisible(!browserOpen); });
    if (notifyToggle) {
      notifyToggle.addEventListener("change", function () {
        if (notifyToggle.checked && "Notification" in window && Notification.permission === "default") {
          Notification.requestPermission().catch(function () {});
        }
      });
    }

    return {
      startSearch: startSearch,
      finishSearch: finishSearch,
      beginRealBuy: beginRealBuy,
      completeRealBuy: completeRealBuy,
      markPaid: markPaid,
      stop: stop,
      notify: notify,
      isAborted: function () { return aborted; }
    };
  }

  root.JSA = root.JSA || {};
  root.JSA.agent = { init: initAgent };
})(window);

/* Module: Generative Chat UI renderer — AI emits typed UI components directly inside chat messages:
   - product_list (sortable list with Buy button on every row)
   - agent_browser (don-tacos dt-ax Chrome Computer Use live viewport)
   - swipe_pay (Swipe-to-Pay checkout approval slider)
   - cost_breakdown (inline cited landed cost breakdown) */
(function (root) {
  "use strict";

  function initChatUI() {
    var ui = root.JSA.ui;
    var stream = ui.$("chat-stream");

    function scrollBottom() {
      if (stream) {
        requestAnimationFrame(function () { stream.scrollTop = stream.scrollHeight; });
      }
    }

    function appendUser(text) {
      var msg = ui.h("div", { class: "msg msg-user" }, ui.h("div", { class: "bubble" }, text));
      stream.appendChild(msg);
      scrollBottom();
      return msg;
    }

    function appendSkeleton() {
      var sk = ui.h("div", { class: "msg msg-agent chat-sk" },
        ui.h("div", { class: "sk-row" }),
        ui.h("div", { class: "sk-row" }),
        ui.h("div", { class: "sk-row" }));
      stream.appendChild(sk);
      scrollBottom();
      return sk;
    }

    function appendAgentBlock(caption, bodyNode) {
      var msg = ui.h("div", { class: "msg msg-agent" },
        caption ? ui.h("div", { class: "agent-caption" }, ui.h("span", { class: "dia-orb dia-orb-sm", "aria-hidden": "true" }), caption) : null,
        bodyNode);
      stream.appendChild(msg);
      scrollBottom();
      return msg;
    }

    return {
      appendUser: appendUser,
      appendSkeleton: appendSkeleton,
      appendAgentBlock: appendAgentBlock,
      scrollBottom: scrollBottom
    };
  }

  root.JSA = root.JSA || {};
  root.JSA.chatUI = { init: initChatUI };
})(window);

/* Orchestrator: wires Dia-style UI, 7-page router, User Vault, Sortable list + Buy -> Chrome Computer Use -> Swipe-to-Pay. */
(function (root) {
  "use strict";

  var ui = root.JSA.ui;
  var state = {
    result: null, cart: null, usedToken: null, gateEvent: null,
    busy: false, selectedIdx: 0, targetItemId: "", activeStoreSlug: "tokyo-camera",
    sortKey: "best", buyReady: false
  };

  function api(path, body) {
    return fetch(path, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
        return data;
      });
    }, function () { throw new Error("Server unreachable"); });
  }

  function showError(msg) {
    var el = ui.$("error");
    el.hidden = !msg;
    el.textContent = msg || "";
  }

  function setBusy(on) {
    state.busy = on;
    ui.$("go").disabled = on;
    if (on) {
      ui.$("empty").hidden = true;
      ui.$("results").hidden = true;
      ui.$("skeleton").hidden = false;
    } else {
      ui.$("skeleton").hidden = true;
      if (state.result) ui.$("results").hidden = false;
      else ui.$("empty").hidden = false;
    }
  }

  function requestBody() {
    var r = state.result.request;
    return {
      query: r.query, budget: r.max_total_usd, ship_to: r.ship_to,
      user_id: vaultMod.get().userId, condition_min: r.condition_min
    };
  }

  function copyText(text, label) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { ui.toast(label || "Copied"); }).catch(function () {});
    } else {
      ui.toast(label || "Copied");
    }
  }

  function startBuyFlow(pick, idx) {
    if (state.busy || !state.result) return;
    state.selectedIdx = idx;
    state.buyReady = false;
    routerMod.go("shop");
    renderAll();

    var body = requestBody();
    body.listing_id = pick.listing.id;
    body.open_real = true;
    var profile = vaultMod.get();
    var realUrl = agentMod.beginRealBuy(pick, profile);
    chatMod.scrollBottom();

    api("/api/buy", body).then(function (res) {
      if (agentMod.isAborted()) return;
      if (res && res.cart) {
        state.result = res;
        state.cart = res.cart;
        state.usedToken = null;
        state.gateEvent = null;
      }
      state.buyReady = true;
      agentMod.completeRealBuy(pick, profile, res, realUrl);
      renderAll();
      chatMod.scrollBottom();
    }, function (e) {
      agentMod.stop();
      showError(e.message);
    });
  }

  function renderAll() {
    var c = root.JSA.commerce, p = root.JSA.pages;
    if (state.result) {
      c.renderPrefs(state.result);
      c.renderTrail(state.result);
      c.renderPicks(state, searchMod.getFilter(), state.sortKey, {
        onSelect: function (i) {
          state.selectedIdx = i;
          c.renderCost(state, { onBuy: startBuyFlow });
          routerMod.go("item");
        },
        onBuy: startBuyFlow,
        onReject: rejectSeller,
        onCopyItemLink: function (listingId) {
          var r = state.result.request;
          linksMod.copyLink(linksMod.buildDeepLink({ q: r.query, budget: r.max_total_usd, ship_to: r.ship_to, cond: r.condition_min || "", item: listingId }));
        }
      });
      c.renderCost(state, { onBuy: startBuyFlow });
      c.renderGate(state, vaultMod.get(), {
        onApprove: approve,
        onReject: rejectSeller,
        onReplay: replayToken
      });
    }
    p.renderOrders(state, { onApprove: approve });
    p.renderStore(state.activeStoreSlug, state, {
      onCopy: copyText,
      onRunStore: function (store) {
        ui.$("query").value = store.q;
        ui.$("budget").value = store.budget;
        runSearch(null, true);
      },
      onOpenItem: function (i) {
        state.selectedIdx = i;
        c.renderCost(state, { onBuy: startBuyFlow });
        routerMod.go("item");
      }
    });
  }

  function show(result, stayOnPage) {
    state.result = result;
    state.cart = result.cart;
    state.usedToken = null;
    state.gateEvent = null;
    state.selectedIdx = 0;
    state.buyReady = false;
    var openItem = false;
    if (state.targetItemId && result.picks) {
      var idx = result.picks.findIndex(function (p) { return p.listing.id === state.targetItemId; });
      if (idx >= 0) { state.selectedIdx = idx; openItem = true; }
      state.targetItemId = "";
    }
    ui.$("empty").hidden = true;
    ui.$("skeleton").hidden = true;
    ui.$("results").hidden = false;
    agentMod.finishSearch();
    renderAll();
    renderMeta(result.meta);
    if (openItem) routerMod.go("item");
    else if (!stayOnPage) routerMod.go("shop");
  }

  function runSearch(ev, stayOnPage) {
    if (ev) ev.preventDefault();
    if (state.busy) return;
    showError("");
    var parsed = searchMod.parseQuery(ui.$("query").value, ui.$("budget").value);
    ui.$("budget").value = parsed.budget;
    var profile = vaultMod.get();
    var body = {
      query: parsed.query, budget: parsed.budget, ship_to: ui.$("ship_to").value || profile.shipTo,
      user_id: profile.userId, condition_min: ui.$("condition_min").value || null
    };
    searchMod.record(body.query, body.budget, body.ship_to);
    ui.$("user-turn").hidden = false;
    ui.$("user-bubble").textContent = body.query + " · $" + body.budget;
    if (!stayOnPage) routerMod.go("shop");
    setBusy(true);
    agentMod.startSearch();
    api("/api/run", body).then(function (res) { show(res, stayOnPage); }, function (e) { agentMod.finishSearch(); showError(e.message); }).then(function () { setBusy(false); });
  }

  function rejectSeller(seller) {
    if (state.busy || !state.result) return;
    showError("");
    var body = requestBody();
    body.seller = seller;
    routerMod.go("shop");
    setBusy(true);
    agentMod.startSearch();
    api("/api/reject", body).then(function (res) { show(res, false); }, function (e) { agentMod.finishSearch(); showError(e.message); }).then(function () { setBusy(false); });
  }

  function approve(btn) {
    var token = state.cart && state.cart.approval_token;
    if (!token || state.busy) return;
    showError("");
    if (btn) btn.disabled = true;
    api("/api/approve", { token: token }).then(function (r) {
      state.usedToken = token;
      r.cart.listing_id = r.cart.listing_id || state.cart.listing_id;
      state.cart = r.cart;
      state.result.trail = state.result.trail.concat(r.trail || []);
      renderAll();
      if (r.cart.status === "placed") {
        var pick = state.result.picks.filter(function (p) { return p.listing.id === state.cart.listing_id; })[0];
        agentMod.markPaid(pick);
        agentMod.notify("Paid · order placed");
      }
    }, function (e) { showError(e.message); if (btn) btn.disabled = false; });
  }

  function replayToken(btn) {
    if (!state.usedToken) return;
    btn.disabled = true;
    api("/api/approve", { token: state.usedToken }).then(function (r) {
      state.gateEvent = "Replay: " + r.cart.status;
      state.result.trail = state.result.trail.concat(r.trail || []);
      if (r.cart.status === "placed") state.cart = r.cart;
      renderAll();
    }, function (e) { showError(e.message); btn.disabled = false; });
  }

  function renderMeta(meta) {
    if (!meta) return;
    var m = ui.clear(ui.$("mode"));
    m.hidden = false;
    m.className = "mode" + (meta.live ? " live" : "");
    m.setAttribute("title", meta.live ? "Live adapters" : "Offline dry run");
    ui.append(m, [ui.icon(meta.live ? "globe" : "shield-check", 14), meta.live ? "Live" : "Dry"]);
  }

  // Init modules
  var chatMod = root.JSA.chatUI.init();
  var vaultMod = root.JSA.vault.init(function (profile) {
    if (profile && profile.shipTo) ui.$("ship_to").value = profile.shipTo;
    renderAll();
  });
  var agentMod = root.JSA.agent.init(function () { setBusy(false); });
  var menuMod = root.JSA.menu.init({});
  var routerMod = root.JSA.router.init(function (page) {
    menuMod.close();
    if (page === "vault") vaultMod.render();
    if (page === "orders" || page === "store") renderAll();
  });
  var searchMod = root.JSA.search.init(function () { menuMod.close(); runSearch(); });
  searchMod.onFilterChange(function () { if (state.result) renderAll(); });

  var sortEl = ui.$("sort-by");
  if (sortEl) {
    sortEl.addEventListener("change", function () {
      state.sortKey = sortEl.value;
      if (state.result) renderAll();
    });
  }

  root.JSA.pages.initConnect(function (store) {
    state.activeStoreSlug = store.slug;
    ui.$("query").value = store.q;
    ui.$("budget").value = store.budget;
    routerMod.go("store");
    runSearch(null, true);
  }, copyText);

  var linksMod = root.JSA.links.init(function (target) {
    if (target.q) ui.$("query").value = target.q;
    if (target.budget) ui.$("budget").value = target.budget;
    if (target.ship_to) ui.$("ship_to").value = target.ship_to;
    if (target.cond !== undefined) ui.$("condition_min").value = target.cond;
    state.targetItemId = target.item || "";
    menuMod.close();
    runSearch();
  }, function () {
    var pick = state.result && state.result.picks && state.result.picks[state.selectedIdx];
    return { selectedListingId: pick ? pick.listing.id : "" };
  });

  ui.$("form").addEventListener("submit", function (e) { runSearch(e, false); });
  document.querySelectorAll(".example-chip").forEach(function (btn) {
    btn.addEventListener("click", function () {
      ui.$("query").value = btn.getAttribute("data-q") || "";
      ui.$("budget").value = btn.getAttribute("data-budget") || "900";
      runSearch();
    });
  });

  if (linksMod.initial) {
    if (linksMod.initial.q) ui.$("query").value = linksMod.initial.q;
    if (linksMod.initial.budget) ui.$("budget").value = linksMod.initial.budget;
    if (linksMod.initial.ship_to) ui.$("ship_to").value = linksMod.initial.ship_to;
    if (linksMod.initial.cond) ui.$("condition_min").value = linksMod.initial.cond;
    state.targetItemId = linksMod.initial.item || "";
  }

  renderAll();
  fetch("/api/meta").then(function (r) { return r.json(); }).then(function (meta) {
    renderMeta(meta);
    if (linksMod.initial && linksMod.initial.run && !meta.live) runSearch();
  }).catch(function () {});
})(window);

</script>
<script>window.addEventListener('DOMContentLoaded',function(){var f=document.getElementById('form');if(f)f.dispatchEvent(new Event('submit',{cancelable:true}));});</script>
