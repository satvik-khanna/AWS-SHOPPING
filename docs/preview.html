<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Japan Shopping Agent</title>
<style>
/* Japan Shopping Agent — Shibubu Design Tokens + GitHub Primer aesthetic.
   Icons: @primer/octicons v19.42.0 (MIT License), inlined locally. Zero external assets. */

:root {
  /* Palette (Shibubu tokens.css — Light default; ink primary, no blue accent except working state) */
  --bg-app: #f6f7f8;
  --surface-1: #ffffff;
  --surface-2: #f3f5f7;
  --surface-3: #eaedf1;
  --surface-press: #dfe4ea;
  --border: #e2e6ea;
  --border-strong: #b9c1cb;
  --text-primary: #202731;
  --text-secondary: #515d6b;
  --text-tertiary: #6c7682;

  /* Primary interactive = monochrome ink (Shibubu §3) */
  --ink-fill: #202731;
  --ink-fill-hover: #323b47;
  --on-ink: #ffffff;

  /* Semantic status (icon + text + subtle tint only) */
  --danger: #ab271e;
  --danger-soft: #fdecea;
  --warning: #8a5700;
  --warning-soft: #fdf3dc;
  --success: #17633a;
  --success-soft: #e6f4ec;
  --working: #2359ce;
  --working-soft: #e9f0fc;
  --focus-ring: #202731;

  /* Landed-cost bar segments (muted, legible, neutral-first) */
  --seg-0: #202731;
  --seg-1: #515d6b;
  --seg-2: #8a5700;
  --seg-3: #17633a;
  --seg-4: #8c959f;
  --seg-5: #b9c1cb;

  /* Spacing scale (Shibubu compact 4px grid) */
  --sp-1: 4px;
  --sp-2: 6px;
  --sp-3: 10px;
  --sp-4: 12px;
  --sp-5: 16px;
  --sp-6: 18px;
  --sp-7: 24px;

  /* Geometry (Shibubu §4/§5 compact: header 44, control 30, button 28/24) */
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 10px;
  --hairline: 1px;
  --control-h: 30px;
  --shadow-popup: 0 4px 14px rgba(32, 39, 49, 0.08);

  /* Typography */
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  /* Motion */
  --dur-hover: 100ms;
  --dur-enter: 180ms;
  --ease-out: cubic-bezier(0.33, 1, 0.68, 1);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-app: #11151b;
    --surface-1: #191e25;
    --surface-2: #232a33;
    --surface-3: #2c3540;
    --surface-press: #36414f;
    --border: #39424d;
    --border-strong: #5d6a78;
    --text-primary: #f1f5f9;
    --text-secondary: #c1cbd5;
    --text-tertiary: #a2afbc;
    --ink-fill: #f1f5f9;
    --ink-fill-hover: #dde5ee;
    --on-ink: #11151b;
    --danger: #ff9d94;
    --danger-soft: #3a1f21;
    --warning: #e7bd70;
    --warning-soft: #352915;
    --success: #7ddaa5;
    --success-soft: #173024;
    --working: #91b5ff;
    --working-soft: #1b2840;
    --focus-ring: #f1f5f9;
    --seg-0: #e2e8f0;
    --seg-1: #94a3b8;
    --seg-2: #e7bd70;
    --seg-3: #7ddaa5;
    --seg-4: #64748b;
    --seg-5: #475569;
    --shadow-popup: 0 6px 20px rgba(0, 0, 0, 0.36);
  }
}

:root[data-theme="dark"] {
  --bg-app: #11151b;
  --surface-1: #191e25;
  --surface-2: #232a33;
  --surface-3: #2c3540;
  --surface-press: #36414f;
  --border: #39424d;
  --border-strong: #5d6a78;
  --text-primary: #f1f5f9;
  --text-secondary: #c1cbd5;
  --text-tertiary: #a2afbc;
  --ink-fill: #f1f5f9;
  --ink-fill-hover: #dde5ee;
  --on-ink: #11151b;
  --danger: #ff9d94;
  --danger-soft: #3a1f21;
  --warning: #e7bd70;
  --warning-soft: #352915;
  --success: #7ddaa5;
  --success-soft: #173024;
  --working: #91b5ff;
  --working-soft: #1b2840;
  --focus-ring: #f1f5f9;
  --seg-0: #e2e8f0;
  --seg-1: #94a3b8;
  --seg-2: #e7bd70;
  --seg-3: #7ddaa5;
  --seg-4: #64748b;
  --seg-5: #475569;
  --shadow-popup: 0 6px 20px rgba(0, 0, 0, 0.36);
}

*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg-app); color-scheme: light dark; }
body {
  margin: 0;
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 18px;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

a {
  color: var(--text-primary);
  text-decoration: underline;
  text-decoration-color: var(--border-strong);
  text-underline-offset: 2px;
  transition: color var(--dur-hover) var(--ease-out), text-decoration-color var(--dur-hover) var(--ease-out);
}
a:hover { text-decoration-color: var(--text-primary); }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

.octicon {
  display: inline-block;
  vertical-align: text-bottom;
  fill: currentColor;
  flex: none;
}

/* Header (GitHub / Shibubu 52px single-row bar) */
.top {
  background: var(--surface-1);
  border-bottom: var(--hairline) solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}
.top-inner {
  max-width: 1120px;
  margin: 0 auto;
  height: 44px;
  padding: 0 var(--sp-5);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
}
.brand {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  min-width: 0;
}
.brand-icon { color: var(--text-primary); }
.top h1 {
  margin: 0;
  font-size: 14px;
  line-height: 18px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}
.btn-icon {
  width: 28px;
  height: 28px;
  padding: 0;
}
.pick-links {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-3);
}
.tok-row {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
}
.tok-row .tok { margin-top: 0; }
.btn-copy {
  height: 22px;
  padding: 0 6px;
  font-size: 12px;
}

.mode {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  border: var(--hairline) solid var(--border);
  background: var(--surface-2);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
}
.mode.live {
  border-color: var(--danger);
  background: var(--danger-soft);
  color: var(--danger);
}

/* Main workspace */
main {
  max-width: 1120px;
  margin: 0 auto;
  padding: var(--sp-4) var(--sp-5) var(--sp-6);
}
.step { margin-top: var(--sp-5); }
.step-request { margin-top: 0; }
.step-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-2);
  margin-bottom: var(--sp-2);
}
.step-head h2 {
  margin: 0;
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  font-size: 13px;
  line-height: 18px;
  font-weight: 600;
  color: var(--text-primary);
}
.step-head h2 .octicon { color: var(--text-secondary); }
.step-sub {
  font-size: 12px;
  line-height: 18px;
  color: var(--text-secondary);
}

/* Search bar (single unified control surface) */
.request {
  display: grid;
  grid-template-columns: minmax(220px, 3fr) minmax(110px, 0.9fr) minmax(90px, 0.75fr) minmax(110px, 0.9fr) auto;
  gap: var(--sp-2);
  align-items: end;
  background: var(--surface-1);
  border: var(--hairline) solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--sp-3);
}
.f {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.f > span:first-child {
  font-size: 12px;
  line-height: 14px;
  font-weight: 500;
  color: var(--text-secondary);
}
.f input, .f select {
  width: 100%;
  height: var(--control-h);
  padding: 0 8px;
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 18px;
  color: var(--text-primary);
  background: var(--surface-1);
  border: var(--hairline) solid var(--border-strong);
  border-radius: var(--radius-sm);
  transition: border-color var(--dur-hover) var(--ease-out), box-shadow var(--dur-hover) var(--ease-out);
}
.f input:focus, .f select:focus {
  border-color: var(--text-primary);
  box-shadow: 0 0 0 2px var(--surface-3);
  outline: none;
}
.input-wrap {
  position: relative;
  display: block;
}
.input-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-tertiary);
  pointer-events: none;
}
.input-wrap input { padding-left: 32px; }
.money-in { position: relative; display: block; }
.money-in i {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-style: normal;
  font-size: 13px;
  color: var(--text-tertiary);
  pointer-events: none;
}
.money-in input {
  padding-left: 22px;
  font-variant-numeric: tabular-nums;
}

/* Buttons (Shibubu §5 + GitHub Primer compact geometry) */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: var(--control-h);
  padding: 0 12px;
  border-radius: var(--radius-sm);
  border: var(--hairline) solid var(--border);
  background: var(--surface-1);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  line-height: 1;
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--dur-hover) var(--ease-out), border-color var(--dur-hover) var(--ease-out), transform var(--dur-hover) var(--ease-out);
}
.btn:hover:not(:disabled) { background: var(--surface-3); border-color: var(--border-strong); }
.btn:active:not(:disabled) { background: var(--surface-press); transform: scale(0.985); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }

.btn-primary {
  background: var(--ink-fill);
  border-color: var(--ink-fill);
  color: var(--on-ink);
  font-weight: 600;
}
.btn-primary:hover:not(:disabled) { background: var(--ink-fill-hover); border-color: var(--ink-fill-hover); }

.btn-ghost {
  border-color: transparent;
  background: transparent;
  color: var(--text-secondary);
}
.btn-ghost:hover:not(:disabled) {
  background: var(--surface-3);
  border-color: transparent;
  color: var(--text-primary);
}

.btn-small {
  height: 24px;
  padding: 0 8px;
  font-size: 12px;
}

.btn-danger {
  border-color: transparent;
  background: transparent;
  color: var(--danger);
}
.btn-danger:hover:not(:disabled) {
  background: var(--danger-soft);
  border-color: transparent;
}

.error {
  margin: var(--sp-3) 0 0;
  padding: 10px var(--sp-3);
  border-radius: var(--radius-sm);
  border: var(--hairline) solid var(--danger);
  background: var(--danger-soft);
  color: var(--danger);
  font-size: 13px;
  font-weight: 500;
}

/* Empty state (minimal, factual, zero catchcopy) */
.empty {
  margin-top: var(--sp-7);
  padding: var(--sp-7) var(--sp-4);
  text-align: center;
  border: var(--hairline) dashed var(--border);
  border-radius: var(--radius-md);
  color: var(--text-secondary);
}
.empty-icon { color: var(--text-tertiary); margin-bottom: var(--sp-2); }
.empty-lead {
  margin: 0 0 var(--sp-4);
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
}
.examples {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: var(--sp-2);
}
.example-chip {
  height: 28px;
  padding: 0 10px;
  border-radius: var(--radius-sm);
  border: var(--hairline) solid var(--border);
  background: var(--surface-1);
  color: var(--text-secondary);
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: background var(--dur-hover) var(--ease-out), color var(--dur-hover) var(--ease-out), border-color var(--dur-hover) var(--ease-out);
}
.example-chip:hover {
  background: var(--surface-3);
  border-color: var(--border-strong);
  color: var(--text-primary);
}

/* Skeleton loading (Shibubu §9 / Kangae §15) */
.skeleton { margin-top: var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-4); }
.sk-row, .sk-line, .sk-block {
  border-radius: var(--radius-sm);
  background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.2s ease-in-out infinite;
}
.sk-prefs { height: 48px; }
.sk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: var(--sp-4); }
.sk-card {
  background: var(--surface-1);
  border: var(--hairline) solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}
.sk-line { height: 14px; }
.sk-lg { height: 22px; }
.sk-block { height: 68px; }
.sk-w40 { width: 40%; }
.sk-w60 { width: 60%; }
.sk-w75 { width: 75%; }
.sk-w80 { width: 80%; }
.sk-w90 { width: 90%; }

@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@keyframes enter {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
#results:not([hidden]) { animation: enter var(--dur-enter) var(--ease-out); }
.stale { opacity: 0.5; pointer-events: none; transition: opacity var(--dur-hover) var(--ease-out); }

/* 2 Preferences (flat single strip, no nested boxes) */
.prefs {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-3) var(--sp-5);
  background: var(--surface-1);
  border: var(--hairline) solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--sp-3) var(--sp-4);
}
.pref {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin: 0;
}
.pref dt {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-tertiary);
}
.pref dd {
  margin: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 13px;
  font-weight: 500;
}
.pref .none { color: var(--text-tertiary); font-weight: 400; }
.prefs-empty { color: var(--text-secondary); font-size: 13px; }

/* GitHub Primer-style labels / chips */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 20px;
  padding: 0 7px;
  border-radius: 999px;
  border: var(--hairline) solid var(--border);
  background: var(--surface-2);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 500;
  line-height: 1;
  white-space: nowrap;
}
.chip.c-ink {
  background: var(--surface-3);
  border-color: var(--border-strong);
  color: var(--text-primary);
}
.chip.c-red {
  background: var(--danger-soft);
  border-color: transparent;
  color: var(--danger);
}
.chip.c-green {
  background: var(--success-soft);
  border-color: transparent;
  color: var(--success);
}
.chip.c-amber {
  background: var(--warning-soft);
  border-color: transparent;
  color: var(--warning);
}
.chip.struck { text-decoration: line-through; }

/* 3 Ranked picks */
.picks {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
  gap: var(--sp-3);
  align-items: start;
}
.pick {
  background: var(--surface-1);
  border: var(--hairline) solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.pick.in-cart {
  border-color: var(--text-primary);
  box-shadow: 0 0 0 1px var(--text-primary);
}
.pick .thumb {
  width: 100%;
  max-height: 148px;
  object-fit: cover;
  display: block;
  border-bottom: var(--hairline) solid var(--border);
}
.pick-head { padding: var(--sp-3); }
.pick-rank {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  margin-bottom: 4px;
}
.rank {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
}
.tag-cart {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 20px;
  padding: 0 7px;
  border-radius: 999px;
  background: var(--warning-soft);
  color: var(--warning);
  font-size: 12px;
  font-weight: 600;
}
.tag-cart.placed {
  background: var(--success-soft);
  color: var(--success);
}
.pick h3 {
  margin: 0;
  font-size: 14px;
  line-height: 19px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.pick .ja {
  margin: 2px 0 0;
  font-size: 12px;
  line-height: 16px;
  color: var(--text-secondary);
}
.pick .chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: var(--sp-2);
}

/* Landed cost block */
.total {
  padding: var(--sp-2) var(--sp-3);
  background: var(--surface-2);
  border-top: var(--hairline) solid var(--border);
  border-bottom: var(--hairline) solid var(--border);
}
.total-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-2);
}
.total-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
}
.total-sub {
  font-size: 12px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--text-secondary);
}
.total-sub .under { color: var(--success); font-weight: 600; }
.total-sub .over { color: var(--danger); font-weight: 600; }
.total-num {
  margin-top: 2px;
  font-size: 22px;
  line-height: 26px;
  font-weight: 600;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.bar {
  display: flex;
  height: 5px;
  margin-top: 6px;
  background: var(--surface-3);
  border-radius: 999px;
  overflow: hidden;
  gap: 1px;
}
.bar span { display: block; height: 100%; min-width: 2px; }
.bar-cap {
  display: flex;
  justify-content: space-between;
  margin-top: 3px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-tertiary);
  font-variant-numeric: tabular-nums;
}
.s0 { background: var(--seg-0); }
.s1 { background: var(--seg-1); }
.s2 { background: var(--seg-2); }
.s3 { background: var(--seg-3); }
.s4 { background: var(--seg-4); }
.s5 { background: var(--seg-5); }

/* Cost breakdown lines */
.lines {
  list-style: none;
  margin: 0;
  padding: 4px var(--sp-3);
}
.line {
  display: grid;
  grid-template-columns: 7px 1fr auto;
  column-gap: 6px;
  align-items: baseline;
  padding: 5px 0;
  border-bottom: var(--hairline) solid var(--border);
}
.line:last-child { border-bottom: 0; }
.line .dot {
  width: 7px;
  height: 7px;
  border-radius: 2px;
  align-self: center;
}
.line .label {
  font-size: 12px;
  font-weight: 500;
  text-transform: capitalize;
}
.line .label small {
  margin-left: 4px;
  font-weight: 400;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-tertiary);
  text-transform: none;
}
.line .amt {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.line .cite {
  grid-column: 2 / 4;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  margin-top: 1px;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 15px;
  color: var(--text-tertiary);
  overflow-wrap: anywhere;
}
.cite a { color: var(--text-secondary); }
.asof {
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 0 5px;
  border-radius: 4px;
  background: var(--surface-2);
  color: var(--text-secondary);
  white-space: nowrap;
}
.asof.warn {
  background: var(--warning-soft);
  color: var(--warning);
}
.fx {
  padding: 0 var(--sp-3) 6px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-tertiary);
}
.why {
  margin: 0;
  padding: 7px var(--sp-3);
  background: var(--surface-2);
  border-top: var(--hairline) solid var(--border);
  font-size: 12px;
  line-height: 17px;
  color: var(--text-secondary);
}
.why b {
  color: var(--text-primary);
  font-weight: 600;
  margin-right: 6px;
}
.pick-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  padding: 7px var(--sp-3);
  border-top: var(--hairline) solid var(--border);
  margin-top: auto;
}
.ext-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 500;
}

.none-found {
  grid-column: 1 / -1;
  background: var(--surface-1);
  border: var(--hairline) dashed var(--border-strong);
  border-radius: var(--radius-md);
  padding: var(--sp-6);
  text-align: center;
  color: var(--text-secondary);
}
.none-found strong {
  display: block;
  margin-bottom: 4px;
  font-size: 14px;
  color: var(--text-primary);
}

.skipped {
  margin-top: var(--sp-3);
  background: var(--surface-1);
  border: var(--hairline) solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--sp-3) var(--sp-4);
}
.skipped h3 {
  margin: 0 0 var(--sp-2);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
}
.skipped ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2) var(--sp-4);
}
.skipped li {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-secondary);
}
.skipped code {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-primary);
}

/* 4 Approval gate */
.gate {
  position: sticky;
  bottom: var(--sp-4);
  z-index: 5;
  border-radius: var(--radius-md);
  border: var(--hairline) solid var(--border-strong);
  background: var(--surface-1);
  box-shadow: var(--shadow-popup);
  overflow: hidden;
}
.gate-body {
  display: grid;
  grid-template-columns: auto minmax(180px, 1.4fr) auto auto;
  gap: var(--sp-3);
  align-items: center;
  padding: var(--sp-3);
}
.gate-state {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.gate-icon {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-sm);
  display: grid;
  place-items: center;
  flex: none;
  background: var(--surface-2);
  color: var(--text-primary);
}
.gate-kicker {
  font-size: 13px;
  line-height: 18px;
  font-weight: 600;
}
.gate-note {
  font-size: 12px;
  line-height: 16px;
  color: var(--text-secondary);
}
.gate-item { min-width: 0; }
.gate-item .t {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
}
.gate-item .d {
  margin-top: 2px;
  font-size: 12px;
  color: var(--text-secondary);
  overflow-wrap: anywhere;
}
.gate-item .tok {
  margin-top: 2px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-tertiary);
}
.gate-item .ev {
  margin-top: 2px;
  font-size: 12px;
  font-weight: 600;
  color: var(--danger);
}
.gate-total { text-align: right; }
.gate-total .k {
  font-size: 12px;
  color: var(--text-tertiary);
}
.gate-total .v {
  font-size: 20px;
  line-height: 24px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.gate-actions {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.gate.awaiting {
  border-color: var(--warning);
  border-left: 3px solid var(--warning);
}
.gate.awaiting .gate-icon {
  background: var(--warning-soft);
  color: var(--warning);
}
.gate.awaiting .gate-kicker { color: var(--warning); }

.gate.placed {
  position: static;
  box-shadow: none;
  border-color: var(--success);
  border-left: 3px solid var(--success);
}
.gate.placed .gate-icon {
  background: var(--success-soft);
  color: var(--success);
}
.gate.placed .gate-kicker { color: var(--success); }

.gate.stopped {
  position: static;
  box-shadow: none;
  border-color: var(--danger);
  border-left: 3px solid var(--danger);
}
.gate.stopped .gate-icon {
  background: var(--danger-soft);
  color: var(--danger);
}
.gate.stopped .gate-kicker { color: var(--danger); }

.gate.idle {
  position: static;
  box-shadow: none;
  border-style: dashed;
  border-color: var(--border);
}
.gate.idle .gate-kicker { color: var(--text-secondary); }

/* 5 Reasoning trail */
.trail {
  list-style: none;
  margin: 0;
  padding: 0;
  background: var(--surface-1);
  border: var(--hairline) solid var(--border);
  border-radius: var(--radius-md);
  counter-reset: t;
}
.trail li {
  counter-increment: t;
  display: grid;
  grid-template-columns: 24px 68px 1fr;
  gap: var(--sp-2);
  align-items: baseline;
  padding: 6px var(--sp-3);
  border-bottom: var(--hairline) solid var(--border);
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 16px;
  overflow-wrap: anywhere;
}
.trail li:last-child { border-bottom: 0; }
.trail li::before {
  content: counter(t);
  color: var(--text-tertiary);
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.trail .k {
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  text-align: center;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--surface-2);
  color: var(--text-secondary);
}
.trail .k-skip, .trail .k-refused, .trail .k-reject { background: var(--danger-soft); color: var(--danger); }
.trail .k-pick { background: var(--surface-3); color: var(--text-primary); font-weight: 600; }
.trail .k-cart { background: var(--warning-soft); color: var(--warning); }
.trail .k-approved, .trail .k-memory { background: var(--success-soft); color: var(--success); }

.foot {
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 var(--sp-6) var(--sp-7);
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 18px;
  color: var(--text-tertiary);
}

@media (max-width: 960px) {
  .request { grid-template-columns: 1fr 1fr; }
  .f-query { grid-column: 1 / -1; }
  .request .btn { grid-column: 1 / -1; }
  .gate-body { grid-template-columns: 1fr auto; }
  .gate-actions { grid-column: 1 / -1; flex-direction: row; }
  .gate-actions .btn { flex: 1; }
}
@media (max-width: 640px) {
  .top-inner, main, .foot { padding-left: var(--sp-4); padding-right: var(--sp-4); }
  .picks, .sk-grid { grid-template-columns: 1fr; }
  .gate-body { grid-template-columns: 1fr; gap: var(--sp-3); }
  .gate-total { text-align: left; }
  .gate-actions { flex-direction: column; }
  .trail li { grid-template-columns: 24px 1fr; }
  .trail .k { grid-column: 2; justify-self: start; }
  .trail .txt { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 120ms !important;
    transform: none !important;
  }
}

  function requestBody() {
    var r = state.result.request;
    return { query: r.query, budget: r.max_total_usd, ship_to: r.ship_to, user_id: r.user_id, condition_min: r.condition_min };
  }

  /* ---------- actions ---------- */

  function runSearch(ev) {
    if (ev) ev.preventDefault();
    if (state.busy) return;
    showError("");
    var body = {
      query: $("query").value, budget: $("budget").value, ship_to: $("ship_to").value,
      condition_min: $("condition_min").value || null
    };
    setBusy(true);
    api("/api/run", body).then(show, function (e) { showError(e.message); }).then(function () { setBusy(false); });
  }

  function rejectSeller(seller) {
    if (state.busy || !state.result) return;
    showError("");
    var body = requestBody();
    body.seller = seller;
    setBusy(true, "Updating\u2026");
    api("/api/reject", body).then(show, function (e) { showError(e.message); }).then(function () { setBusy(false); });
  }

  function approve(btn) {
    var token = state.cart && state.cart.approval_token;
    if (!token || state.busy) return;
    showError("");
    btn.disabled = true;
    btn.textContent = "Placing\u2026";
    api("/api/approve", { token: token }).then(function (r) {
      state.usedToken = token;
      r.cart.listing_id = r.cart.listing_id || state.cart.listing_id;
      state.cart = r.cart;
      state.result.trail = state.result.trail.concat(r.trail || []);
      renderAll();
    }, function (e) {
      showError(e.message);
      btn.disabled = false;
      clear(btn);
      append(btn, [icon("check", 14), "Approve and place order"]);
    });
  }

  function replayToken(btn) {
    if (!state.usedToken) return;
    btn.disabled = true;
    api("/api/approve", { token: state.usedToken }).then(function (r) {
      state.gateEvent = "Replay of used token: " + r.cart.status + (r.cart.detail ? " (" + r.cart.detail + ")" : "");
      state.result.trail = state.result.trail.concat(r.trail || []);
      if (r.cart.status === "placed") state.cart = r.cart;
      renderAll();
    }, function (e) { showError(e.message); btn.disabled = false; });
  }

  function show(result) {
    state.result = result;
    state.cart = result.cart;
    state.usedToken = null;
    state.gateEvent = null;
    $("empty").hidden = true;
    $("skeleton").hidden = true;
    $("results").hidden = false;
    renderAll();
    renderMeta(result.meta);
  }

  /* ---------- render ---------- */

  function renderAll() {
    renderPrefs();
    renderPicks();
    renderGate();
    renderTrail();
  }

  function chip(text, cls) { return h("span", { class: "chip" + (cls ? " " + cls : "") }, text); }

  function renderPrefs() {
    var p = state.result.preferences, box = clear($("prefs"));
    var sizes = Object.keys(p.sizes || {});
    var groups = [
      ["Condition", p.condition_min ? [chip(CONDITION[p.condition_min] || p.condition_min, "c-ink")] : []],
      ["Sizes", sizes.map(function (k) { return chip(k + " " + p.sizes[k], "c-ink"); })],
      ["Rejected", (p.rejected_sellers || []).map(function (s) { return chip(s, "c-red struck"); })],
      ["Purchased", (p.past_purchases || []).map(function (s) { return chip(s, "c-green"); })],
      ["Notes", (p.notes || []).map(function (s) { return chip(s); })]
    ];
    var known = groups.some(function (g) { return g[1].length; });
    if (!known) {
      box.appendChild(h("span", { class: "prefs-empty" },
        "No saved preferences for ", h("strong", null, p.user_id), "."));
      return;
    }
    box.appendChild(h("dl", { class: "pref" }, h("dt", null, "User"), h("dd", null, p.user_id)));
    groups.forEach(function (g) {
      if (!g[1].length) return;
      box.appendChild(h("dl", { class: "pref" }, h("dt", null, g[0]), h("dd", null, g[1])));
    });
  }

  function citeNode(c) {
    c = c || {};
    var url = c.url && safeUrl(c.url);
    var dated = /^\d{4}-\d{2}-\d{2}$/.test(c.as_of || "");
    var src = c.source || "no source";
    return h("div", { class: "cite" },
      url ? h("a", { href: url, target: "_blank", rel: "noopener noreferrer", class: "src" }, src) : h("span", { class: "src" }, src),
      h("span", { class: "asof" + (dated ? "" : " warn"), title: dated ? "Rule date" : "Undated value" },
        c.as_of || "undated"));
  }

  function pickCard(pick, i, inCart) {
    var l = pick.listing, cost = pick.cost, req = state.result.request;
    var total = totalOf(cost), budget = req.max_total_usd, room = budget - total;
    var scale = Math.max(budget, total) || 1;
    var placed = inCart && state.cart && state.cart.status === "placed";
    var url = safeUrl(l.url);
    var photo = (l.photos || []).map(safeUrl).filter(Boolean)[0];

    var bar = h("div", { class: "bar", role: "img", "aria-label": usd(total) + " of " + usd0(budget) + " budget" });
    var lines = h("ul", { class: "lines" });
    cost.lines.forEach(function (line, n) {
      var seg = h("span", { class: "s" + (n % 6), title: line.label + " " + usd(line.amount_usd) });
      seg.style.width = (Math.max(line.amount_usd, 0) / scale * 100) + "%";
      bar.appendChild(seg);
      var hint = /item/i.test(line.label) && l.price_jpy ? h("small", null, yen(l.price_jpy)) : null;
      lines.appendChild(h("li", { class: "line" },
        h("span", { class: "dot s" + (n % 6) }),
        h("span", { class: "label" }, line.label, hint),
        h("span", { class: "amt" }, usd(line.amount_usd)),
        citeNode(line.citation)));
    });

    var chips = [
      chip(CONDITION[l.condition] || l.condition, "c-ink"),
      chip(SOURCE[l.source] || l.source),
      chip(l.seller),
      chip(l.ships_abroad ? "Ships abroad" : "Via proxy", l.ships_abroad ? "c-green" : "c-amber")
    ];
    var buyeeUrl = null;
    Object.keys(l.fields || {}).forEach(function (k) {
      var val = l.fields[k];
      if (k === "buyee_url") { buyeeUrl = safeUrl(String(val || "")); return; }
      if (/^https?:\/\//i.test(String(val || ""))) return;
      chips.push(chip(k.replace(/_/g, " ") + ": " + val));
    });

    var img = null;
    if (photo) {
      img = h("img", { class: "thumb", src: photo, alt: l.title_en, loading: "lazy", referrerpolicy: "no-referrer" });
      img.addEventListener("error", function () { img.remove(); });
    }

    return h("article", { class: "pick" + (inCart ? " in-cart" : ""), "data-listing": l.id },
      img,
      h("div", { class: "pick-head" },
        h("div", { class: "pick-rank" },
          h("span", { class: "rank" }, "#" + (i + 1)),
          inCart ? h("span", { class: "tag-cart" + (placed ? " placed" : "") },
            icon(placed ? "check-circle" : "package", 12), placed ? "Ordered" : "In cart") : null),
        h("h3", null, l.title_en),
        h("p", { class: "ja", lang: "ja" }, l.title_ja),
        h("div", { class: "chips" }, chips)),
      h("div", { class: "total" },
        h("div", { class: "total-top" },
          h("span", { class: "total-label" }, "Landed to " + req.ship_to),
          h("span", { class: "total-sub" },
            room >= 0 ? h("span", { class: "under" }, usd(room) + " under") : h("span", { class: "over" }, usd(-room) + " over"),
            " " + usd0(budget))),
        h("div", { class: "total-num" }, usd(total)),
        bar,
        h("div", { class: "bar-cap" }, h("span", null, "$0"), h("span", null, usd0(budget)))),
      lines,
      h("div", { class: "fx" }, "FX " + cost.fx_jpy_per_usd + " JPY/USD"),
      h("p", { class: "why" }, h("b", null, "Rank " + Number(pick.score).toFixed(2)), pick.reason),
      h("div", { class: "pick-actions" },
        h("div", { class: "pick-links" },
          url ? h("a", { href: url, target: "_blank", rel: "noopener noreferrer", class: "ext-link" },
            "Open listing", icon("link-external", 14)) : h("span", { class: "step-sub" }, "No listing link"),
          buyeeUrl ? h("a", { href: buyeeUrl, target: "_blank", rel: "noopener noreferrer", class: "ext-link" },
            "Buyee", icon("link-external", 14)) : null),
        h("button", { type: "button", class: "btn btn-small btn-danger", onclick: function () { rejectSeller(l.seller); } },
          icon("blocked", 14), "Reject seller")));
  }

  function renderPicks() {
    var r = state.result, box = clear($("picks"));
    var cartId = state.cart && state.cart.listing_id;
    $("picks-sub").textContent = r.picks.length
      ? r.picks.length + " within " + usd0(r.request.max_total_usd)
      : "0 matches";
    if (!r.picks.length) {
      box.appendChild(h("div", { class: "none-found" },
        h("strong", null, "No listing within " + usd0(r.request.max_total_usd)),
        "Raise the budget or lower the minimum condition."));
    }
    r.picks.forEach(function (p, i) { box.appendChild(pickCard(p, i, p.listing.id === cartId)); });

    var skipped = r.trail.map(function (t) { return /^skip (\S+): (.*)$/.exec(t); }).filter(Boolean);
    var sk = clear($("skipped"));
    sk.hidden = !skipped.length;
    if (skipped.length) {
      sk.appendChild(h("h3", null, "Filtered out (" + skipped.length + ")"));
      sk.appendChild(h("ul", null, skipped.map(function (m) {
        var budget = /budget/i.test(m[2]);
        return h("li", null, chip(budget ? "Over budget" : "Blocked", budget ? "c-amber" : "c-red"), h("code", null, m[1]), m[2]);
      })));
    }
  }

  var GATE_ICONS = { awaiting: "shield-lock", placed: "check-circle", stopped: "x-circle", idle: "inbox" };

  function gateShell(kind, kicker, note, item, total, actions) {
    var g = $("gate");
    clear(g).className = "gate " + kind;
    g.appendChild(h("div", { class: "gate-body" },
      h("div", { class: "gate-state" },
        h("div", { class: "gate-icon", "aria-hidden": "true" }, icon(GATE_ICONS[kind] || "inbox", 16)),
        h("div", null, h("div", { class: "gate-kicker" }, kicker), h("div", { class: "gate-note" }, note))),
      h("div", { class: "gate-item" }, item),
      total === null ? h("div") : h("div", { class: "gate-total" }, h("div", { class: "k" }, "Total landed"), h("div", { class: "v" }, usd(total))),
      h("div", { class: "gate-actions" }, actions)));
  }

  function renderGate() {
    var r = state.result, cart = state.cart;
    if (!cart) {
      gateShell("idle", "No cart created", "No listing fit within budget.", null, null, null);
      return;
    }
    var pick = r.picks.filter(function (p) { return p.listing.id === cart.listing_id; })[0] || null;
    var total = pick ? totalOf(pick.cost) : null;
    var item = [
      pick ? h("div", { class: "t" }, pick.listing.title_en) : null,
      cart.detail ? h("div", { class: "d" }, cart.detail) : null
    ];
    var cartUrl = cart.cart_url && safeUrl(cart.cart_url);
    if (cartUrl) {
      item.push(h("div", { class: "d" },
        h("a", { href: cartUrl, target: "_blank", rel: "noopener noreferrer", class: "ext-link" },
          "Open filled cart", icon("link-external", 12))));
    }

    if (cart.status === "awaiting_approval") {
      var copyBtn = h("button", {
        type: "button", class: "btn btn-ghost btn-copy", "aria-label": "Copy approval token",
        onclick: function () {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(cart.approval_token).then(function () {
              clear(copyBtn); append(copyBtn, [icon("check", 12), "Copied"]);
              setTimeout(function () { clear(copyBtn); append(copyBtn, [icon("copy", 12), "Copy"]); }, 1400);
            }).catch(function () {});
          }
        }
      }, icon("copy", 12), "Copy");
      item.push(h("div", { class: "tok-row" }, h("span", { class: "tok" }, "token " + cart.approval_token), copyBtn));
      gateShell("awaiting", "Awaiting approval", "Cart filled. Nothing paid.", item, total, [
        h("button", { type: "button", class: "btn btn-primary", id: "approve", onclick: function (e) { approve(e.currentTarget); } },
          icon("check", 14), "Approve and place order"),
        pick ? h("button", { type: "button", class: "btn btn-small btn-danger", id: "reject", onclick: function () { rejectSeller(pick.listing.seller); } },
          icon("blocked", 14), "Reject " + pick.listing.seller) : null
      ]);
    } else if (cart.status === "placed") {
      item.push(h("div", { class: "tok" }, "token consumed (single-use)"));
      if (state.gateEvent) item.push(h("div", { class: "ev" }, state.gateEvent));
      gateShell("placed", "Order placed", "Approved. Token cannot be reused.", item, total, [
        state.usedToken ? h("button", { type: "button", class: "btn btn-small", id: "replay", onclick: function (e) { replayToken(e.currentTarget); } },
          icon("sync", 14), "Test token replay") : null
      ]);
    } else {
      gateShell("stopped", cart.status === "failed" ? "Checkout failed" : "Blocked", "Nothing paid.", item, total, null);
    }
  }

  var KINDS = [
    [/^recalled /, "recall"], [/^found /, "search"], [/^skip /, "skip"], [/^pick /, "pick"], [/^cart /, "cart"],
    [/^no candidate/, "cart"], [/^rejected seller/, "reject"], [/^approval accepted/, "approved"],
    [/^approval refused/, "refused"], [/^(remembered|could not remember)/, "memory"]
  ];
  function renderTrail() {
    var box = clear($("trail"));
    state.result.trail.forEach(function (t) {
      var kind = "step";
      for (var i = 0; i < KINDS.length; i++) if (KINDS[i][0].test(t)) { kind = KINDS[i][1]; break; }
      box.appendChild(h("li", null, h("span", { class: "k k-" + kind }, kind), h("span", { class: "txt" }, t)));
    });
  }

  function renderMeta(meta) {
    if (!meta) return;
    var m = clear($("mode"));
    m.hidden = false;
    m.className = "mode" + (meta.live ? " live" : "");
    append(m, [icon(meta.live ? "globe" : "shield-check", 14), meta.live ? "Live" : "Offline dry run"]);
    var w = meta.wiring || {};
    $("foot").textContent = Object.keys(w).map(function (k) { return k + "=" + w[k]; }).join(" · ") +
      (meta.live ? "" : " · offline dry run");
  }

  /* ---------- theme & keyboard ---------- */

  function currentTheme() {
    var saved = null;
    try { saved = localStorage.getItem("jsa-theme"); } catch (e) {}
    if (saved === "light" || saved === "dark") return saved;
    return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    var btn = $("theme-toggle");
    if (btn) {
      clear(btn);
      btn.appendChild(icon(theme === "dark" ? "sun" : "moon", 16));
      btn.setAttribute("title", theme === "dark" ? "Switch to light theme" : "Switch to dark theme");
    }
  }
  applyTheme(currentTheme());
  var themeBtn = $("theme-toggle");
  if (themeBtn) {
    themeBtn.addEventListener("click", function () {
      var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      try { localStorage.setItem("jsa-theme", next); } catch (e) {}
      applyTheme(next);
    });
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && !e.metaKey && !e.ctrlKey && !e.altKey) {
      var tag = (document.activeElement && document.activeElement.tagName) || "";
      if (tag !== "INPUT" && tag !== "TEXTAREA" && tag !== "SELECT") {
        e.preventDefault();
        $("query").focus();
        $("query").select();
      }
    }
  });

  /* ---------- boot ---------- */

  $("form").addEventListener("submit", runSearch);
  document.querySelectorAll(".example-chip").forEach(function (btn) {
    btn.addEventListener("click", function () {
      $("query").value = btn.getAttribute("data-q") || "";
      $("budget").value = btn.getAttribute("data-budget") || "900";
      runSearch();
    });
  });

  var qs = new URLSearchParams(location.search);
  if (qs.get("q")) $("query").value = qs.get("q");
  if (qs.get("budget")) $("budget").value = qs.get("budget");
  if (qs.get("ship_to")) $("ship_to").value = qs.get("ship_to");
  if (qs.get("cond")) $("condition_min").value = qs.get("cond");
  fetch("/api/meta").then(function (r) { return r.json(); }).then(function (meta) {
    renderMeta(meta);
    if (qs.get("run") === "1" && !meta.live) runSearch();
  }).catch(function () {});
})();

</script>
<script>window.addEventListener('DOMContentLoaded',function(){var f=document.getElementById('form');if(f)f.dispatchEvent(new Event('submit',{cancelable:true}));});</script>
</body>
</html>
