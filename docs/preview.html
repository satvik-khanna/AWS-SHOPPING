<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping Agent</title>
<style>
/* Japan Shopping Agent — minimal continuous-surface UI (no card clutter, icon-first, hamburger drawer).
   Shibubu Design Tokens + GitHub Primer Octicons v19.42.0 (MIT). Zero external assets. */

:root {
  --bg-app: #ffffff;
  --surface-1: #ffffff;
  --surface-2: #f6f7f8;
  --surface-3: #eaedf1;
  --surface-press: #dfe4ea;
  --border: #e5e8ec;
  --border-strong: #c2c9d2;
  --text-primary: #202731;
  --text-secondary: #515d6b;
  --text-tertiary: #6c7682;

  --ink-fill: #202731;
  --ink-fill-hover: #323b47;
  --on-ink: #ffffff;

  --danger: #ab271e;
  --danger-soft: #fdecea;
  --warning: #8a5700;
  --warning-soft: #fdf3dc;
  --success: #17633a;
  --success-soft: #e6f4ec;
  --focus-ring: #202731;
  --scrim: rgba(17, 21, 27, 0.36);

  --seg-0: #202731; --seg-1: #515d6b; --seg-2: #8a5700;
  --seg-3: #17633a; --seg-4: #8c959f; --seg-5: #b9c1cb;

  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --hairline: 1px;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  --ease-out: cubic-bezier(0.33, 1, 0.68, 1);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-app: #11151b; --surface-1: #11151b; --surface-2: #191e25; --surface-3: #232a33; --surface-press: #2c3540;
    --border: #2a313c; --border-strong: #444f5e;
    --text-primary: #f1f5f9; --text-secondary: #b8c2ce; --text-tertiary: #8c97a6;
    --ink-fill: #f1f5f9; --ink-fill-hover: #dce4ee; --on-ink: #11151b;
    --danger: #ff9d94; --danger-soft: #3a1f21;
    --warning: #e7bd70; --warning-soft: #352915;
    --success: #7ddaa5; --success-soft: #173024;
    --focus-ring: #f1f5f9; --scrim: rgba(0, 0, 0, 0.55);
    --seg-0: #e2e8f0; --seg-1: #94a3b8; --seg-2: #e7bd70; --seg-3: #7ddaa5; --seg-4: #64748b; --seg-5: #475569;
  }
}
:root[data-theme="dark"] {
  --bg-app: #11151b; --surface-1: #11151b; --surface-2: #191e25; --surface-3: #232a33; --surface-press: #2c3540;
  --border: #2a313c; --border-strong: #444f5e;
  --text-primary: #f1f5f9; --text-secondary: #b8c2ce; --text-tertiary: #8c97a6;
  --ink-fill: #f1f5f9; --ink-fill-hover: #dce4ee; --on-ink: #11151b;
  --danger: #ff9d94; --danger-soft: #3a1f21;
  --warning: #e7bd70; --warning-soft: #352915;
  --success: #7ddaa5; --success-soft: #173024;
  --focus-ring: #f1f5f9; --scrim: rgba(0, 0, 0, 0.55);
  --seg-0: #e2e8f0; --seg-1: #94a3b8; --seg-2: #e7bd70; --seg-3: #7ddaa5; --seg-4: #64748b; --seg-5: #475569;
}

*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg-app); color-scheme: light dark; }
body {
  margin: 0; color: var(--text-primary); font-family: var(--font-sans);
  font-size: 13px; line-height: 18px; -webkit-font-smoothing: antialiased;
  min-height: 100vh; display: flex; flex-direction: column;
}
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.octicon { display: inline-block; vertical-align: text-bottom; fill: currentColor; flex: none; }

/* Header (44px) */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg-app); border-bottom: var(--hairline) solid var(--border); }
.top-inner { max-width: 720px; margin: 0 auto; height: 44px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand { display: flex; align-items: center; gap: 6px; }
.top h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.top-actions { display: flex; align-items: center; gap: 4px; }
.mode { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 999px; background: var(--surface-2); color: var(--text-secondary); font-size: 12px; font-weight: 500; }
.mode.live { background: var(--danger-soft); color: var(--danger); }

/* Hamburger slide-over drawer */
.scrim { position: fixed; inset: 0; z-index: 30; background: var(--scrim); animation: fadeIn 150ms var(--ease-out); }
.drawer {
  position: fixed; top: 0; left: 0; bottom: 0; width: 276px; max-width: 85vw; z-index: 40;
  background: var(--bg-app); border-right: var(--hairline) solid var(--border);
  transform: translateX(-100%); transition: transform 180ms var(--ease-out);
  display: flex; flex-direction: column; overflow-y: auto; padding: 0 12px 20px;
}
.drawer.open { transform: translateX(0); }
.drawer-head { height: 44px; display: flex; align-items: center; justify-content: space-between; font-weight: 600; border-bottom: var(--hairline) solid var(--border); }
.drawer-section { padding: 12px 0; border-bottom: var(--hairline) solid var(--border); }
.drawer-section:last-child { border-bottom: 0; }
.drawer-section h3 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--text-tertiary); display: flex; align-items: center; gap: 6px; }
.count-pill { font-family: var(--font-mono); font-size: 12px; padding: 0 5px; border-radius: 999px; background: var(--surface-2); color: var(--text-secondary); }
.jump-form { display: flex; gap: 6px; margin-bottom: 8px; }
.jump-form input { flex: 1; min-width: 0; height: 28px; padding: 0 8px; border-radius: var(--radius-sm); border: var(--hairline) solid var(--border-strong); background: var(--surface-2); color: var(--text-primary); font-size: 12px; }
.store-links, .drawer-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.drawer-item { width: 100%; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--text-secondary); font-family: var(--font-sans); font-size: 12px; cursor: pointer; text-align: left; }
.drawer-item:hover { background: var(--surface-3); color: var(--text-primary); }
.drawer-item-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drawer-item-meta { font-family: var(--font-mono); color: var(--text-tertiary); }
.drawer-empty { font-size: 12px; color: var(--text-tertiary); padding: 2px 0; }

/* Main continuous surface (no nested card boxes) */
.chat-shell { width: 100%; max-width: 720px; margin: 0 auto; padding: 12px 12px 0; flex: 1; display: flex; flex-direction: column; }
.thread { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-bottom: 16px; }
.msg-user { display: flex; justify-content: flex-end; animation: bubbleIn 200ms var(--ease-out); }
.bubble { padding: 6px 10px; border-radius: var(--radius-lg); border-bottom-right-radius: 4px; background: var(--surface-3); font-size: 13px; font-weight: 500; }
.msg-agent { display: flex; flex-direction: column; gap: 10px; animation: enter 200ms var(--ease-out); }

.results-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.agent-lead { font-size: 12px; font-weight: 600; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.quick-filter { width: 140px; height: 26px; padding: 0 8px; border-radius: var(--radius-sm); border: var(--hairline) solid var(--border); background: var(--surface-2); color: var(--text-primary); font-size: 12px; }

/* Flat hairline product rows */
.picks { display: flex; flex-direction: column; border-top: var(--hairline) solid var(--border); }
.pick-row {
  display: grid; grid-template-columns: 24px 1fr auto auto; align-items: center; gap: 8px;
  padding: 8px 6px; border-bottom: var(--hairline) solid var(--border); cursor: pointer;
  animation: rowIn 200ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 35ms);
  transition: background 100ms var(--ease-out), transform 100ms var(--ease-out);
}
.pick-row:hover { background: var(--surface-2); }
.pick-row.selected { background: var(--surface-2); box-shadow: inset 2px 0 0 var(--text-primary); }
.rank { font-family: var(--font-mono); font-size: 12px; color: var(--text-tertiary); }
.row-main { min-width: 0; }
.row-title { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-title > span:first-child { overflow: hidden; text-overflow: ellipsis; }
.row-meta { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 12px; color: var(--text-tertiary); }
.row-price { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row-actions { display: inline-flex; align-items: center; gap: 2px; }
.tag-cart { display: inline-flex; align-items: center; color: var(--warning); }
.tag-cart.placed { color: var(--success); }

/* Flat hairline landed-cost breakdown */
.cost-panel { padding-top: 6px; animation: enter 180ms var(--ease-out); }
.cost-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-bottom: 6px; border-bottom: var(--hairline) solid var(--border); }
.cost-title { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.cost-sub { font-size: 12px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; margin-left: auto; }
.cost-sub .under { color: var(--success); font-weight: 600; }
.cost-sub .over { color: var(--danger); font-weight: 600; }
.cost-total-num { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.lines { list-style: none; margin: 0; padding: 0; }
.line {
  display: grid; grid-template-columns: 6px 1fr auto auto; align-items: center; gap: 8px;
  padding: 5px 0; border-bottom: var(--hairline) solid var(--border);
  animation: rowIn 180ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 24ms);
}
.line:last-child { border-bottom: 0; }
.line .dot { width: 6px; height: 6px; border-radius: 2px; }
.line .label { font-size: 12px; text-transform: capitalize; }
.line .label small { margin-left: 4px; font-family: var(--font-mono); color: var(--text-tertiary); text-transform: none; }
.line .amt { font-family: var(--font-mono); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.asof { font-family: var(--font-mono); font-size: 12px; color: var(--text-tertiary); }
.asof:hover { color: var(--text-primary); }
.s0 { background: var(--seg-0); } .s1 { background: var(--seg-1); } .s2 { background: var(--seg-2); }
.s3 { background: var(--seg-3); } .s4 { background: var(--seg-4); } .s5 { background: var(--seg-5); }

/* Slim approval strip */
.gate { border-top: var(--hairline) solid var(--border); border-bottom: var(--hairline) solid var(--border); padding: 8px 0; transition: border-color 200ms var(--ease-out); }
.gate-body { display: flex; align-items: center; gap: 8px; }
.gate-icon { width: 26px; height: 26px; border-radius: var(--radius-sm); display: grid; place-items: center; flex: none; background: var(--surface-2); }
.gate-item { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gate-kicker { font-size: 13px; font-weight: 600; }
.gate-sub { font-size: 12px; color: var(--text-secondary); }
.gate-item .ev { font-size: 12px; color: var(--danger); }
.gate-actions { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.gate.awaiting .gate-icon { background: var(--warning-soft); color: var(--warning); }
.gate.awaiting .gate-kicker { color: var(--warning); }
.gate.placed .gate-icon { background: var(--success-soft); color: var(--success); animation: popIn 260ms var(--ease-out); }
.gate.placed .gate-kicker { color: var(--success); }
.gate.stopped .gate-icon { background: var(--danger-soft); color: var(--danger); }

.skipped { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 12px; color: var(--text-tertiary); }
.none-found { padding: 16px 0; text-align: center; color: var(--text-tertiary); }

/* Chips, prefs, trail */
.chip { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 999px; background: var(--surface-2); color: var(--text-secondary); font-size: 12px; }
.chip.c-ink { background: var(--surface-3); color: var(--text-primary); }
.chip.c-red { background: var(--danger-soft); color: var(--danger); }
.chip.c-green { background: var(--success-soft); color: var(--success); }
.chip.c-amber { background: var(--warning-soft); color: var(--warning); }
.chip.struck { text-decoration: line-through; }
.prefs { display: flex; flex-direction: column; gap: 6px; }
.pref { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 0; }
.pref dt { font-size: 12px; color: var(--text-tertiary); }
.pref dd { margin: 0; display: flex; flex-wrap: wrap; gap: 4px; }
.trail { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.trail li { display: grid; grid-template-columns: 54px 1fr; gap: 6px; font-family: var(--font-mono); font-size: 12px; line-height: 15px; overflow-wrap: anywhere; }
.trail .k { font-family: var(--font-sans); text-align: center; padding: 1px 4px; border-radius: 4px; background: var(--surface-2); color: var(--text-secondary); }
.trail .k-skip, .trail .k-refused, .trail .k-reject { background: var(--danger-soft); color: var(--danger); }
.trail .k-cart { background: var(--warning-soft); color: var(--warning); }
.trail .k-approved, .trail .k-memory { background: var(--success-soft); color: var(--success); }

/* Buttons (Shibubu §5: borderless ghost, compact 28px) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: var(--radius-sm); border: 0; background: var(--surface-2); color: var(--text-primary); font-family: var(--font-sans); font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background 100ms var(--ease-out), transform 100ms var(--ease-out); }
.btn:hover:not(:disabled) { background: var(--surface-3); transform: scale(1.02); }
.btn:active:not(:disabled) { background: var(--surface-press); transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--ink-fill); color: var(--on-ink); font-weight: 600; }
.btn-primary:hover:not(:disabled) { background: var(--ink-fill-hover); }
.btn-ghost { background: transparent; color: var(--text-secondary); }
.btn-ghost:hover:not(:disabled) { background: var(--surface-3); color: var(--text-primary); }
.btn-icon { width: 28px; height: 28px; padding: 0; }
.btn-small { height: 24px; padding: 0 8px; }
.btn-danger { color: var(--danger); }
.btn-danger:hover:not(:disabled) { background: var(--danger-soft); color: var(--danger); }

/* Empty & Skeleton */
.empty { margin: auto 0; padding: 48px 0; text-align: center; }
.examples { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.example-chip { height: 28px; padding: 0 10px; border-radius: 999px; border: var(--hairline) solid var(--border); background: transparent; color: var(--text-secondary); font-family: var(--font-sans); font-size: 12px; cursor: pointer; transition: background 100ms var(--ease-out); }
.example-chip:hover { background: var(--surface-2); color: var(--text-primary); }

.skeleton { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; }
.sk-row, .sk-block {
  border-radius: var(--radius-sm);
  background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%);
  background-size: 200% 100%; animation: shimmer 1.1s ease-in-out infinite;
}
.sk-row { height: 46px; }
.sk-block { height: 110px; margin-top: 6px; }

/* Bottom single-line composer */
.composer-wrap { position: sticky; bottom: 0; padding: 8px 0 12px; background: var(--bg-app); }
.error { margin: 0 0 6px; padding: 6px 10px; border-radius: var(--radius-sm); background: var(--danger-soft); color: var(--danger); font-size: 12px; }
.composer { border: var(--hairline) solid var(--border-strong); border-radius: var(--radius-lg); padding: 4px 6px 4px 10px; background: var(--bg-app); }
.composer-row { display: flex; align-items: center; gap: 6px; }
.composer-row > input { flex: 1; min-width: 0; height: 30px; border: 0; background: transparent; color: var(--text-primary); font-family: var(--font-sans); font-size: 13px; }
.composer-row > input:focus { outline: none; }
.ctrl { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; color: var(--text-tertiary); }
.ctrl input, .ctrl select { height: 24px; padding: 0 5px; border-radius: 4px; border: 0; background: var(--surface-2); color: var(--text-primary); font-family: var(--font-sans); font-size: 12px; }
.ctrl input[type="number"] { width: 54px; font-variant-numeric: tabular-nums; }
.ctrl input[type="text"] { width: 54px; }

.toast { position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%); padding: 6px 12px; border-radius: 999px; background: var(--ink-fill); color: var(--on-ink); font-size: 12px; font-weight: 500; z-index: 50; animation: bubbleIn 160ms var(--ease-out); }

@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes bubbleIn { from { opacity: 0; transform: translateY(6px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes rowIn { from { opacity: 0; transform: translateX(-5px); } to { opacity: 1; transform: translateX(0); } }
@keyframes popIn { 0% { transform: scale(0.75); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }

@media (max-width: 600px) {
  .pick-row { grid-template-columns: 20px 1fr auto; }
  .row-actions { grid-column: 2 / 4; justify-content: flex-end; }
  .composer-row { flex-wrap: wrap; }
  .composer-row > input { flex: 1 0 100%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 100ms !important; transform: none !important; }
}

</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <button type="button" id="menu-open" class="btn btn-ghost btn-icon" aria-label="Menu" aria-expanded="false" title="Menu">
        <svg class="octicon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path d="M1 2.75A.75.75 0 0 1 1.75 2h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 2.75Zm0 5A.75.75 0 0 1 1.75 7h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 7.75ZM1.75 12h12.5a.75.75 0 0 1 0 1.5H1.75a.75.75 0 0 1 0-1.5Z"></path>
        </svg>
      </button>
      <h1>Shopping Agent</h1>
    </div>
    <div class="top-actions">
      <button type="button" id="search-focus" class="btn btn-ghost btn-icon" aria-label="Search" title="Search (/)">
        <svg class="octicon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"></path>
        </svg>
      </button>
      <button type="button" id="share-link" class="btn btn-ghost btn-icon" aria-label="Copy link" title="Copy deep link">
        <svg class="octicon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path d="m7.775 3.275 1.25-1.25a3.5 3.5 0 1 1 4.95 4.95l-2.5 2.5a3.5 3.5 0 0 1-4.95 0 .751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018 1.998 1.998 0 0 0 2.83 0l2.5-2.5a2.002 2.002 0 0 0-2.83-2.83l-1.25 1.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042Zm-4.69 9.64a1.998 1.998 0 0 0 2.83 0l1.25-1.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042l-1.25 1.25a3.5 3.5 0 1 1-4.95-4.95l2.5-2.5a3.5 3.5 0 0 1 4.95 0 .751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018 1.998 1.998 0 0 0-2.83 0l-2.5 2.5a1.998 1.998 0 0 0 0 2.83Z"></path>
        </svg>
      </button>
      <div class="mode" id="mode" hidden></div>
      <button type="button" id="theme-toggle" class="btn btn-ghost btn-icon" aria-label="Theme" title="Toggle theme"></button>
    </div>
  </div>
</header>

<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" aria-hidden="true" aria-label="Navigation menu">
  <div class="drawer-head">
    <span>Menu</span>

    var filtered = r.picks.map(function (p, i) { return { pick: p, idx: i }; }).filter(function (x) {
      if (!filterText) return true;
      var l = x.pick.listing;
      return (l.title_en + " " + l.title_ja + " " + l.seller + " " + l.source).toLowerCase().indexOf(filterText) !== -1;
    });

    ui.$("picks-sub").textContent = filtered.length
      ? filtered.length + " / " + ui.usd0(r.request.max_total_usd)
      : "0 matches";

    if (!filtered.length) {
      box.appendChild(ui.h("div", { class: "none-found" }, "No matches"));
    }

    filtered.forEach(function (entry, pos) {
      var p = entry.pick, i = entry.idx, l = p.listing, total = ui.totalOf(p.cost);
      var inCart = l.id === cartId;
      var placed = inCart && state.cart && state.cart.status === "placed";
      var url = ui.safeUrl(l.url);
      var buyeeUrl = l.fields && l.fields.buyee_url ? ui.safeUrl(String(l.fields.buyee_url)) : null;

      var actions = ui.h("div", { class: "row-actions" },
        url ? ui.h("a", {
          href: url, target: "_blank", rel: "noopener noreferrer",
          class: "btn btn-ghost btn-icon", title: "Open listing", "aria-label": "Open listing",
          onclick: function (e) { e.stopPropagation(); }
        }, ui.icon("link-external", 14)) : null,
        buyeeUrl ? ui.h("a", {
          href: buyeeUrl, target: "_blank", rel: "noopener noreferrer",
          class: "btn btn-ghost btn-icon", title: "Open on Buyee", "aria-label": "Open on Buyee",
          onclick: function (e) { e.stopPropagation(); }
        }, ui.icon("package", 14)) : null,
        ui.h("button", {
          type: "button", class: "btn btn-ghost btn-icon", title: "Copy item link", "aria-label": "Copy item link",
          onclick: function (e) { e.stopPropagation(); handlers.onCopyItemLink(l.id); }
        }, ui.icon("link", 14)),
        ui.h("button", {
          type: "button", class: "btn btn-ghost btn-icon btn-danger", title: "Reject " + l.seller, "aria-label": "Reject seller",
          onclick: function (e) { e.stopPropagation(); handlers.onReject(l.seller); }
        }, ui.icon("blocked", 14))
      );

      box.appendChild(ui.h("article", {
        class: "pick-row" + (i === state.selectedIdx ? " selected" : "") + (inCart ? " in-cart" : ""),
        style: "--i:" + pos,
        "data-listing": l.id,
        tabindex: "0",
        onclick: function () { handlers.onSelect(i); }
      },
        ui.h("span", { class: "rank" }, "#" + (i + 1)),
        ui.h("div", { class: "row-main" },
          ui.h("div", { class: "row-title" },
            ui.h("span", null, l.title_en),
            inCart ? ui.h("span", { class: "tag-cart" + (placed ? " placed" : ""), title: placed ? "Ordered" : "In cart" },
              ui.icon(placed ? "check-circle" : "package", 12)) : null),
          ui.h("div", { class: "row-meta" },
            chip(CONDITION[l.condition] || l.condition, "c-ink"),
            ui.h("span", null, SOURCE[l.source] || l.source),
            ui.h("span", null, l.seller))),
        ui.h("span", { class: "row-price" }, ui.usd(total)),
        actions));
    });

    var skipped = r.trail.map(function (t) { return /^skip (\S+): (.*)$/.exec(t); }).filter(Boolean);
    var sk = ui.clear(ui.$("skipped"));
    sk.hidden = !skipped.length;
    if (skipped.length) {
      sk.appendChild(ui.h("span", { class: "skipped-label" }, skipped.length + " filtered"));
      skipped.slice(0, 4).forEach(function (m) {
        sk.appendChild(chip(m[1], /budget/i.test(m[2]) ? "c-amber" : "c-red"));
      });
    }
  }

  function renderCost(state) {
    var ui = root.JSA.ui, r = state.result, panel = ui.clear(ui.$("cost-panel"));
    var pick = r.picks[state.selectedIdx] || r.picks[0];
    if (!pick) { panel.hidden = true; return; }
    panel.hidden = false;
    var l = pick.listing, cost = pick.cost, req = r.request;
    var total = ui.totalOf(cost), room = req.max_total_usd - total;

    var lines = ui.h("ul", { class: "lines" });
    cost.lines.forEach(function (line, n) {
      var c = line.citation || {};
      var url = c.url && ui.safeUrl(c.url);
      lines.appendChild(ui.h("li", { class: "line", style: "--i:" + n },
        ui.h("span", { class: "dot s" + (n % 6) }),
        ui.h("span", { class: "label" }, line.label,
          /item/i.test(line.label) && l.price_jpy ? ui.h("small", null, ui.yen(l.price_jpy)) : null),
        url ? ui.h("a", { href: url, target: "_blank", rel: "noopener noreferrer", class: "asof", title: c.source || "" }, c.as_of || "ref")
            : ui.h("span", { class: "asof", title: c.source || "" }, c.as_of || "—"),
        ui.h("span", { class: "amt" }, ui.usd(line.amount_usd))));
    });

    var totalEl = ui.h("span", { class: "cost-total-num" }, ui.usd(total));
    panel.appendChild(ui.h("div", { class: "cost-head" },
      ui.h("span", { class: "cost-title" }, "#" + (state.selectedIdx + 1) + " Landed (" + req.ship_to + ")"),
      ui.h("span", { class: "cost-sub" },
        room >= 0 ? ui.h("span", { class: "under" }, "-" + ui.usd(room)) : ui.h("span", { class: "over" }, "+" + ui.usd(-room)),
        " · FX " + cost.fx_jpy_per_usd),
      totalEl));
    panel.appendChild(lines);
    ui.tweenUsd(totalEl, total);
  }

  function renderGate(state, handlers) {
    var ui = root.JSA.ui, r = state.result, cart = state.cart, g = ui.$("gate");
    ui.clear(g);
    if (!cart) {
      g.className = "gate idle";
      g.appendChild(ui.h("div", { class: "gate-body" }, ui.icon("inbox", 16), ui.h("span", { class: "gate-kicker" }, "No cart")));
      return;
    }
    var pick = r.picks.filter(function (p) { return p.listing.id === cart.listing_id; })[0] || null;
    var kind = cart.status === "awaiting_approval" ? "awaiting" : (cart.status === "placed" ? "placed" : "stopped");
    g.className = "gate " + kind;

    var actions = [];
    if (kind === "awaiting") {
      actions.push(ui.h("button", {
        type: "button", class: "btn btn-ghost btn-icon", title: "Copy token", "aria-label": "Copy approval token",
        onclick: function () { handlers.onCopyToken(cart.approval_token); }
      }, ui.icon("copy", 14)));
      if (pick) {
        actions.push(ui.h("button", {
          type: "button", class: "btn btn-ghost btn-icon btn-danger", id: "reject", title: "Reject " + pick.listing.seller, "aria-label": "Reject seller",
          onclick: function () { handlers.onReject(pick.listing.seller); }
        }, ui.icon("blocked", 14)));
      }
      actions.push(ui.h("button", {
        type: "button", class: "btn btn-primary", id: "approve",
        onclick: function (e) { handlers.onApprove(e.currentTarget); }
      }, ui.icon("check", 14), "Approve"));
    } else if (kind === "placed" && state.usedToken) {
      actions.push(ui.h("button", {
        type: "button", class: "btn btn-small", id: "replay", title: "Test token replay",
        onclick: function (e) { handlers.onReplay(e.currentTarget); }
      }, ui.icon("sync", 14), "Replay"));
    }

    g.appendChild(ui.h("div", { class: "gate-body" },
      ui.h("div", { class: "gate-icon", "aria-hidden": "true" }, ui.icon(GATE_ICONS[kind], 16)),
      ui.h("div", { class: "gate-item" },
        ui.h("span", { class: "gate-kicker" }, kind === "awaiting" ? "Approve order" : (kind === "placed" ? "Placed" : "Blocked")),
        pick ? ui.h("span", { class: "gate-sub" }, " · " + pick.listing.title_en) : null,
        state.gateEvent ? ui.h("div", { class: "ev" }, state.gateEvent) : null),
      ui.h("div", { class: "gate-actions" }, actions)));
  }

  root.JSA = root.JSA || {};
  root.JSA.commerce = { renderPrefs: renderPrefs, renderTrail: renderTrail, renderPicks: renderPicks, renderCost: renderCost, renderGate: renderGate };
})(window);

/* Orchestrator: wires icons, menu, search, links, and commerce modules. */
(function (root) {
  "use strict";

  var ui = root.JSA.ui;
  var state = { result: null, cart: null, usedToken: null, gateEvent: null, busy: false, selectedIdx: 0, targetItemId: "" };

  function api(path, body) {
    return fetch(path, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
        return data;
      });
    }, function () { throw new Error("Server unreachable"); });
  }

  function showError(msg) {
    var el = ui.$("error");
    el.hidden = !msg;
    el.textContent = msg || "";
  }

  function setBusy(on) {
    state.busy = on;
    ui.$("go").disabled = on;
    if (on) {
      ui.$("empty").hidden = true;
      ui.$("results").hidden = true;
      ui.$("skeleton").hidden = false;
    } else {
      ui.$("skeleton").hidden = true;
      if (state.result) ui.$("results").hidden = false;
      else ui.$("empty").hidden = false;
    }
  }

  function requestBody() {
    var r = state.result.request;
    return { query: r.query, budget: r.max_total_usd, ship_to: r.ship_to, user_id: r.user_id, condition_min: r.condition_min };
  }

  function renderAll() {
    var c = root.JSA.commerce;
    c.renderPrefs(state.result);
    c.renderTrail(state.result);
    c.renderPicks(state, searchMod.getFilter(), {
      onSelect: function (i) { state.selectedIdx = i; renderAll(); },
      onReject: rejectSeller,
      onCopyItemLink: function (listingId) {
        var r = state.result.request;
        linksMod.copyLink(linksMod.buildDeepLink({ q: r.query, budget: r.max_total_usd, ship_to: r.ship_to, cond: r.condition_min || "", item: listingId }));
      }
    });
    c.renderCost(state);
    c.renderGate(state, {
      onApprove: approve,
      onReject: rejectSeller,
      onReplay: replayToken,
      onCopyToken: function (tok) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(tok).then(function () { ui.toast("Token copied"); }).catch(function () {});
        }
      }
    });
  }

  function show(result) {
    state.result = result;
    state.cart = result.cart;
    state.usedToken = null;
    state.gateEvent = null;
    state.selectedIdx = 0;
    if (state.targetItemId && result.picks) {
      var idx = result.picks.findIndex(function (p) { return p.listing.id === state.targetItemId; });
      if (idx >= 0) state.selectedIdx = idx;
      state.targetItemId = "";
    }
    ui.$("empty").hidden = true;
    ui.$("skeleton").hidden = true;
    ui.$("results").hidden = false;
    renderAll();
    renderMeta(result.meta);
  }

  function runSearch(ev) {
    if (ev) ev.preventDefault();
    if (state.busy) return;
    showError("");
    var parsed = searchMod.parseQuery(ui.$("query").value, ui.$("budget").value);
    ui.$("budget").value = parsed.budget;
    var body = {
      query: parsed.query, budget: parsed.budget, ship_to: ui.$("ship_to").value,
      condition_min: ui.$("condition_min").value || null
    };
    searchMod.record(body.query, body.budget, body.ship_to);
    ui.$("user-turn").hidden = false;
    ui.$("user-bubble").textContent = body.query + " · $" + body.budget;
    setBusy(true);
    api("/api/run", body).then(show, function (e) { showError(e.message); }).then(function () { setBusy(false); });
  }

  function rejectSeller(seller) {
    if (state.busy || !state.result) return;
    showError("");
    var body = requestBody();
    body.seller = seller;
    setBusy(true);
    api("/api/reject", body).then(show, function (e) { showError(e.message); }).then(function () { setBusy(false); });
  }

  function approve(btn) {
    var token = state.cart && state.cart.approval_token;
    if (!token || state.busy) return;
    showError("");
    btn.disabled = true;
    api("/api/approve", { token: token }).then(function (r) {
      state.usedToken = token;
      r.cart.listing_id = r.cart.listing_id || state.cart.listing_id;
      state.cart = r.cart;
      state.result.trail = state.result.trail.concat(r.trail || []);
      renderAll();
    }, function (e) { showError(e.message); btn.disabled = false; });
  }

  function replayToken(btn) {
    if (!state.usedToken) return;
    btn.disabled = true;
    api("/api/approve", { token: state.usedToken }).then(function (r) {
      state.gateEvent = "Replay: " + r.cart.status;
      state.result.trail = state.result.trail.concat(r.trail || []);
      if (r.cart.status === "placed") state.cart = r.cart;
      renderAll();
    }, function (e) { showError(e.message); btn.disabled = false; });
  }

  function renderMeta(meta) {
    if (!meta) return;
    var m = ui.clear(ui.$("mode"));
    m.hidden = false;
    m.className = "mode" + (meta.live ? " live" : "");
    m.setAttribute("title", meta.live ? "Live adapters enabled" : "Offline dry run");
    ui.append(m, [ui.icon(meta.live ? "globe" : "shield-check", 14), meta.live ? "Live" : "Dry"]);
  }

  // Init modules
  var menuMod = root.JSA.menu.init({});
  var searchMod = root.JSA.search.init(function () { menuMod.close(); runSearch(); });
  searchMod.onFilterChange(function () { if (state.result) renderAll(); });

  var linksMod = root.JSA.links.init(function (target) {
    if (target.q) ui.$("query").value = target.q;
    if (target.budget) ui.$("budget").value = target.budget;
    if (target.ship_to) ui.$("ship_to").value = target.ship_to;
    if (target.cond !== undefined) ui.$("condition_min").value = target.cond;
    state.targetItemId = target.item || "";
    menuMod.close();
    runSearch();
  }, function () {
    var pick = state.result && state.result.picks && state.result.picks[state.selectedIdx];
    return { selectedListingId: pick ? pick.listing.id : "" };
  });

  ui.$("form").addEventListener("submit", runSearch);
  document.querySelectorAll(".example-chip").forEach(function (btn) {
    btn.addEventListener("click", function () {
      ui.$("query").value = btn.getAttribute("data-q") || "";
      ui.$("budget").value = btn.getAttribute("data-budget") || "900";
      runSearch();
    });
  });

  if (linksMod.initial) {
    if (linksMod.initial.q) ui.$("query").value = linksMod.initial.q;
    if (linksMod.initial.budget) ui.$("budget").value = linksMod.initial.budget;
    if (linksMod.initial.ship_to) ui.$("ship_to").value = linksMod.initial.ship_to;
    if (linksMod.initial.cond) ui.$("condition_min").value = linksMod.initial.cond;
    state.targetItemId = linksMod.initial.item || "";
  }

  fetch("/api/meta").then(function (r) { return r.json(); }).then(function (meta) {
    renderMeta(meta);
    if (linksMod.initial && linksMod.initial.run && !meta.live) runSearch();
  }).catch(function () {});
})(window);

</script>
<script>window.addEventListener('DOMContentLoaded',function(){var f=document.getElementById('form');if(f)f.dispatchEvent(new Event('submit',{cancelable:true}));});</script>
</body>
