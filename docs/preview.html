<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Japan Shopping Agent</title>
<style>
/* Japan Shopping Agent — assistant-ui + Commerce UI + AI Elements layout
   with Shibubu Design Tokens + GitHub Primer Octicons v19.42.0 (MIT). Zero external assets. */

:root {
  --bg-app: #f6f7f8;
  --surface-1: #ffffff;
  --surface-2: #f3f5f7;
  --surface-3: #eaedf1;
  --surface-press: #dfe4ea;
  --border: #e2e6ea;
  --border-strong: #b9c1cb;
  --text-primary: #202731;
  --text-secondary: #515d6b;
  --text-tertiary: #6c7682;

  --ink-fill: #202731;
  --ink-fill-hover: #323b47;
  --on-ink: #ffffff;

  --danger: #ab271e;
  --danger-soft: #fdecea;
  --warning: #8a5700;
  --warning-soft: #fdf3dc;
  --success: #17633a;
  --success-soft: #e6f4ec;
  --working: #2359ce;
  --focus-ring: #202731;

  --seg-0: #202731;
  --seg-1: #515d6b;
  --seg-2: #8a5700;
  --seg-3: #17633a;
  --seg-4: #8c959f;
  --seg-5: #b9c1cb;

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --hairline: 1px;
  --shadow-popup: 0 4px 16px rgba(32, 39, 49, 0.08);

  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --dur-hover: 100ms;
  --dur-enter: 180ms;
  --ease-out: cubic-bezier(0.33, 1, 0.68, 1);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-app: #11151b;
    --surface-1: #191e25;
    --surface-2: #232a33;
    --surface-3: #2c3540;
    --surface-press: #36414f;
    --border: #39424d;
    --border-strong: #5d6a78;
    --text-primary: #f1f5f9;
    --text-secondary: #c1cbd5;
    --text-tertiary: #a2afbc;
    --ink-fill: #f1f5f9;
    --ink-fill-hover: #dde5ee;
    --on-ink: #11151b;
    --danger: #ff9d94;
    --danger-soft: #3a1f21;
    --warning: #e7bd70;
    --warning-soft: #352915;
    --success: #7ddaa5;
    --success-soft: #173024;
    --working: #91b5ff;
    --focus-ring: #f1f5f9;
    --seg-0: #e2e8f0;
    --seg-1: #94a3b8;
    --seg-2: #e7bd70;
    --seg-3: #7ddaa5;
    --seg-4: #64748b;
    --seg-5: #475569;
    --shadow-popup: 0 6px 20px rgba(0, 0, 0, 0.36);
  }
}

:root[data-theme="dark"] {
  --bg-app: #11151b;
  --surface-1: #191e25;
  --surface-2: #232a33;
  --surface-3: #2c3540;
  --surface-press: #36414f;
  --border: #39424d;
  --border-strong: #5d6a78;
  --text-primary: #f1f5f9;
  --text-secondary: #c1cbd5;
  --text-tertiary: #a2afbc;
  --ink-fill: #f1f5f9;
  --ink-fill-hover: #dde5ee;
  --on-ink: #11151b;
  --danger: #ff9d94;
  --danger-soft: #3a1f21;
  --warning: #e7bd70;
  --warning-soft: #352915;
  --success: #7ddaa5;
  --success-soft: #173024;
  --working: #91b5ff;
  --focus-ring: #f1f5f9;
  --seg-0: #e2e8f0;
  --seg-1: #94a3b8;
  --seg-2: #e7bd70;
  --seg-3: #7ddaa5;
  --seg-4: #64748b;
  --seg-5: #475569;
  --shadow-popup: 0 6px 20px rgba(0, 0, 0, 0.36);
}

*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg-app); color-scheme: light dark; }
body {
  margin: 0;
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 19px;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
[hidden] { display: none !important; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
a {
  color: var(--text-primary);
  text-decoration: underline;
  text-decoration-color: var(--border-strong);
  text-underline-offset: 2px;
}
a:hover { text-decoration-color: var(--text-primary); }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.octicon { display: inline-block; vertical-align: text-bottom; fill: currentColor; flex: none; }

/* Header (compact 44px) */
.top {
  background: var(--surface-1);
  border-bottom: var(--hairline) solid var(--border);
  position: sticky;
  top: 0;
  z-index: 20;
}
.top-inner {
  max-width: 820px;
  margin: 0 auto;
  height: 44px;
  padding: 0 var(--sp-4);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
}
.brand { display: flex; align-items: center; gap: var(--sp-2); }
.top h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.top-actions { display: flex; align-items: center; gap: var(--sp-2); }
.mode {
  display: inline-flex; align-items: center; gap: 5px;
  height: 22px; padding: 0 8px; border-radius: 999px;
  border: var(--hairline) solid var(--border);
  background: var(--surface-2); color: var(--text-secondary);
  font-size: 12px; font-weight: 500; white-space: nowrap;
}
.mode.live { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }

/* Chat shell (assistant-ui single centered column) */
.chat-shell {
  width: 100%;
  max-width: 820px;
  margin: 0 auto;
  padding: var(--sp-4) var(--sp-4) 0;
  flex: 1;
  display: flex;
  flex-direction: column;
}
.thread {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  padding-bottom: var(--sp-4);
}

/* User message bubble */
.msg-user { display: flex; justify-content: flex-end; animation: bubbleIn 220ms cubic-bezier(0.22, 1, 0.36, 1); }
.bubble {
  max-width: 85%;
  padding: 8px 12px;
  border-radius: var(--radius-lg);
  border-bottom-right-radius: 4px;
  background: var(--surface-3);
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 500;
}

/* Agent turn */
.msg-agent {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  animation: enter 220ms var(--ease-out);
}
.agent-lead {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}
.stale { opacity: 0.5; pointer-events: none; }

/* AI Elements: collapsible agent steps */
.ai-steps {
  background: var(--surface-1);
  border: var(--hairline) solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
}
.ai-steps-head {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 10px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  user-select: none;
}
.ai-steps-head::-webkit-details-marker { display: none; }
.ai-steps-head:hover { background: var(--surface-2); color: var(--text-primary); }
.ai-steps-body {
  border-top: var(--hairline) solid var(--border);
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* Preferences inside AI steps */
.prefs { display: flex; flex-wrap: wrap; gap: 6px 12px; }
.pref { display: inline-flex; align-items: center; gap: 6px; margin: 0; }
.pref dt { font-size: 12px; color: var(--text-tertiary); }
.pref dd { margin: 0; display: inline-flex; flex-wrap: wrap; gap: 4px; font-size: 12px; font-weight: 500; }
.prefs-empty { font-size: 12px; color: var(--text-tertiary); }

/* Commerce UI: compact selectable product cards */
.picks {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--sp-2);
}
.pick {
  background: var(--surface-1);
  border: var(--hairline) solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  animation: cardIn 240ms var(--ease-out) both;
  animation-delay: calc(var(--i, 0) * 45ms);
  transition: transform 140ms var(--ease-out), border-color 140ms var(--ease-out), box-shadow 140ms var(--ease-out);
}
.pick:hover {
  border-color: var(--border-strong);
  transform: translateY(-2px);
  box-shadow: var(--shadow-popup);
}
.pick:active { transform: translateY(0) scale(0.99); }
.pick.selected {
  border-color: var(--text-primary);
  box-shadow: 0 0 0 1px var(--text-primary), var(--shadow-popup);
}
.pick-media {
  height: 112px;
  background: var(--surface-2);
  border-bottom: var(--hairline) solid var(--border);
  display: grid;
  place-items: center;
  position: relative;
  overflow: hidden;
}
.pick .thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
.pick-placeholder { color: var(--text-tertiary); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; }
.pick-badges {
  position: absolute;
  top: 6px; left: 6px; right: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
}
.rank {
  font-family: var(--font-mono);
  font-size: 12px; font-weight: 600;
  padding: 1px 6px; border-radius: 4px;
  background: var(--surface-1); color: var(--text-primary);
  border: var(--hairline) solid var(--border);
}
.tag-cart {
  display: inline-flex; align-items: center; gap: 4px;
  height: 20px; padding: 0 7px; border-radius: 999px;
  background: var(--warning-soft); color: var(--warning);
  font-size: 12px; font-weight: 600;
}
.tag-cart.placed { background: var(--success-soft); color: var(--success); }

.pick-body { padding: 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.pick h3 {
  margin: 0; font-size: 13px; line-height: 18px; font-weight: 600;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.pick-price-row {
  display: flex; align-items: baseline; justify-content: space-between; gap: 6px; margin-top: 2px;
}
.pick-price { font-size: 18px; line-height: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pick-source { font-size: 12px; color: var(--text-secondary); }
.pick-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.pick-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  padding: 6px 10px;
  border-top: var(--hairline) solid var(--border);
  background: var(--surface-2);
  font-size: 12px;
}
.pick-links { display: inline-flex; align-items: center; gap: 10px; }
.ext-link { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; }

/* Selected item Landed Cost breakdown panel */
.cost-panel {
  background: var(--surface-1);
  border: var(--hairline) solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
  animation: enter 200ms var(--ease-out);
}
.cost-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 12px;
  background: var(--surface-2);
  border-bottom: var(--hairline) solid var(--border);
}
.cost-title { font-size: 13px; font-weight: 600; }
.cost-sub { font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.cost-sub .under { color: var(--success); font-weight: 600; }
.cost-sub .over { color: var(--danger); font-weight: 600; }

.lines { list-style: none; margin: 0; padding: 4px 12px; }
.line {
  display: grid; grid-template-columns: 7px 1fr auto; column-gap: 8px; align-items: baseline;
  padding: 6px 0; border-bottom: var(--hairline) solid var(--border);
  animation: rowIn 200ms var(--ease-out) both;
  animation-delay: calc(var(--i, 0) * 28ms);
}
.line:last-child { border-bottom: 0; }
.line .dot { width: 7px; height: 7px; border-radius: 2px; align-self: center; }
.line .label { font-size: 12px; font-weight: 500; text-transform: capitalize; }
.line .label small { margin-left: 4px; font-family: var(--font-mono); color: var(--text-tertiary); text-transform: none; }
.line .amt { font-family: var(--font-mono); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.line .cite {
  grid-column: 2 / 4; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  margin-top: 1px; font-family: var(--font-mono); font-size: 12px; color: var(--text-tertiary);
}
.cite a { color: var(--text-secondary); }
.asof { font-size: 12px; padding: 0 5px; border-radius: 4px; background: var(--surface-2); color: var(--text-secondary); }
.asof.warn { background: var(--warning-soft); color: var(--warning); }

.cost-total-row {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 9px 12px;
  border-top: var(--hairline) solid var(--border);
  background: var(--surface-2);
}
.cost-total-label { font-size: 13px; font-weight: 600; }
.cost-total-num { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cost-why {
  margin: 0; padding: 6px 12px;
  border-top: var(--hairline) solid var(--border);
  font-size: 12px; color: var(--text-secondary);
}
.s0 { background: var(--seg-0); } .s1 { background: var(--seg-1); } .s2 { background: var(--seg-2); }
.s3 { background: var(--seg-3); } .s4 { background: var(--seg-4); } .s5 { background: var(--seg-5); }

/* Chips */
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  height: 20px; padding: 0 7px; border-radius: 999px;
  border: var(--hairline) solid var(--border);
  background: var(--surface-2); color: var(--text-secondary);
  font-size: 12px; font-weight: 500; white-space: nowrap;
}
.chip.c-ink { background: var(--surface-3); border-color: var(--border-strong); color: var(--text-primary); }
.chip.c-red { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
.chip.c-green { background: var(--success-soft); border-color: transparent; color: var(--success); }
.chip.c-amber { background: var(--warning-soft); border-color: transparent; color: var(--warning); }
.chip.struck { text-decoration: line-through; }

.none-found {
  grid-column: 1 / -1;
  background: var(--surface-1);
  border: var(--hairline) dashed var(--border-strong);
  border-radius: var(--radius-md);
  padding: var(--sp-4);
  text-align: center;
  color: var(--text-secondary);
}
.none-found strong { display: block; color: var(--text-primary); margin-bottom: 4px; }

.skipped {
  background: var(--surface-1);
  border: var(--hairline) solid var(--border);
  border-radius: var(--radius-md);
  padding: 8px 10px;
}
.skipped h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.skipped ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 12px; }
.skipped li { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
.skipped code { font-family: var(--font-mono); color: var(--text-primary); }

/* Approval gate card inside chat turn */
.gate {
  border-radius: var(--radius-md);
  border: var(--hairline) solid var(--border-strong);
  background: var(--surface-1);
  overflow: hidden;
  transition: border-color 220ms var(--ease-out), background 220ms var(--ease-out);
  animation: enter 240ms var(--ease-out);
}
.gate.placed .gate-icon { animation: popIn 280ms cubic-bezier(0.22, 1, 0.36, 1); }
.gate-body {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 10px; padding: 10px 12px;
}
.gate-state { display: flex; align-items: center; gap: 8px; }
.gate-icon {
  width: 28px; height: 28px; border-radius: var(--radius-sm);
  display: grid; place-items: center; flex: none;
  background: var(--surface-2); color: var(--text-primary);
}
.gate-kicker { font-size: 13px; font-weight: 600; }
.gate-note { font-size: 12px; color: var(--text-secondary); }
.gate-item { flex: 1 1 200px; min-width: 0; }
.gate-item .t { font-size: 13px; font-weight: 600; }
.gate-item .d { font-size: 12px; color: var(--text-secondary); }
.tok-row { display: inline-flex; align-items: center; gap: 6px; margin-top: 2px; }
.tok { font-family: var(--font-mono); font-size: 12px; color: var(--text-tertiary); }
.gate-item .ev { margin-top: 2px; font-size: 12px; font-weight: 600; color: var(--danger); }
.gate-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.gate.awaiting { border-color: var(--warning); border-left: 3px solid var(--warning); }
.gate.awaiting .gate-icon { background: var(--warning-soft); color: var(--warning); }
.gate.awaiting .gate-kicker { color: var(--warning); }
.gate.placed { border-color: var(--success); border-left: 3px solid var(--success); }
.gate.placed .gate-icon { background: var(--success-soft); color: var(--success); }
.gate.placed .gate-kicker { color: var(--success); }
.gate.stopped { border-color: var(--danger); border-left: 3px solid var(--danger); }
.gate.stopped .gate-icon { background: var(--danger-soft); color: var(--danger); }
.gate.stopped .gate-kicker { color: var(--danger); }
.gate.idle { border-style: dashed; border-color: var(--border); }

/* Trail inside AI steps */
.trail { list-style: none; margin: 0; padding: 0; counter-reset: t; }
.trail li {
  counter-increment: t;
  display: grid; grid-template-columns: 20px 64px 1fr; gap: 6px; align-items: baseline;
  padding: 4px 0; border-bottom: var(--hairline) solid var(--border);
  font-family: var(--font-mono); font-size: 12px; line-height: 16px; overflow-wrap: anywhere;
}
.trail li:last-child { border-bottom: 0; }
.trail li::before { content: counter(t); color: var(--text-tertiary); text-align: right; }
.trail .k {
  font-family: var(--font-sans); font-size: 12px; font-weight: 500;
  text-align: center; padding: 1px 5px; border-radius: 4px;
  background: var(--surface-2); color: var(--text-secondary);
}
.trail .k-skip, .trail .k-refused, .trail .k-reject { background: var(--danger-soft); color: var(--danger); }
.trail .k-pick { background: var(--surface-3); color: var(--text-primary); font-weight: 600; }
.trail .k-cart { background: var(--warning-soft); color: var(--warning); }
.trail .k-approved, .trail .k-memory { background: var(--success-soft); color: var(--success); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  height: 30px; padding: 0 10px;
  border-radius: var(--radius-sm);
  border: var(--hairline) solid var(--border);
  background: var(--surface-1); color: var(--text-primary);
  font-family: var(--font-sans); font-size: 12px; font-weight: 500;
  cursor: pointer; white-space: nowrap;
  transition: background var(--dur-hover) var(--ease-out), transform var(--dur-hover) var(--ease-out);
}
.btn:hover:not(:disabled) { background: var(--surface-3); border-color: var(--border-strong); transform: scale(1.015); }
.btn:active:not(:disabled) { background: var(--surface-press); transform: scale(0.985); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-primary { background: var(--ink-fill); border-color: var(--ink-fill); color: var(--on-ink); font-weight: 600; }
.btn-primary:hover:not(:disabled) { background: var(--ink-fill-hover); border-color: var(--ink-fill-hover); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--text-secondary); }
.btn-ghost:hover:not(:disabled) { background: var(--surface-3); border-color: transparent; color: var(--text-primary); }
.btn-icon { width: 28px; height: 28px; padding: 0; }
.btn-small { height: 24px; padding: 0 8px; }
.btn-copy { height: 20px; padding: 0 6px; }
.btn-danger { border-color: transparent; background: transparent; color: var(--danger); }
.btn-danger:hover:not(:disabled) { background: var(--danger-soft); border-color: transparent; }

/* Empty state */
.empty {
  margin: auto 0;
  padding: 36px 16px;
  text-align: center;
  color: var(--text-secondary);
}
.empty-icon { color: var(--text-tertiary); margin-bottom: 8px; }
.empty-lead { margin: 0 0 12px; font-size: 14px; font-weight: 500; color: var(--text-primary); }
.examples { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.example-chip {
  height: 28px; padding: 0 10px; border-radius: 999px;
  border: var(--hairline) solid var(--border);
  background: var(--surface-1); color: var(--text-secondary);
  font-family: var(--font-sans); font-size: 12px; font-weight: 500; cursor: pointer;
}
.example-chip:hover { background: var(--surface-3); border-color: var(--border-strong); color: var(--text-primary); }

/* Skeleton */
.sk-line, .sk-block {
  border-radius: var(--radius-sm);
  background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.2s ease-in-out infinite;
}

  }

  }
  function append(el, c) {

    el.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }

  function usd(n) { return "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function usd0(n) { return "$" + Number(n).toLocaleString("en-US", { maximumFractionDigits: 2 }); }
  function yen(n) { return "\u00a5" + Number(n).toLocaleString("en-US"); }
  function safeUrl(u) {
    try {
      var x = new URL(u);

    } catch (e) { return null; }
  }
  function totalOf(cost) {
    if (typeof cost.total_usd === "number") return cost.total_usd;
    return Math.round(cost.lines.reduce(function (s, l) { return s + l.amount_usd; }, 0) * 100) / 100;
  }

  function api(path, body) {
    return fetch(path, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) throw new Error(data.error || ("Server returned " + res.status));
        return data;
      });
    }, function () {
      throw new Error("Cannot reach server.");
    });
  }

  function showError(msg) {
    var el = $("error");
    el.hidden = !msg;
    el.textContent = msg || "";
  }

  function setBusy(on, label) {
    state.busy = on;
    $("go").disabled = on;
    $("go-label").textContent = on ? (label || "Searching\u2026") : "Send";
    if (on) {
      $("empty").hidden = true;
      $("results").hidden = true;
      $("skeleton").hidden = false;
    } else {
      $("skeleton").hidden = true;
      if (state.result) $("results").hidden = false;
      else $("empty").hidden = false;
    }
  }

  function tweenUsd(el, target) {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      el.textContent = usd(target);
      return;
    }
    var start = performance.now(), dur = 280;
    function tick(now) {
      var t = Math.min(1, (now - start) / dur);
      var eased = 1 - Math.pow(1 - t, 3);
      el.textContent = usd(target * eased);
      if (t < 1) requestAnimationFrame(tick);
      else el.textContent = usd(target);
    }
    requestAnimationFrame(tick);
  }

  function requestBody() {
    var r = state.result.request;
    return { query: r.query, budget: r.max_total_usd, ship_to: r.ship_to, user_id: r.user_id, condition_min: r.condition_min };
  }

  function runSearch(ev) {
    if (ev) ev.preventDefault();
    if (state.busy) return;
    showError("");
    var rawQuery = $("query").value.trim();
    var budgetVal = $("budget").value;
    var m = rawQuery.match(/\$\s*(\d+(?:\.\d+)?)/);
    if (m) { budgetVal = m[1]; $("budget").value = budgetVal; }
    var body = {
      query: rawQuery, budget: budgetVal, ship_to: $("ship_to").value,
      condition_min: $("condition_min").value || null
    };
    $("user-turn").hidden = false;
    $("user-bubble").textContent = rawQuery + " · max " + usd0(budgetVal) + " · " + body.ship_to;
    setBusy(true);
    api("/api/run", body).then(show, function (e) { showError(e.message); }).then(function () { setBusy(false); });
  }

  function rejectSeller(seller) {
    if (state.busy || !state.result) return;
    showError("");
    var body = requestBody();
    body.seller = seller;
    setBusy(true, "Updating\u2026");
    api("/api/reject", body).then(show, function (e) { showError(e.message); }).then(function () { setBusy(false); });
  }

  function approve(btn) {
    var token = state.cart && state.cart.approval_token;
    if (!token || state.busy) return;
    showError("");
    btn.disabled = true;
    btn.textContent = "Placing\u2026";
    api("/api/approve", { token: token }).then(function (r) {
      state.usedToken = token;
      r.cart.listing_id = r.cart.listing_id || state.cart.listing_id;
      state.cart = r.cart;
      state.result.trail = state.result.trail.concat(r.trail || []);
      renderAll();
    }, function (e) {
      showError(e.message);
      btn.disabled = false;
      clear(btn);
      append(btn, [icon("check", 14), "Approve and place order"]);
    });
  }

  function replayToken(btn) {
    if (!state.usedToken) return;
    btn.disabled = true;
    api("/api/approve", { token: state.usedToken }).then(function (r) {
      state.gateEvent = "Replay of used token: " + r.cart.status + (r.cart.detail ? " (" + r.cart.detail + ")" : "");
      state.result.trail = state.result.trail.concat(r.trail || []);
      if (r.cart.status === "placed") state.cart = r.cart;
      renderAll();
    }, function (e) { showError(e.message); btn.disabled = false; });
  }

  function show(result) {
    state.result = result;
    state.cart = result.cart;
    state.usedToken = null;
    state.gateEvent = null;
    state.selectedIdx = 0;
    $("empty").hidden = true;
    $("skeleton").hidden = true;
    $("results").hidden = false;
    renderAll();
    renderMeta(result.meta);
  }

  function renderAll() {
    renderPrefs();
    renderTrail();
    renderPicks();
    renderCostPanel();
    renderGate();
  }

  function chip(text, cls) { return h("span", { class: "chip" + (cls ? " " + cls : "") }, text); }

  function renderPrefs() {
    var p = state.result.preferences, box = clear($("prefs"));
    var sizes = Object.keys(p.sizes || {});
    var groups = [
      ["Condition", p.condition_min ? [chip(CONDITION[p.condition_min] || p.condition_min, "c-ink")] : []],
      ["Sizes", sizes.map(function (k) { return chip(k + " " + p.sizes[k], "c-ink"); })],
      ["Rejected", (p.rejected_sellers || []).map(function (s) { return chip(s, "c-red struck"); })],
      ["Purchased", (p.past_purchases || []).map(function (s) { return chip(s, "c-green"); })]
    ];
    var known = groups.some(function (g) { return g[1].length; });
    if (!known) {
      box.appendChild(h("span", { class: "prefs-empty" }, "User " + p.user_id + " · no saved preferences"));
      return;
    }
    box.appendChild(h("dl", { class: "pref" }, h("dt", null, "User"), h("dd", null, p.user_id)));
    groups.forEach(function (g) {
      if (!g[1].length) return;
      box.appendChild(h("dl", { class: "pref" }, h("dt", null, g[0]), h("dd", null, g[1])));
    });
  }

  function citeNode(c) {
    c = c || {};
    var url = c.url && safeUrl(c.url);
    var dated = /^\d{4}-\d{2}-\d{2}$/.test(c.as_of || "");
    var src = c.source || "no source";
    return h("div", { class: "cite" },
      url ? h("a", { href: url, target: "_blank", rel: "noopener noreferrer", class: "src" }, src) : h("span", { class: "src" }, src),
      h("span", { class: "asof" + (dated ? "" : " warn") }, c.as_of || "undated"));
  }

  function pickCard(pick, i, inCart) {
    var l = pick.listing, cost = pick.cost;
    var total = totalOf(cost);
    var placed = inCart && state.cart && state.cart.status === "placed";
    var url = safeUrl(l.url);
    var buyeeUrl = l.fields && l.fields.buyee_url ? safeUrl(String(l.fields.buyee_url)) : null;
    var photo = (l.photos || []).map(safeUrl).filter(Boolean)[0];

    var media;
    if (photo) {
      var img = h("img", { class: "thumb", src: photo, alt: l.title_en, loading: "lazy", referrerpolicy: "no-referrer" });
      img.addEventListener("error", function () { img.remove(); });
      media = h("div", { class: "pick-media" }, img);
    } else {
      media = h("div", { class: "pick-media" },
        h("div", { class: "pick-placeholder" }, icon("package", 20), SOURCE[l.source] || l.source));
    }
    media.appendChild(h("div", { class: "pick-badges" },
      h("span", { class: "rank" }, "#" + (i + 1)),
      inCart ? h("span", { class: "tag-cart" + (placed ? " placed" : "") },
        icon(placed ? "check-circle" : "package", 12), placed ? "Ordered" : "In cart") : null));

    var metaChips = [

      chip(l.ships_abroad ? "Ships abroad" : "Via proxy", l.ships_abroad ? "c-green" : "c-amber")

    return h("article", {
      class: "pick" + (i === state.selectedIdx ? " selected" : "") + (inCart ? " in-cart" : ""),
      style: "--i:" + i,
      "data-listing": l.id,

      onclick: function () { state.selectedIdx = i; renderPicks(); renderCostPanel(); }
    },
      media,
      h("div", { class: "pick-body" },
        h("h3", null, l.title_en),
        h("div", { class: "pick-price-row" },
          h("span", { class: "pick-price" }, usd(total)),
          h("span", { class: "pick-source" }, SOURCE[l.source] || l.source)),
        h("div", { class: "pick-meta" }, metaChips)),
      h("div", { class: "pick-foot" },
        h("div", { class: "pick-links" },
          url ? h("a", { href: url, target: "_blank", rel: "noopener noreferrer", class: "ext-link", onclick: function (e) { e.stopPropagation(); } },
            "Listing", icon("link-external", 12)) : null,
          buyeeUrl ? h("a", { href: buyeeUrl, target: "_blank", rel: "noopener noreferrer", class: "ext-link", onclick: function (e) { e.stopPropagation(); } },
            "Buyee", icon("link-external", 12)) : null),
        h("button", {

  }

  function renderPicks() {
    var r = state.result, box = clear($("picks"));
    var cartId = state.cart && state.cart.listing_id;
    $("picks-sub").textContent = r.picks.length
      ? r.picks.length + " matching items found within " + usd0(r.request.max_total_usd)
      : "No matching items found within " + usd0(r.request.max_total_usd);
    if (!r.picks.length) {
      box.appendChild(h("div", { class: "none-found" },
        h("strong", null, "No listing within " + usd0(r.request.max_total_usd)),
        "Raise the max budget or lower the minimum condition."));
    }
    r.picks.forEach(function (p, i) { box.appendChild(pickCard(p, i, p.listing.id === cartId)); });

    var skipped = r.trail.map(function (t) { return /^skip (\S+): (.*)$/.exec(t); }).filter(Boolean);
    var sk = clear($("skipped"));
    sk.hidden = !skipped.length;

      sk.appendChild(h("h3", null, "Filtered out (" + skipped.length + ")"));
      sk.appendChild(h("ul", null, skipped.map(function (m) {

      })));
    }
  }

  function renderCostPanel() {
    var r = state.result, panel = clear($("cost-panel"));
    var pick = r.picks[state.selectedIdx] || r.picks[0];
    if (!pick) { panel.hidden = true; return; }
    panel.hidden = false;
    var l = pick.listing, cost = pick.cost, req = r.request;

        h("span", { class: "dot s" + (n % 6) }),

      h("span", { class: "cost-title" }, "#" + (state.selectedIdx + 1) + " · " + l.title_en),
      h("span", { class: "cost-sub" },
        room >= 0 ? h("span", { class: "under" }, usd(room) + " under") : h("span", { class: "over" }, usd(-room) + " over"),

    panel.appendChild(h("div", { class: "cost-total-row" },
      h("span", { class: "cost-total-label" }, "Estimated landed total (" + req.ship_to + ")"),
      totalEl));
    panel.appendChild(h("p", { class: "cost-why" }, "Rank " + Number(pick.score).toFixed(2) + " · " + pick.reason));
    tweenUsd(totalEl, total);
  }

  var GATE_ICONS = { awaiting: "shield-lock", placed: "check-circle", stopped: "x-circle", idle: "inbox" };

  function gateShell(kind, kicker, note, item, actions) {
    var g = $("gate");
    clear(g).className = "gate " + kind;
    g.appendChild(h("div", { class: "gate-body" },
      h("div", { class: "gate-state" },
        h("div", { class: "gate-icon", "aria-hidden": "true" }, icon(GATE_ICONS[kind] || "inbox", 16)),
        h("div", null, h("div", { class: "gate-kicker" }, kicker), h("div", { class: "gate-note" }, note))),
      h("div", { class: "gate-item" }, item),
      h("div", { class: "gate-actions" }, actions)));
  }

  function renderGate() {
    var r = state.result, cart = state.cart;
    if (!cart) {
      gateShell("idle", "No cart created", "No listing fit within budget.", null, null);
      return;
    }
    var pick = r.picks.filter(function (p) { return p.listing.id === cart.listing_id; })[0] || null;
    var item = [
      pick ? h("div", { class: "t" }, pick.listing.title_en) : null,
      cart.detail ? h("div", { class: "d" }, cart.detail) : null
    ];
    if (cart.status === "awaiting_approval") {
      var copyBtn = h("button", {
        type: "button", class: "btn btn-ghost btn-copy", "aria-label": "Copy approval token",
        onclick: function () {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(cart.approval_token).then(function () {
              clear(copyBtn); append(copyBtn, [icon("check", 12), "Copied"]);
              setTimeout(function () { clear(copyBtn); append(copyBtn, [icon("copy", 12), "Copy"]); }, 1400);
            }).catch(function () {});
          }
        }
      }, icon("copy", 12), "Copy");
      item.push(h("div", { class: "tok-row" }, h("span", { class: "tok" }, "token " + cart.approval_token), copyBtn));
      gateShell("awaiting", "Approval required", "Cart filled. Nothing paid yet.", item, [
        h("button", { type: "button", class: "btn btn-primary", id: "approve", onclick: function (e) { approve(e.currentTarget); } },
          icon("check", 14), "Approve and place order"),
        pick ? h("button", { type: "button", class: "btn btn-small btn-danger", id: "reject", onclick: function () { rejectSeller(pick.listing.seller); } },
          icon("blocked", 14), "Reject " + pick.listing.seller) : null
      ]);
    } else if (cart.status === "placed") {
      if (state.gateEvent) item.push(h("div", { class: "ev" }, state.gateEvent));
      gateShell("placed", "Order placed", "Approved. Single-use token consumed.", item, [
        state.usedToken ? h("button", { type: "button", class: "btn btn-small", id: "replay", onclick: function (e) { replayToken(e.currentTarget); } },
          icon("sync", 14), "Test replay") : null
      ]);
    } else {
      gateShell("stopped", cart.status === "failed" ? "Checkout failed" : "Blocked", "Nothing paid.", item, null);
    }
  }

  var KINDS = [
    [/^recalled /, "recall"], [/^found /, "search"], [/^skip /, "skip"], [/^pick /, "pick"], [/^cart /, "cart"],
    [/^no candidate/, "cart"], [/^rejected seller/, "reject"], [/^approval accepted/, "approved"],
    [/^approval refused/, "refused"], [/^(remembered|could not remember)/, "memory"]
  ];
  function renderTrail() {
    var box = clear($("trail"));
    var trail = state.result.trail || [];
    $("steps-summary").textContent = "Agent steps (" + trail.length + " actions · preferences & reasoning)";
    trail.forEach(function (t) {
      var kind = "step";
      for (var i = 0; i < KINDS.length; i++) if (KINDS[i][0].test(t)) { kind = KINDS[i][1]; break; }
      box.appendChild(h("li", null, h("span", { class: "k k-" + kind }, kind), h("span", { class: "txt" }, t)));
    });
  }

  function renderMeta(meta) {
    if (!meta) return;
    var m = clear($("mode"));
    m.hidden = false;
    m.className = "mode" + (meta.live ? " live" : "");
    append(m, [icon(meta.live ? "globe" : "shield-check", 14), meta.live ? "Live" : "Offline dry run"]);
    var w = meta.wiring || {};
    $("foot").textContent = Object.keys(w).map(function (k) { return k + "=" + w[k]; }).join(" · ");
  }

  function currentTheme() {
    var saved = null;
    try { saved = localStorage.getItem("jsa-theme"); } catch (e) {}
    if (saved === "light" || saved === "dark") return saved;
    return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    var btn = $("theme-toggle");
    if (btn) {
      clear(btn);
      btn.appendChild(icon(theme === "dark" ? "sun" : "moon", 16));
      btn.setAttribute("title", theme === "dark" ? "Switch to light theme" : "Switch to dark theme");
    }
  }
  applyTheme(currentTheme());
  var themeBtn = $("theme-toggle");
  if (themeBtn) {
    themeBtn.addEventListener("click", function () {
      var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      try { localStorage.setItem("jsa-theme", next); } catch (e) {}
      applyTheme(next);
    });
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && !e.metaKey && !e.ctrlKey && !e.altKey) {
      var tag = (document.activeElement && document.activeElement.tagName) || "";
      if (tag !== "INPUT" && tag !== "TEXTAREA" && tag !== "SELECT") {
        e.preventDefault();
        $("query").focus();
        $("query").select();
      }
    }
  });

  $("form").addEventListener("submit", runSearch);
  document.querySelectorAll(".example-chip").forEach(function (btn) {
    btn.addEventListener("click", function () {
      $("query").value = btn.getAttribute("data-q") || "";
      $("budget").value = btn.getAttribute("data-budget") || "900";
      runSearch();
    });
  });

  var qs = new URLSearchParams(location.search);
  if (qs.get("q")) $("query").value = qs.get("q");
  if (qs.get("budget")) $("budget").value = qs.get("budget");
  if (qs.get("ship_to")) $("ship_to").value = qs.get("ship_to");
  if (qs.get("cond")) $("condition_min").value = qs.get("cond");
  fetch("/api/meta").then(function (r) { return r.json(); }).then(function (meta) {
    renderMeta(meta);
    if (qs.get("run") === "1" && !meta.live) runSearch();
  }).catch(function () {});
})();

</script>
<script>window.addEventListener('DOMContentLoaded',function(){var f=document.getElementById('form');if(f)f.dispatchEvent(new Event('submit',{cancelable:true}));});</script>
</body>
</html>
