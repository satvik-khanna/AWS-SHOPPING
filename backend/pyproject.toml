[project]
name = "kai"
version = "0.1.0"
description = "KAI - Japan-focused personal shopping agent with X.com social-drop discovery"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Cognee is heavy; install only when you want the live graph-memory adapter.
cognee = ["cognee>=1.0"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["kai*"]

[tool.setuptools.package-data]
kai = ["fixtures/**/*", "data/**/*", "web/**/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
